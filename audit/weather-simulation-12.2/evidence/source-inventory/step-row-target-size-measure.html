<title>Step row target size</title>
<style>
  /* Declarations transcribed from frontend/node_modules/tailwindcss/stubs/config.full.js
     spacing 1=0.25rem 1.5=0.375rem 2=0.5rem ; borderWidth DEFAULT=1px ; lineHeight none=1
     Font stack from frontend/src/index.css:154 (Inter not loaded here -> system fallback,
     which is the WORST case for width since Inter is wider than Segoe UI at small sizes). */
  html { font-size: 16px; }
  body { margin: 0; background: #18181b; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
  *, *::before, *::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #3f3f46; }
  button { font-family: inherit; font-size: 100%; margin: 0; padding: 0; background: transparent; background-image: none; text-transform: none; }
  #row { display: flex; align-items: center; justify-content: center; gap: 0.375rem; margin-top: 0.375rem; }
  /* text-[9px] leading-none font-bold px-2 py-1 rounded-full border + chipBg(dark) */
  #row > button {
    font-size: 9px; line-height: 1; font-weight: 700;
    padding-left: 0.5rem; padding-right: 0.5rem;
    padding-top: 0.25rem; padding-bottom: 0.25rem;
    border-radius: 9999px; border-width: 1px;
    background-color: #27272a; border-color: #3f3f46; color: #9ca3af;
  }
</style>
<div id="wrap" style="width:360px">
  <div id="row">
    <button>&minus;1d</button><button>&minus;1h</button><button>Now</button><button>+1h</button><button>+1d</button>
  </div>
</div>
<pre id="out" style="color:#eee;font:12px monospace"></pre>
<script>
  const bs = [...document.querySelectorAll('#row > button')];
  const r = bs.map(b => b.getBoundingClientRect());
  const lines = bs.map((b,i) => `${b.textContent}  w=${r[i].width.toFixed(2)}  h=${r[i].height.toFixed(2)}`);
  // WCAG 2.5.8 Spacing exception: 24px-diameter (r=12) circle centred on each bounding box
  const centres = r.map(x => ({x: x.left + x.width/2, y: x.top + x.height/2}));
  let minCentreGap = Infinity, minCircleToBox = Infinity;
  for (let i=0;i<r.length;i++) for (let j=0;j<r.length;j++) if (i!==j) {
    const d = Math.hypot(centres[i].x-centres[j].x, centres[i].y-centres[j].y);
    minCentreGap = Math.min(minCentreGap, d);
    const dx = Math.max(r[j].left - centres[i].x, 0, centres[i].x - r[j].right);
    const dy = Math.max(r[j].top - centres[i].y, 0, centres[i].y - r[j].bottom);
    minCircleToBox = Math.min(minCircleToBox, Math.hypot(dx,dy));
  }
  document.getElementById('out').textContent = lines.join('\n')
    + `\n\nmin centre-to-centre distance = ${minCentreGap.toFixed(2)} px  (circles intersect if < 24)`
    + `\nmin centre-to-other-box distance = ${minCircleToBox.toFixed(2)} px  (circle touches other target if < 12)`
    + `\nSPACING EXCEPTION MET (horizontal) = ${(minCentreGap >= 24 && minCircleToBox >= 12)}`;
  window.__M = {sizes: lines, minCentreGap, minCircleToBox};
</script>
