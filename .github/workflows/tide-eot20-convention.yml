name: Tide EOT20 checks (calendar 2025; public data; never the gate)
# WHY: (1) 2026-11-16 seasonal-convention check (advisor item 3). (2) After G2 run 43891805830 died in the gate step
# ("runner lost communication"), prove the gate's new arm-B evaluator equals pyTMD's own path and fits in memory.
# Calendar 2025 only (NOT the G2 window), public data only, no secrets, no bucket write, no live backend.
# Runs only on pushes to its own branch (never the gate's branch or tag).
on:
  push:
    branches: [claude/tide-m1-eot20-check]
    paths:
      - backend/scripts/tide_eot20_*.py
      - backend/scripts/tide_fes/arms.py
      - .github/workflows/tide-eot20-convention.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install (offline-only)
        run: pip install "pyTMD==3.1.0" netCDF4 numpy pandas
      - name: Equivalence and memory of the gate's arm-B evaluator
        run: python backend/scripts/tide_eot20_equivalence_check.py > eot20_equivalence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tide-eot20-equivalence
          path: eot20_equivalence.json
          if-no-files-found: ignore
          retention-days: 30
