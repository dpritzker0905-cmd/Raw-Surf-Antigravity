              print(f"::error::No parseable chain.xml — the forecast-chain suite did not run ({e}).")
              sys.exit(1)
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          tests = sum(int(s.get('tests', 0)) for s in suites)
          fails = sum(int(s.get('failures', 0)) for s in suites)
          errs = sum(int(s.get('errors', 0)) for s in suites)
          skips = sum(int(s.get('skipped', 0)) for s in suites)
          files = {'.'.join((tc.get('classname') or '').split('.')[:2])
                   for s in suites for tc in s.iter('testcase')}
          files.discard('')
          passed = tests - fails - errs - skips
          print(f"collected {tests} tests across {len(files)} files -> "
                f"{passed} passed, {skips} skipped, {fails} failed, {errs} errors")
