# Raw Surf — CI Pipeline
# Runs lint check, architecture governance, and build verification
name: CI

on:
  # ⛔ `main` WAS MISSING HERE UNTIL 2026-08-05, AND IT MATTERED. `pull_request` already listed
  # `[dev, main]` — but the promotion flow is a fast-forward PUSH, not a PR, so every promotion ran
  # ZERO checks. Measured that day: `git rev-list --count origin/main..origin/dev` = 122 commits
  # landed on `main` with no CI, no LOC gate and no Lighthouse, and `branches/main/protection`
  # returned 404 (neither branch protected).
  # ★ THIS FILE HAS NO `paths:` FILTER, deliberately — every job below runs on every push, which is
  #   what makes them safe to list as REQUIRED status checks. A required check that a path filter
  #   skips is reported MISSING, not passing, and blocks the branch permanently. `loc-check.yml`
  #   HAS such a filter and is therefore NOT required — see its header.
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.21.0]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ⛔ `continue-on-error: true  # Don't block deploys on test failures yet` LIVED HERE until
      # 2026-08-01. Its stated blocker is recorded in the frontend-marine-composition-guards
      # comment below: "widening continue-on-error off wholesale would merge red on those two
      # pre-existing resolve failures, and a gate born red gets disabled." Those two suites
      # (spotGeofenceZoomFloor, MapMarkerLayers.a11y) could not RESOLVE `react-map-gl/maplibre`;
      # fixed in 8856f24d by mapping it in package.json — the lane THIS step reads, which
      # craco.config.js is not. That precondition is now satisfied, measured on a clean worktree
      # at that SHA: FOUR consecutive runs, byte-identical, 178/178 suites, 1640/1640 tests,
      # exit 0 every time. The gate is not born red, so it is allowed to block.
      - name: Run tests
        working-directory: frontend
        run: |
          CI=true npx react-scripts test --watchAll=false --passWithNoTests \
            --json --outputFile=suite-results.json

      # A red test now blocks. Necessary, but NOT sufficient: what hid the two resolve failures for
      # months was never a red — it was a result nobody read. The twin of that failure is a suite
      # that quietly stops being DISCOVERED. Change a testMatch glob and 178 suites become 40, all
      # passing, exit 0, green. That exact shape has bitten this repo four times now
      # (`tests/test_point_*.py` absent from the composition glob; the sim invariants running only
      # on a laptop; a "composition guard suite" running 53 of 408 files; and this step). So this
      # asserts the COUNT, not the colour, and runs even when jest already failed so a coverage
      # collapse is reported instead of hiding behind the first red test.
      - name: "🔍 Assert the frontend suite actually ran"
        if: always()
        working-directory: frontend
        run: |
          node - <<'JS'
          const fs = require('fs');
          // Shrink-only floors. Measured 2026-08-01 on a clean worktree at 8856f24d, four
          // consecutive runs, all identical: 178 suites / 1640 tests / 0 failed. Re-measured at
          // 7930b727 after marineCommitGate landed: 179 suites / 1645 tests / 0 failed — i.e. the
          // tree moved by +1 suite DURING the change that added this gate, which is the argument
          // for a floor with headroom rather than an exact equality that a normal day breaks.
          // ⚠️ Those numbers are WINDOWS-measured and this job runs ubuntu-latest, which could not
          // be executed locally. The floors are therefore set deliberately BELOW the measurement
          // (-2 suites, -40 tests) so the gate cannot be born red on first-run platform variance —
          // which is exactly how the previous gate died. Every historical instance of this defect
          // class was a COLLAPSE (1596 -> 0 effective, 408 -> 53 files), so the margin still
          // catches all of them.
          // ★ RATCHET ME: the first green ubuntu run prints the true counts on the line below.
          //   Raise these to that exact number and the margin disappears. Measured from the run,
          //   never incremented by hand.
          // 2026-08-03 (audit v7): +1 suite / +14 tests (marineGridSeries.antimeridian.test.js).
          // Raised BY THE DELTA, not reset to today's absolute Windows figure — that preserves the
          // deliberate ubuntu margin above rather than silently spending it.
          // September 20: exact hosted run35487375744 at d82032f5 measured 257/2486.
          // Retire the now-observed platform uncertainty and the stale 72/800 gap.
          // Today's additional 2 suites / 56 tests pass locally; ratchet those only
          // after the next hosted receipt, rather than labelling a projection observed.
          // 2026-09-21 (F-15): local Windows now reads 272 suites / 2651 tests — the two new
          // suites are openMeteoProtocolFailure.test.js (14) and truthOverlayLayerTruth.test.js
          // (17). DELIBERATELY NOT RAISED, per the rule two lines up: a local figure is a
          // projection, not a receipt. The pending gap is now 15 suites / 165 tests, and the
          // NEXT hosted green run should be used to ratchet all of it at once.
          // ⚠️ This lag is the documented cost of that rule, not an oversight — the backend lanes'
          // "a floor that lags is not measuring anything" note argues the other way, and the two
          // are reconciled by WHERE the number comes from: hosted receipt raises, local never does.
          // 2026-09-28 (A15-11 mini lane): raised to the HOSTED receipt of dev run 36361175254 at acd1f070
          // (#129), which printed `suites 296/296  tests 2869/2869  failed 0` — the whole pending gap
          // since September 20 (+39 suites / +383 tests), from a receipt, never a local figure. This
          // change's own marineSeriesLimiter.miniLane.test.js (+1 suite / +8 tests) is NOT counted: the
          // next hosted run is its receipt.
          // 2026-09-28 (A15-11, one background request only when idle): raised to the hosted receipt of
          // #131's own run (`suites 297/297  tests 2877/2877  failed 0`), which counted the mini-lane suite
          // this change rewrites test-for-test (8 -> 8), so it adds no suite and no test.
          // 2026-09-28 (recorder settled peak): raised to the hosted receipt of #138's run (`suites 297/297  tests
          // 2879/2879  failed 0`, its +2 prewarm tests). This change's own +2 recorder tests are counted on its run.
          // PR238 hosted 328 suites/3362 tests; add one suite/25 tests, keep margins 31/483.
          // PR240 retains hosted 329/3387; +1 suite/12 scope probes, margins 31/483.
          // Independent audit AS03: hosted CI37177756735 at d5b1fa34 confirms335/3440.
          // Retire the historical 31-suite/483-test gap and guard every new repair test.
          // W03/W05: db20de62 hosted335/3440 + two suites/28 controls; hosted confirmation pending.
          // Point identity, availability, playback and consumer controls: full local346/3582.
          // Daily calendar, mounted label/rollback controls: +1suite/+28tests; projected347/3610.
          // PF01/PF02 transport/cache and mounted viewport controls: +4suites/+37tests.
          // Visual sourcea1cb1ed3 own CI37405974317 full job112083517831: hosted365/3808.
          // Rollover source48c04424 own CI37407541898 job112088337571: actual367/3872.
          // Raise to qualified hosted coverage; no frontend tests added by WS-08.
          // Shared world-coordinate repair adds1suite/94controls; local368/3966 passed.
          // Own hosted confirmation required; preserve the zero-margin frontend ratchet.
          // Mounted zero-coordinate hook: +1 suite/42 controls, local369/4008.
          // WF-02 projection-boundary repair: six real layer/engine/hook controls, local369/4014.
          // Own hosted confirmation pending; retain the zero-margin frontend ratchet.
            // WF-02 diagnostic-fault boundary + fixed native receipt: +1 suite/31 controls.
            // Local final370/4045; new exact-source hosted qualification required.
            // Callback-gap diagnostic: +2 suites /21 fault, interval, privacy and lifecycle controls.
            // Truth cadence/lifecycle adds1suite13tests; exact-source hosted qualification required.
            // Whole-callback/mask CPU timing: +2 suites/31 controls; own hosted confirmation required.
            // Minimum-span and active-zone cache: +22 public engine/painter controls; own hosted required.
            const MIN_SUITES = 377, MIN_TESTS = 4177;
          let r;
          try { r = JSON.parse(fs.readFileSync('suite-results.json', 'utf8')); }
          catch (e) { console.error('✗ no suite-results.json — jest never wrote a result'); process.exit(1); }
          console.log(`suites ${r.numPassedTestSuites}/${r.numTotalTestSuites}  tests ${r.numPassedTests}/${r.numTotalTests}  failed ${r.numFailedTests}`);
          let bad = false;
          if (r.numTotalTestSuites < MIN_SUITES) { console.error(`✗ suites ${r.numTotalTestSuites} < floor ${MIN_SUITES} — the suite NARROWED`); bad = true; }
          if (r.numPassedTests < MIN_TESTS) { console.error(`✗ passed ${r.numPassedTests} < floor ${MIN_TESTS} — coverage SHRANK`); bad = true; }
          if (r.numFailedTests > 0) { console.error(`✗ ${r.numFailedTests} failed`); bad = true; }
          process.exit(bad ? 1 : 0);
          JS

      - name: Build frontend
        working-directory: frontend
        env:
          CI: false  # Allow warnings to not fail build
          REACT_APP_BACKEND_URL: https://raw-surf-antigravity.onrender.com
        run: npm run build

      - name: Build success
        run: echo "✅ Frontend build verified successfully"

  # 2026-07-31 Frontend ESLint gate — the control that was simply absent.
  #
  # No workflow in this directory ran ESLint at all. The job above is NAMED `lint-and-build` and
  # contains no lint step. That absence is the systemic reason a `no-undef` ReferenceError lived
  # 12 days in the WebGL marine render path: `_washOpacityEff` in
  # frontend/src/components/map/WebGLMarineEngine.js was referenced ~370 lines outside the block
  # that declared it (introduced 4da586aa 2026-07-19 against a declaration from 626c905f
  # 2026-07-14). Nothing was looking.
  #
  # That bug class fails SILENTLY. WebGLMarineCustomLayer.js wraps engine.render() in a try/catch
  # whose `errorCount` is a closure variable that is never reset, and it hard-disables the layer
  # once the count passes 3. Three throwing frames turn the GPU marine layer off for the rest of
  # the session behind a single console.warn — the symptom reaches the user as "the heatmap
  # cleared", never as a stack trace.
  #
  # ⚠ TRIGGERS — DO NOT ADD A `paths:` FILTER, here or at the workflow level. This job inherits
  # the workflow `on:` above (push→dev, PR→dev/main), which is unfiltered on purpose. A
  # `paths:`-filtered job is SKIPPED rather than failed when nothing matches, and a skipped
  # required check reports GREEN — the 2026-07-28 finding where a docs-only change sailed through
  # a `paths:`-gated job with a green tick. An unfiltered job costs a couple of runner-minutes;
  # a green tick that means "did not run" costs a production defect.
  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24.21.0
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'   # matches frontend/.node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Two gates in one script (frontend/scripts/check_eslint.js):
      #   1. ALWAYS_ZERO — no-undef and 18 other never-a-style-opinion rules, plus fatal parse
      #      errors. Zero tolerance; these can never be absorbed into the baseline, so
      #      regenerating it cannot launder a real defect into a green build.
      #   2. RATCHET — the frontend's 158 pre-existing errors / 150 warnings are recorded in
      #      frontend/scripts/eslint_baseline.json and are shrink-only. Gating those at zero
      #      today would mean merging red, and a gate born red gets switched off.
      - name: "🔍 ESLint gate (never-zero rules + shrink-only debt ratchet)"
        working-directory: frontend
        run: node scripts/check_eslint.js
        # NO continue-on-error, deliberately. `no-undef` in a render path is not advisory.

  # ⛔⛔ WHY THIS JOB EXISTS AT ALL — the frontend suite CANNOT FAIL CI.
  # `lint-and-build`'s test step carries `continue-on-error: true  # Don't block deploys on test
  # failures yet`, so all 1596 tests across 177 suites run, print, and have their result DISCARDED.
  # Two suites have been failing to even resolve (`react-map-gl/maplibre` from MapWebGL.js and
  # MapMarkerLayers.js) on every run, in CI and locally, byte-identically — and nothing went red.
  # ★★★ THIRD OCCURRENCE OF THIS CLASS in this repo (after `tests/test_point_*.py` missing from the
  # composition glob, and the sim's invariants running only on a laptop). A guard that runs
  # nowhere is indistinguishable from a guard that passes. This job is the narrow, CAN-FAIL lane
  # for the marine composition guards specifically; widening `continue-on-error` off wholesale
  # would merge red on those two pre-existing resolve failures, and a gate born red gets disabled.
  frontend-marine-composition-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24.21.0
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'   # matches frontend/.node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The infobox composes four marine layers whose TIER is chosen independently per layer, and
      # energy flux goes as H^2*T, so a height error is SQUARED. Measured live 2026-08-01: closure
      # separates perfectly on the tier (same-tier <=3%, mixed-tier up to 41%) and the mixed-tier
      # rate predicts the error rate monotonically across all three models (ICON 0%, GFS 21%,
      # EURO 59%). These guards pin that conditional before any Energy card is built on top of it.
      - name: "🌊 Marine card-matrix composition guards (closure · card contract · provenance)"
        working-directory: frontend
        run: |
          set -o pipefail
          CI=true npx react-scripts test --watchAll=false \
            --testPathPattern="marine-card-matrix-closure|forecast-card-swell-vs-surf|marineGlobalPrewarm.seriesReuse|marineTimelineCoverage|useMarineOrchestratorScrubCache.timeline|backendWeatherServiceClient.readOnly|backendWeatherServiceClient.iconStoredTail|ForecastTimeStatus" \
            --json --outputFile=guard-results.json
        # NO continue-on-error. That is the entire point of this job.

      # Shrink-only ratchet on COVERAGE, run even when jest already failed, so a glob that stops
      # matching is reported rather than hidden behind the first red test. `--passWithNoTests` is
      # NOT passed above precisely so an empty match is a failure — but a pattern that matches ONE
      # of the two files would still be "green", which is what this step exists to catch.
      - name: "🔍 Assert the guards actually ran"
        if: always()
        working-directory: frontend
        run: |
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');
          // Floors are shrink-only. Raise them when guards are added; lowering one is a deliberate
          // act that should appear in a diff. Measured 2026-08-01 on a quiet tree at this SHA:
          //   marine-card-matrix-closure.test.js   29 tests   (14 at 1a-0, +4 at 1a-1, +11 at 1a-2)
          //   forecast-card-swell-vs-surf.test.js  19 tests
          //   => 2 suites / 48 tests. MIN_SUITES is EXACT so any drop is red, not quietly narrower.
          // ⬆ 33 -> 37 (1a-1: the #22 bare-'Height' ban, TOTAL-vs-TRAIN, the (est.) disclosure pair)
          // ⬆ 37 -> 48 (1a-2: the derived energy coefficient, the band ladder, coarsen-don't-hide,
          //             magnitude-based precision, and the live-fixture band-span anti-vacuity)
          // Measured from the run each time, never incremented by hand.
          // Audit14: measured 7 suites / 96 tests, including exact-time reuse and timeline truth.
          // This focused discovery floor supplements the blocking full frontend suite.
          // PR238 hosted focused lane 7 suites/96 tests; new source-authority controls add 1/25.
          const MIN_SUITES = 8, MIN_TESTS = 121;
          let r;
          try { r = JSON.parse(fs.readFileSync('guard-results.json', 'utf8')); }
          catch (e) { console.error('✗ no guard-results.json — jest never wrote a result'); process.exit(1); }
          // path.basename, NOT a regex — a `[\\/]` character class does not survive intact through
          // the YAML block scalar + heredoc layers (verified: it arrived as `[\/]`), and a mangled
          // escape in a step that is supposed to PROVE coverage is the wrong place to be clever.
          const files = r.testResults.map((t) => path.basename(t.name)).sort();
          console.log(`suites ${r.numPassedTestSuites}/${r.numTotalTestSuites}  tests ${r.numPassedTests}/${r.numTotalTests}  failed ${r.numFailedTests}`);
          files.forEach((f) => console.log(`  guard: ${f}`));
          let bad = false;
          if (r.numTotalTestSuites < MIN_SUITES) { console.error(`✗ suites ${r.numTotalTestSuites} < floor ${MIN_SUITES}`); bad = true; }
          if (r.numPassedTests < MIN_TESTS) { console.error(`✗ passed ${r.numPassedTests} < floor ${MIN_TESTS}`); bad = true; }
          if (r.numFailedTests > 0) { console.error(`✗ ${r.numFailedTests} failed`); bad = true; }
          process.exit(bad ? 1 : 0);
          JS

  backend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ⚠️ 3.12 BECAUSE THAT IS WHAT PRODUCTION ACTUALLY RUNS - MEASURED, NOT DECLARED.
      # /api/health now reports it: {"python":"3.12","deps_digest":"1fbddd64165a","deps_count":137}.
      # This lane was 3.11 while the server was 3.12, and the gap was not cosmetic: installing the
      # SAME requirements files on both (CI run 31103393912) gave 150 distributions on 3.11 against
      # 146 on 3.12, differing in numpy 2.4.6 vs 2.5.1 and zarr 3.1.6 vs 3.3.0 - the numeric core of
      # the forecast path. A green run on 3.11 was not evidence about the stack production serves.
      # ⛔ THE REST OF .github/workflows IS STILL 3.11, INCLUDING forecast-ingest, precompute,
      #   l2-orphan-sweep AND forecast-calibration-census, WHICH WRITE THE ARTIFACTS THIS SERVER
      #   READS. Producer and consumer therefore still disagree on zarr and numpy. Aligning those is
      #   a separate change: they are scheduled production jobs and need artifact-level verification
      #   (write on both, compare bytes), not a find-and-replace.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -q flake8
          pip install -q -r requirements.txt

      # The April route split imported successfully while function bodies retained
      # missing globals. Keep a targeted dependency guard as well as the fatal-error gate.
      - name: Condition-report runtime dependency guard
        working-directory: backend
        run: flake8 --select=F821 routes/condition_reports

      - name: Lint backend
        working-directory: backend
        run: flake8 --max-line-length=150 --count --select=E9,F63,F7,F82 --show-source --statistics .

  # v89 Governance — File Size Enforcement (<800 LOC)
  # v94: All violations resolved — strict enforcement enabled
  backend-file-size-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: "🔍 Check file sizes (max 800 LOC)"
        working-directory: backend
        run: python scripts/check_file_size.py --path . --max-lines 800
        continue-on-error: false  # v94: All files compliant — strict enforcement

  # v89 Governance — Import Graph Validation
  backend-import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: "🔍 Check for circular imports"
        working-directory: backend
        run: python scripts/check_imports.py --path routes

  # 2026-07-17 Security governance — BOLA/IDOR drift guard (Phase 0-B of the 07-12 user-ID auth
  # review): fails the build when a NEW route accepts a bare `user_id` without one of the five
  # real auth dependencies. The 226 existing offenders live in scripts/bola_baseline.json (the
  # ratchet — shrink-only; regenerate with --write-baseline after triage work). This exact debt
  # was "fixed and declared complete" twice (c1526cdc, 84236b0c) and drifted back 221→226 in five
  # days — enforcement, not convention, is the control. AST-based (regex breaks on nested parens).
  # Widened 2026-10-08: any actor-id argument (payer_id, surfer_id, captain_id, photographer_id, ...),
  # not only `user_id`; the baseline now stores hashes, not route names, and only shrinks.
  backend-bola-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: "🔐 BOLA route guard (no new bare-user_id routes)"
        working-directory: backend
        run: python scripts/check_bola_routes.py

  # 2026-08-01 — ONE FORECAST COMPOSITION guard suite. Until now NO pytest ran in GitHub Actions at
  # all: the only pytest in the entire workflow directory was two shore-normal asset tests inside
  # build-shore-normals.yml, which is workflow_dispatch-only. So every composition guard this repo
  # has written — the structural parity AST check, the observation-gate surfaces, run provenance,
  # geometry readiness, the sim's own contract — was green only when someone ran it by hand.
  # Measured before wiring (2026-08-01): 44 files, 673 passed, 64 skipped, 0 failed, ~2 min.
  #
  # ★ THE ASSERTION IS ON WHAT RAN, NOT ON THE EXIT CODE. The wider backend suite skips more than
  # half its tests (four of the files matched here are live-server integration tests that no-op
  # without REACT_APP_BACKEND_URL), and a green exit over a suite that collected nothing is exactly
  # the coverage-class failure that let the ESLint config glob ts/tsx with no parser and report
  # clean over 21 files it never read. So this job fails if the globs stop matching files or if the
  # passing count collapses — measure FILES PARSED, not finding count.
  backend-sim-composition-guards:
    runs-on: ubuntu-latest
    # CI 34886811636 passed all 1874 guards but used 19m58s of 20m.
    # Keep a bounded five-minute margin; selection and pass floors stay unchanged.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # requirements.txt is what Render installs and carries no test deps at all. requirements-dev
      # is the declared test set — pytest/pytest-asyncio (conftest imports pytest_asyncio, pyproject
      # sets asyncio_mode="auto") plus fastmcp and aiosqlite, both imported at module level by
      # production modules on the SQLite/test lane. Their absence is what failed this job's first
      # cloud run: six guard modules could not even be collected.
      # ⚠️ TWO STEPS, NOT ONE. requirements.txt pins httpx==0.27.2 and every fastmcp release
      # requires httpx>=0.28.1, so resolving both files together is ResolutionImpossible — that is
      # how this job's second cloud run died. Installing the overlay second lets it lift httpx for
      # the test lane only. See backend/requirements-dev.txt for why that divergence is accepted.
      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-dev.txt

      # ✅ 2026-08-01 — THE EXCLUSION LIST WENT FROM SIX MODULES TO TWO. fastmcp still cannot be
      # installed into this app's pinned stack (every release needs httpx>=0.28.1 against a pinned
      # 0.27.2, and forcing it lifts starlette until routes/social dies on `Router.__init__() got an
      # unexpected keyword argument 'on_startup'`) — but that is no longer a reason to skip the
      # sim's guards. `services/weather_pipeline/sim_mcp_shim.py` stands in for the four fastmcp
      # names this app uses, so `weather_sim_mcp` IMPORTS without the framework and REFUSES to
      # `run()` under the stand-in.
      # ⭐ THIS WAS NOT COSMETIC. The four modules it frees include the sim's most load-bearing
      # guards — `test_sim_whatif_baseline` (the ZERO-NETWORK invariant, whose regression `576dcbdd`
      # was 42.2 s of blocking past an MCP client's timeout), `test_sim_forecast_lane` and
      # `test_sim_spots_identity` — all of which had been verified ONLY on a laptop. A guard that
      # runs nowhere will be broken by the first person who does not run it by hand.
      # ⛔ THE TWO THAT REMAIN genuinely need a live server (they exercise startup/dispatch, not
      # composition), so a stand-in cannot answer for them. The exclusion is NAMED here rather than
      # achieved by quietly narrowing a glob, and `tests/test_sim_mcp_shim.py` asserts this list no
      # longer contains what the shim freed — an exclusion outliving its reason is invisible.
      # ⚠️ The exclusion is a grep, NOT pytest's --ignore: --ignore is silently overridden for paths
      # passed explicitly on the command line, which is how a first attempt at this "excluded" four
      # modules that in fact still collected and still ran.
      # ⬇ 2026-08-01: test_sim_whatif_size_curve_and_io_budget.py LEFT this list — it now guards
      # itself with a module-level `pytest.importorskip("fastmcp")`, so it is a COUNTED SKIP here
      # instead of an invisible omission. An excluded file and a passing file look identical in a
      # summary line; a skip is printed, and it returns by itself the day the pin is fixed.
      # ⚠️ AND A CORRECTION, kept because the mistake is the instructive part. I first measured a
      # module-level importorskip in a BARE scratch directory: it emitted one testcase with
