# Raw Surf — CI Pipeline
# Runs lint check, architecture governance, and build verification
name: CI

on:
  # ⛔ `main` WAS MISSING HERE UNTIL 2026-08-05, AND IT MATTERED. `pull_request` already listed
  # `[dev, main]` — but the promotion flow is a fast-forward PUSH, not a PR, so every promotion ran
  # ZERO checks. Measured that day: `git rev-list --count origin/main..origin/dev` = 122 commits
  # landed on `main` with no CI, no LOC gate and no Lighthouse, and `branches/main/protection`
  # returned 404 (neither branch protected).
  # ★ THIS FILE HAS NO `paths:` FILTER, deliberately — every job below runs on every push, which is
  #   what makes them safe to list as REQUIRED status checks. A required check that a path filter
  #   skips is reported MISSING, not passing, and blocks the branch permanently. `loc-check.yml`
  #   HAS such a filter and is therefore NOT required — see its header.
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ⛔ `continue-on-error: true  # Don't block deploys on test failures yet` LIVED HERE until
      # 2026-08-01. Its stated blocker is recorded in the frontend-marine-composition-guards
      # comment below: "widening continue-on-error off wholesale would merge red on those two
      # pre-existing resolve failures, and a gate born red gets disabled." Those two suites
      # (spotGeofenceZoomFloor, MapMarkerLayers.a11y) could not RESOLVE `react-map-gl/maplibre`;
      # fixed in 8856f24d by mapping it in package.json — the lane THIS step reads, which
      # craco.config.js is not. That precondition is now satisfied, measured on a clean worktree
      # at that SHA: FOUR consecutive runs, byte-identical, 178/178 suites, 1640/1640 tests,
      # exit 0 every time. The gate is not born red, so it is allowed to block.
      - name: Run tests
        working-directory: frontend
        run: |
          CI=true npx react-scripts test --watchAll=false --passWithNoTests \
            --json --outputFile=suite-results.json

      # A red test now blocks. Necessary, but NOT sufficient: what hid the two resolve failures for
      # months was never a red — it was a result nobody read. The twin of that failure is a suite
      # that quietly stops being DISCOVERED. Change a testMatch glob and 178 suites become 40, all
      # passing, exit 0, green. That exact shape has bitten this repo four times now
      # (`tests/test_point_*.py` absent from the composition glob; the sim invariants running only
      # on a laptop; a "composition guard suite" running 53 of 408 files; and this step). So this
      # asserts the COUNT, not the colour, and runs even when jest already failed so a coverage
      # collapse is reported instead of hiding behind the first red test.
      - name: "🔍 Assert the frontend suite actually ran"
        if: always()
        working-directory: frontend
        run: |
          node - <<'JS'
          const fs = require('fs');
          // Shrink-only floors. Measured 2026-08-01 on a clean worktree at 8856f24d, four
          // consecutive runs, all identical: 178 suites / 1640 tests / 0 failed. Re-measured at
          // 7930b727 after marineCommitGate landed: 179 suites / 1645 tests / 0 failed — i.e. the
          // tree moved by +1 suite DURING the change that added this gate, which is the argument
          // for a floor with headroom rather than an exact equality that a normal day breaks.
          // ⚠️ Those numbers are WINDOWS-measured and this job runs ubuntu-latest, which could not
          // be executed locally. The floors are therefore set deliberately BELOW the measurement
          // (-2 suites, -40 tests) so the gate cannot be born red on first-run platform variance —
          // which is exactly how the previous gate died. Every historical instance of this defect
          // class was a COLLAPSE (1596 -> 0 effective, 408 -> 53 files), so the margin still
          // catches all of them.
          // ★ RATCHET ME: the first green ubuntu run prints the true counts on the line below.
          //   Raise these to that exact number and the margin disappears. Measured from the run,
          //   never incremented by hand.
          // 2026-08-03 (audit v7): +1 suite / +14 tests (marineGridSeries.antimeridian.test.js).
          // Raised BY THE DELTA, not reset to today's absolute Windows figure — that preserves the
          // deliberate ubuntu margin above rather than silently spending it.
          const MIN_SUITES = 185, MIN_TESTS = 1686;
          let r;
          try { r = JSON.parse(fs.readFileSync('suite-results.json', 'utf8')); }
          catch (e) { console.error('✗ no suite-results.json — jest never wrote a result'); process.exit(1); }
          console.log(`suites ${r.numPassedTestSuites}/${r.numTotalTestSuites}  tests ${r.numPassedTests}/${r.numTotalTests}  failed ${r.numFailedTests}`);
          let bad = false;
          if (r.numTotalTestSuites < MIN_SUITES) { console.error(`✗ suites ${r.numTotalTestSuites} < floor ${MIN_SUITES} — the suite NARROWED`); bad = true; }
          if (r.numPassedTests < MIN_TESTS) { console.error(`✗ passed ${r.numPassedTests} < floor ${MIN_TESTS} — coverage SHRANK`); bad = true; }
          if (r.numFailedTests > 0) { console.error(`✗ ${r.numFailedTests} failed`); bad = true; }
          process.exit(bad ? 1 : 0);
          JS

      - name: Build frontend
        working-directory: frontend
        env:
          CI: false  # Allow warnings to not fail build
          REACT_APP_BACKEND_URL: https://raw-surf-antigravity.onrender.com
        run: npm run build

      - name: Build success
        run: echo "✅ Frontend build verified successfully"

  # 2026-07-31 Frontend ESLint gate — the control that was simply absent.
  #
  # No workflow in this directory ran ESLint at all. The job above is NAMED `lint-and-build` and
  # contains no lint step. That absence is the systemic reason a `no-undef` ReferenceError lived
  # 12 days in the WebGL marine render path: `_washOpacityEff` in
  # frontend/src/components/map/WebGLMarineEngine.js was referenced ~370 lines outside the block
  # that declared it (introduced 4da586aa 2026-07-19 against a declaration from 626c905f
  # 2026-07-14). Nothing was looking.
  #
  # That bug class fails SILENTLY. WebGLMarineCustomLayer.js wraps engine.render() in a try/catch
  # whose `errorCount` is a closure variable that is never reset, and it hard-disables the layer
  # once the count passes 3. Three throwing frames turn the GPU marine layer off for the rest of
  # the session behind a single console.warn — the symptom reaches the user as "the heatmap
  # cleared", never as a stack trace.
  #
  # ⚠ TRIGGERS — DO NOT ADD A `paths:` FILTER, here or at the workflow level. This job inherits
  # the workflow `on:` above (push→dev, PR→dev/main), which is unfiltered on purpose. A
  # `paths:`-filtered job is SKIPPED rather than failed when nothing matches, and a skipped
  # required check reports GREEN — the 2026-07-28 finding where a docs-only change sailed through
  # a `paths:`-gated job with a green tick. An unfiltered job costs a couple of runner-minutes;
  # a green tick that means "did not run" costs a production defect.
  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 18.20.2
        uses: actions/setup-node@v5
        with:
          node-version: '18.20.2'   # matches frontend/.node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Two gates in one script (frontend/scripts/check_eslint.js):
      #   1. ALWAYS_ZERO — no-undef and 18 other never-a-style-opinion rules, plus fatal parse
      #      errors. Zero tolerance; these can never be absorbed into the baseline, so
      #      regenerating it cannot launder a real defect into a green build.
      #   2. RATCHET — the frontend's 158 pre-existing errors / 150 warnings are recorded in
      #      frontend/scripts/eslint_baseline.json and are shrink-only. Gating those at zero
      #      today would mean merging red, and a gate born red gets switched off.
      - name: "🔍 ESLint gate (never-zero rules + shrink-only debt ratchet)"
        working-directory: frontend
        run: node scripts/check_eslint.js
        # NO continue-on-error, deliberately. `no-undef` in a render path is not advisory.

  # ⛔⛔ WHY THIS JOB EXISTS AT ALL — the frontend suite CANNOT FAIL CI.
  # `lint-and-build`'s test step carries `continue-on-error: true  # Don't block deploys on test
  # failures yet`, so all 1596 tests across 177 suites run, print, and have their result DISCARDED.
  # Two suites have been failing to even resolve (`react-map-gl/maplibre` from MapWebGL.js and
  # MapMarkerLayers.js) on every run, in CI and locally, byte-identically — and nothing went red.
  # ★★★ THIRD OCCURRENCE OF THIS CLASS in this repo (after `tests/test_point_*.py` missing from the
  # composition glob, and the sim's invariants running only on a laptop). A guard that runs
  # nowhere is indistinguishable from a guard that passes. This job is the narrow, CAN-FAIL lane
  # for the marine composition guards specifically; widening `continue-on-error` off wholesale
  # would merge red on those two pre-existing resolve failures, and a gate born red gets disabled.
  frontend-marine-composition-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 18.20.2
        uses: actions/setup-node@v5
        with:
          node-version: '18.20.2'   # matches frontend/.node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The infobox composes four marine layers whose TIER is chosen independently per layer, and
      # energy flux goes as H^2*T, so a height error is SQUARED. Measured live 2026-08-01: closure
      # separates perfectly on the tier (same-tier <=3%, mixed-tier up to 41%) and the mixed-tier
      # rate predicts the error rate monotonically across all three models (ICON 0%, GFS 21%,
      # EURO 59%). These guards pin that conditional before any Energy card is built on top of it.
      - name: "🌊 Marine card-matrix composition guards (closure · card contract · provenance)"
        working-directory: frontend
        run: |
          set -o pipefail
          CI=true npx react-scripts test --watchAll=false \
            --testPathPattern="marine-card-matrix-closure|forecast-card-swell-vs-surf" \
            --json --outputFile=guard-results.json
        # NO continue-on-error. That is the entire point of this job.

      # Shrink-only ratchet on COVERAGE, run even when jest already failed, so a glob that stops
      # matching is reported rather than hidden behind the first red test. `--passWithNoTests` is
      # NOT passed above precisely so an empty match is a failure — but a pattern that matches ONE
      # of the two files would still be "green", which is what this step exists to catch.
      - name: "🔍 Assert the guards actually ran"
        if: always()
        working-directory: frontend
        run: |
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');
          // Floors are shrink-only. Raise them when guards are added; lowering one is a deliberate
          // act that should appear in a diff. Measured 2026-08-01 on a quiet tree at this SHA:
          //   marine-card-matrix-closure.test.js   29 tests   (14 at 1a-0, +4 at 1a-1, +11 at 1a-2)
          //   forecast-card-swell-vs-surf.test.js  19 tests
          //   => 2 suites / 48 tests. MIN_SUITES is EXACT so any drop is red, not quietly narrower.
          // ⬆ 33 -> 37 (1a-1: the #22 bare-'Height' ban, TOTAL-vs-TRAIN, the (est.) disclosure pair)
          // ⬆ 37 -> 48 (1a-2: the derived energy coefficient, the band ladder, coarsen-don't-hide,
          //             magnitude-based precision, and the live-fixture band-span anti-vacuity)
          // Measured from the run each time, never incremented by hand.
          const MIN_SUITES = 2, MIN_TESTS = 48;
          let r;
          try { r = JSON.parse(fs.readFileSync('guard-results.json', 'utf8')); }
          catch (e) { console.error('✗ no guard-results.json — jest never wrote a result'); process.exit(1); }
          // path.basename, NOT a regex — a `[\\/]` character class does not survive intact through
          // the YAML block scalar + heredoc layers (verified: it arrived as `[\/]`), and a mangled
          // escape in a step that is supposed to PROVE coverage is the wrong place to be clever.
          const files = r.testResults.map((t) => path.basename(t.name)).sort();
          console.log(`suites ${r.numPassedTestSuites}/${r.numTotalTestSuites}  tests ${r.numPassedTests}/${r.numTotalTests}  failed ${r.numFailedTests}`);
          files.forEach((f) => console.log(`  guard: ${f}`));
          let bad = false;
          if (r.numTotalTestSuites < MIN_SUITES) { console.error(`✗ suites ${r.numTotalTestSuites} < floor ${MIN_SUITES}`); bad = true; }
          if (r.numPassedTests < MIN_TESTS) { console.error(`✗ passed ${r.numPassedTests} < floor ${MIN_TESTS}`); bad = true; }
          if (r.numFailedTests > 0) { console.error(`✗ ${r.numFailedTests} failed`); bad = true; }
          process.exit(bad ? 1 : 0);
          JS

  backend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ⚠️ 3.12 BECAUSE THAT IS WHAT PRODUCTION ACTUALLY RUNS - MEASURED, NOT DECLARED.
      # /api/health now reports it: {"python":"3.12","deps_digest":"1fbddd64165a","deps_count":137}.
      # This lane was 3.11 while the server was 3.12, and the gap was not cosmetic: installing the
      # SAME requirements files on both (CI run 31103393912) gave 150 distributions on 3.11 against
      # 146 on 3.12, differing in numpy 2.4.6 vs 2.5.1 and zarr 3.1.6 vs 3.3.0 - the numeric core of
      # the forecast path. A green run on 3.11 was not evidence about the stack production serves.
      # ⛔ THE REST OF .github/workflows IS STILL 3.11, INCLUDING forecast-ingest, precompute,
      #   l2-orphan-sweep AND forecast-calibration-census, WHICH WRITE THE ARTIFACTS THIS SERVER
      #   READS. Producer and consumer therefore still disagree on zarr and numpy. Aligning those is
      #   a separate change: they are scheduled production jobs and need artifact-level verification
      #   (write on both, compare bytes), not a find-and-replace.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -q flake8
          pip install -q -r requirements.txt

      - name: Lint backend
        working-directory: backend
        run: flake8 --max-line-length=150 --count --select=E9,F63,F7,F82 --show-source --statistics .
        continue-on-error: true  # Warn only, don't block

  # v89 Governance — File Size Enforcement (<800 LOC)
  # v94: All violations resolved — strict enforcement enabled
  backend-file-size-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: "🔍 Check file sizes (max 800 LOC)"
        working-directory: backend
        run: python scripts/check_file_size.py --path . --max-lines 800
        continue-on-error: false  # v94: All files compliant — strict enforcement

  # v89 Governance — Import Graph Validation
  backend-import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: "🔍 Check for circular imports"
        working-directory: backend
        run: python scripts/check_imports.py --path routes

  # 2026-07-17 Security governance — BOLA/IDOR drift guard (Phase 0-B of the 07-12 user-ID auth
  # review): fails the build when a NEW route accepts a bare `user_id` without one of the five
  # real auth dependencies. The 226 existing offenders live in scripts/bola_baseline.json (the
  # ratchet — shrink-only; regenerate with --write-baseline after triage work). This exact debt
  # was "fixed and declared complete" twice (c1526cdc, 84236b0c) and drifted back 221→226 in five
  # days — enforcement, not convention, is the control. AST-based (regex breaks on nested parens).
  backend-bola-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: "🔐 BOLA route guard (no new bare-user_id routes)"
        working-directory: backend
        run: python scripts/check_bola_routes.py

  # 2026-08-01 — ONE FORECAST COMPOSITION guard suite. Until now NO pytest ran in GitHub Actions at
  # all: the only pytest in the entire workflow directory was two shore-normal asset tests inside
  # build-shore-normals.yml, which is workflow_dispatch-only. So every composition guard this repo
  # has written — the structural parity AST check, the observation-gate surfaces, run provenance,
  # geometry readiness, the sim's own contract — was green only when someone ran it by hand.
  # Measured before wiring (2026-08-01): 44 files, 673 passed, 64 skipped, 0 failed, ~2 min.
  #
  # ★ THE ASSERTION IS ON WHAT RAN, NOT ON THE EXIT CODE. The wider backend suite skips more than
  # half its tests (four of the files matched here are live-server integration tests that no-op
  # without REACT_APP_BACKEND_URL), and a green exit over a suite that collected nothing is exactly
  # the coverage-class failure that let the ESLint config glob ts/tsx with no parser and report
  # clean over 21 files it never read. So this job fails if the globs stop matching files or if the
  # passing count collapses — measure FILES PARSED, not finding count.
  backend-sim-composition-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # requirements.txt is what Render installs and carries no test deps at all. requirements-dev
      # is the declared test set — pytest/pytest-asyncio (conftest imports pytest_asyncio, pyproject
      # sets asyncio_mode="auto") plus fastmcp and aiosqlite, both imported at module level by
      # production modules on the SQLite/test lane. Their absence is what failed this job's first
      # cloud run: six guard modules could not even be collected.
      # ⚠️ TWO STEPS, NOT ONE. requirements.txt pins httpx==0.27.2 and every fastmcp release
      # requires httpx>=0.28.1, so resolving both files together is ResolutionImpossible — that is
      # how this job's second cloud run died. Installing the overlay second lets it lift httpx for
      # the test lane only. See backend/requirements-dev.txt for why that divergence is accepted.
      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-dev.txt

      # ✅ 2026-08-01 — THE EXCLUSION LIST WENT FROM SIX MODULES TO TWO. fastmcp still cannot be
      # installed into this app's pinned stack (every release needs httpx>=0.28.1 against a pinned
      # 0.27.2, and forcing it lifts starlette until routes/social dies on `Router.__init__() got an
      # unexpected keyword argument 'on_startup'`) — but that is no longer a reason to skip the
      # sim's guards. `services/weather_pipeline/sim_mcp_shim.py` stands in for the four fastmcp
      # names this app uses, so `weather_sim_mcp` IMPORTS without the framework and REFUSES to
      # `run()` under the stand-in.
      # ⭐ THIS WAS NOT COSMETIC. The four modules it frees include the sim's most load-bearing
      # guards — `test_sim_whatif_baseline` (the ZERO-NETWORK invariant, whose regression `576dcbdd`
      # was 42.2 s of blocking past an MCP client's timeout), `test_sim_forecast_lane` and
      # `test_sim_spots_identity` — all of which had been verified ONLY on a laptop. A guard that
      # runs nowhere will be broken by the first person who does not run it by hand.
      # ⛔ THE TWO THAT REMAIN genuinely need a live server (they exercise startup/dispatch, not
      # composition), so a stand-in cannot answer for them. The exclusion is NAMED here rather than
      # achieved by quietly narrowing a glob, and `tests/test_sim_mcp_shim.py` asserts this list no
      # longer contains what the shim freed — an exclusion outliving its reason is invisible.
      # ⚠️ The exclusion is a grep, NOT pytest's --ignore: --ignore is silently overridden for paths
      # passed explicitly on the command line, which is how a first attempt at this "excluded" four
      # modules that in fact still collected and still ran.
      # ⬇ 2026-08-01: test_sim_whatif_size_curve_and_io_budget.py LEFT this list — it now guards
      # itself with a module-level `pytest.importorskip("fastmcp")`, so it is a COUNTED SKIP here
      # instead of an invisible omission. An excluded file and a passing file look identical in a
      # summary line; a skip is printed, and it returns by itself the day the pin is fixed.
      # ⚠️ AND A CORRECTION, kept because the mistake is the instructive part. I first measured a
      # module-level importorskip in a BARE scratch directory: it emitted one testcase with
      # `classname=''`, which `files.discard('')` drops, so I recorded "adds to skipped, NOT to the
      # module count". THIS RUN SAYS OTHERWISE — 40 → 42 files, i.e. the skipped module DID count.
      # Inside the real `tests/` package (with its conftest) pytest emits the dotted module name.
      # ★ A measurement taken outside the configuration that actually runs is an adjacent question,
      # not a cheaper version of the same one. Harmless here only because the count moved UP and
      # this ratchet is shrink-only.
      - name: "🌊 Composition guard suite (sim ↔ rating ↔ geometry ↔ provenance)"
        working-directory: backend
        run: |
          set -o pipefail
          # ⭐ THE FILE LIST IS NOT HERE. It is `COMPOSITION` in backend/scripts/ci_test_lanes.py,
          # which ALL THREE lanes read: this one selects it, the chain lane subtracts it, the estate
          # lane is its complement. That file carries the rationale for every pattern in it.
          #
          # ⛔⛔ DO NOT INLINE A GLOB HERE, NOT EVEN TO ADD ONE PATTERN. This step carried its own
          # `ls` copy until 2026-08-11 and the chain step below carried a second, so the repo ran
          # THREE lists while `test_flag_lane_parity.py` pinned only the ci.yml pair. That pair
          # therefore stayed honest and the script's tuple silently fell six patterns behind when
          # the memory-safety family was adopted on 2026-08-10 — after which
          # tests/test_health_peak_memory.py ran in THIS lane AND the estate lane, while
          # `--assert-partition` printed "partition OK". The guard whose model feeds the estate
          # executor was the copy that went stale.
          # ⇒ `test_flag_lane_parity.py` now fails if any lane stops delegating or a copy returns.
          #
          # ⚠️ The two fastmcp modules are excluded by the script (FASTMCP_EXCLUDED), not by a grep
          # here — and not by pytest's --ignore, which is silently overridden for paths passed
          # explicitly on the command line. That override is how a first attempt at this "excluded"
          # four modules that in fact still collected and still ran.
          python scripts/ci_test_lanes.py --lane guards > /tmp/guard_files.txt
          # ⛔ AN EMPTY SELECTOR MUST REFUSE, NEVER FALL THROUGH. `pytest $FILES` with FILES unset
          # collects the WHOLE tests/ tree — which would sail past the MIN_FILES floor below on the
          # wrong suite entirely, reporting the broadest possible green for zero selection. A check
          # that cannot tell "selected nothing" from "selected everything" is not a check.
          test -s /tmp/guard_files.txt || { echo "::error::--lane guards selected NO files"; exit 1; }
          sed 's/^/  guard: /' /tmp/guard_files.txt
          FILES=$(tr '\n' ' ' < /tmp/guard_files.txt)
          python -m pytest $FILES -q --junitxml=guards.xml

      # Shrink-only ratchet on COVERAGE, run even when pytest already failed so a collapse in what
      # was collected is reported rather than hidden behind the first red test.
      - name: "🔍 Assert the guards actually ran"
        if: always()
        working-directory: backend
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          # Floors are shrink-only. Raise them when guards are added; lowering one is a deliberate
          # act that should appear in a diff, which is the entire point of a ratchet.
          # Measured 2026-08-01 on the fastmcp-free set: 40 modules, 571 passed locally / ~565 in
          # CI (the six probe guards in test_run_provenance importorskip on fastmcp, which is
          # installable locally and not here). Floor sits below the CI figure, not the local one.
          # ⬆ RAISED 39→40 / 550→559 when test_spot_hub_local_size_reference.py was added (the spot
          # hub's `reference_size_m` waiver closing). Measured both ends rather than incremented:
          # 39 modules/560 passed without that file, 40/571 with its 11 tests.
          # ⚠️ DELIBERATELY CONSERVATIVE, and left that way: a second module (test_sim_local_size_
          # reference.py) landed in this glob from concurrent work while this was measured, so the
          # live total is already higher than the figure above. A floor is a floor — it must not be
          # pinned to a total that another change in flight is still moving. Raise it again from a
          # quiet tree, not from a moving one.
          # MIN_FILES is the exact module count so that ANY drop — a glob that stops matching, an
          # exclusion pattern that widens by accident — is red rather than quietly narrower.
          # ⚠⚠ MEASURE THE FLOOR ON origin/dev, NEVER ON A SHARED WORKING TREE. This read 41/565
          # because my local checkout contained tests/test_spot_hub_local_size_reference.py — a
          # CONCURRENT SESSION'S UNTRACKED FILE. origin/dev has 40 files, so the gate could not
          # be met by anything that ships. Third instance of that class in one session (see also
          # the reference_for_spot ImportError): in a shared tree, ANY measurement that enumerates
          # files or symbols is contaminated by another agent's uncommitted work.
          # These numbers are CI's own reading on origin/dev @ 50e441bd: 631 collected, 40 files,
          # 561 passed, 70 skipped. Floor sits just below that.
          # ⬆⬆ RAISED 42→49 / 580→700 on 2026-08-01 — the biggest single jump this gate has had, and
          # it is COVERAGE, not new tests: `sim_mcp_shim` let four previously-EXCLUDED modules run,
          # and three `importorskip` guards became real passes. The sim's zero-network invariant,
          # live-forecast lane and spot-identity guards now execute in the cloud for the first time.
          #     40 files / 555 passed   (before this session)
          #     42 / 580                (test_sim_served_reference + the un-skipped I/O budget)
          #     49 / 700                (the shim frees the excluded four, + the call-site registry)
          # ★ THE NUMBERS COME FROM THE GATE'S OWN RUN ON origin/dev @ 052326ec — "collected 773
          # tests across 49 files -> 707 passed, 66 skipped, 0 failed" — NOT from a local count.
          # `6c4ab178` was a floor calibrated on a shared working tree holding a concurrent
          # session's UNTRACKED test file, which made the gate unmeetable by anything that ships.
          # In a shared tree, any measurement that enumerates files is contaminated: read the gate.
          # ⚠️ The floor sits just below the observed figure, so the concurrent session's
          # `test_spot_hub_local_size_reference.py` will RAISE it again when they commit — a floor
          # is shrink-only and must never be pinned to a total another change in flight is moving.
          # ⬆ 49→52 / 700→720: `tests/test_point_*.py` joined the glob above (three files, 19
          # tests) after the count stayed byte-identical across a commit that added a 12-test guard.
          # From the gate's own run on origin/dev @ 5466147e: "collected 792 tests across 52 files
          # -> 726 passed, 66 skipped, 0 failed".
          # ⬆⬆ 52→96 / 720→1090. The biggest jump this ratchet has had, and it is COVERAGE:
          # 45 composition test files were never in the glob at all — including
          # test_coarse_gulf_fill.py, test_fetch_common.py and test_partition_fabrication_gate.py.
          # A suite named 'composition guards' was not running the composition guards.
          # From the gate's own run on origin/dev @ e079200c: "collected 1162 tests across
          # 96 files -> 1096 passed, 66 skipped, 0 failed, 0 errors". Read from the gate, never
          # from a checkout (6c4ab178: a floor set from a shared tree holding another session's
          # untracked file was unmeetable by anything that ships).
          # ⬆ 96→102 / 1090→1172 on 2026-08-02. NOT new coverage — the ratchet simply had not been
          # moved since `e079200c` while six more composition files accumulated. Audit v5 F4 found
          # both gates sitting below their live counts, which means files could stop running with
          # the gate still green: the exact silence this ratchet exists to break.
          # From the gate's OWN run on origin/dev @ ff94cb7d: "collected 1244 tests across 102
          # files -> 1178 passed, 66 skipped, 0 failed, 0 errors". Read from the gate, never from a
          # checkout — a clean worktree at the same sha read 104 files / 1204 passed here, because
          # a local run is not this job's environment (`test_weather_sim_mcp` needs a `dev.db` that
          # CI does not have). Two different numbers, and only one of them is the gate's.
          # ⬆ 102→103 / 1172→1179 the same day: `a74f66a6` (a concurrent session's ingest-deadline
          # fix) landed between the reading above and this one, adding a file. Pinned to it because
          # it is COMMITTED, not in flight — the distinction this comment block keeps making. The
          # same session still holds `test_spot_hub_local_size_reference.py` UNTRACKED, and that one
          # must NOT be chased: a floor is shrink-only and pinning it to work another change is
          # still moving makes the gate unmeetable by anything that ships (`6c4ab178`).
          # From the gate's OWN run on origin/dev @ 7ff69cbc: "collected 1251 tests across 103
          # files -> 1185 passed, 66 skipped, 0 failed, 0 errors".
          # ⬆ 103→107 / 1179→1210 (2026-08-02, end of session). Four files joined this lane during
          # the day — `test_partition_band_composition`, `test_marine_ensemble_cost_probe`,
          # `test_surf_transform_docstring_truth`, plus a concurrent session's — and the floor was
          # left behind each time, so by the end four files could have stopped being collected with
          # the gate still green. That is the exact hole audit v5 F4 was about, re-opened by the
          # work that closed it.
          # From the gate's OWN run on origin/dev @ 904f50cf: "collected 1282 tests across 107 files
          # -> 1216 passed, 66 skipped, 0 failed, 0 errors". Read from the gate, never a checkout.
          # ⬆⬆ 110→148 / 1235→1676 on 2026-08-11, and this is the LARGEST STALENESS this floor has
          # carried: 38 files and 447 tests. NOT new coverage — the lane had been selecting 148 files
          # since the memory-safety family was adopted on 2026-08-10, so for that whole period
          # THIRTY-EIGHT files could have stopped being collected with this gate still green. The
          # floor was measuring nothing that had happened in a week.
          # ⚠️ AND THE PROSE HAD FALLEN OUT OF STEP EXACTLY AS THIS BLOCK WARNS. The 110/1235 it
          # replaces arrived with NO entry explaining it — every other value here cites the run it
          # came from, that one cited nothing, so there was no way to tell whether it was current or
          # stale without reading the gate. A number without its reading is not a ratchet, it is a
          # guess that happens to be green. Same shape the estate block records at "275 sits two
          # below 277" written above `MIN_PASSED = 285`.
          # From the gate's OWN run on origin/dev @ 1b447f44 (run 31509178910): "collected 1749
          # tests across 148 files -> 1682 passed, 67 skipped, 0 failed, 0 errors". 1676 sits the
          # customary 6 below the observed pass count; MIN_FILES is EXACT, as this block requires.
          # ★ THAT READING IS ALSO THE CONTROL ON THIS COMMIT'S REFACTOR: it is the last run of the
          # OLD `ls` glob, and `--lane guards`, which replaced it, selects the same 148. The swap is
          # collection-neutral, measured on both sides rather than asserted.
          # ⬆ MIN_PASSED 1676→1685 on 2026-08-11, from the FIRST POST-MERGE run — which also settled
          # the control above: `--lane guards` collected exactly 148 files, so the swap off the `ls`
          # glob is confirmed collection-neutral IN CI and not merely on a workstation.
          # ⚠️ AND THIS ENTRY RECORDS MY OWN BREACH OF THE RULE ONE LANE BELOW. `9857a325` added 9
          # tests to test_flag_lane_parity.py — a file THIS lane collects — without moving this floor
          # in the same commit, which is precisely what the chain lane's capitalised instruction
          # forbids, committed in the change that shipped the mechanism for catching it. The new
          # staleness gate did NOT redden it (lag 15 against a budget of 25), and that leniency is
          # why this entry exists: a floor 15 low is 15 tests that can vanish in silence, and a
          # budget wide enough to be useful is also wide enough to let a small lag sit.
          # From the gate's OWN run on origin/dev @ 9857a325 (run 31514754043): "collected 1758
          # tests across 148 files -> 1691 passed, 67 skipped, 0 failed, 0 errors". The +9 over the
          # prior 1749 is fully attributed — test_flag_lane_parity 23→32, test_sim_mcp_shim unchanged
          # at 5 — so this is bookkeeping, not new coverage. 1685 restores the customary 6 below.
          # ⬆ MIN_FILES 148→149 IN THE SAME COMMIT THAT CAUSES IT. test_flag_lane_parity.py reached
          # 787 of the 800-LOC cap and was split; its CI-lane guards moved to
          # tests/test_ci_lane_single_source.py, which is NAMED in COMPOSITION so the 11 tests stay
          # in THIS lane. So the split is a FILE change, not a test change: 148→149 files, and
          # MIN_PASSED stays 1685 because the lane still collects the same 1691.
          # ★ A SPLIT IS A LANE CHANGE. Had the new file not been named in COMPOSITION it would have
          #   fallen to the estate complement, taking 11 tests with it and putting this lane at 1680
          #   against a floor of 1685 — red, from a refactor that moved no logic at all.
          # ⬆ MIN_PASSED 1685→1695 on 2026-08-12, cited run 31637900295 (3bc776d9), which
          # observed 1701. The staleness guard flagged the floor 16 below the reading against a
          # budget of 6 — a floor beneath the observation cannot detect anything shrinking back
          # to it, which is the whole point of having one. The gap is coverage ADDED (the
          # shadow-A/B, provenance, horizon and telemetry suites), not a lane collecting less.
          # ⬆ MIN_PASSED 1695→1699 on 2026-08-12. Run 31651640516 (d4c4f5d3) observed 1703
          # and the script prescribed 1697, but that would redden on the VERY NEXT RUN: 70fa7144
          # adds 2 more tests to test_rating_shadow_ab.py (31→33), which this lane owns, so the
          # next reading is 1705 and 1705-1697=8 exceeds the budget of 6. The prescription is
          # computed from the last GREEN run and cannot see tests already committed but not yet
          # run. 1705-6=1699 is the floor that survives both readings (lag 4 now, 6 next, and
          # the comparison is strict `>`).
          # ⬆ MIN_PASSED 1699→1701 on 2026-08-13, RAISED BEFORE CI ASKED. Run 31664846960
          # (5ad5afa6) observed 1705 -- which CONFIRMS the 1705 projected in the previous raise
          # (1703+2, arithmetic shown so it could be falsified; it was not). 4d338d30 then added
          # 2 tests to test_rating_shadow_ab.py, which this lane owns, so the next reading is
          # 1707 and 1707-1699=8 would exceed the budget of 6. 1707-6=1701 clears both the
          # current reading (lag 4) and the next (lag 6, and the comparison is strict `>`).
          MIN_FILES, MIN_PASSED = 149, 1701
          try:
              root = ET.parse('guards.xml').getroot()
          except Exception as e:
              print(f"::error::No parseable guards.xml — the suite did not run at all ({e}).")
              sys.exit(1)
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          tests = sum(int(s.get('tests', 0)) for s in suites)
          fails = sum(int(s.get('failures', 0)) for s in suites)
          errs = sum(int(s.get('errors', 0)) for s in suites)
          skips = sum(int(s.get('skipped', 0)) for s in suites)
          # ⚠️ pytest 9's junitxml emits NO `file` attribute — verified 2026-08-01, 0 of 737
          # testcases carried one — so the module is derived from `classname`, which is
          # `tests.test_foo` for function tests and `tests.test_foo.TestBar` for class-based ones.
          # Taking the first two segments counts MODULES and reproduces the 44 globbed files
          # exactly; counting `classname` whole reads 57 and drifts upward with every test class
          # added, which would make this floor measure test STYLE rather than coverage.
          files = {'.'.join((tc.get('classname') or '').split('.')[:2])
                   for s in suites for tc in s.iter('testcase')}
          files.discard('')
          passed = tests - fails - errs - skips
          print(f"collected {tests} tests across {len(files)} files -> "
                f"{passed} passed, {skips} skipped, {fails} failed, {errs} errors")
          bad = []
          if fails or errs:
              bad.append(f"{fails} failed / {errs} errored")
          if len(files) < MIN_FILES:
              bad.append(f"only {len(files)} files collected, floor is {MIN_FILES} — a glob stopped "
                         f"matching, so guards silently went unrun")
          if passed < MIN_PASSED:
              bad.append(f"only {passed} tests passed, floor is {MIN_PASSED} — guards were deleted "
                         f"or mass-skipped")
          if bad:
              for b in bad:
                  print(f"::error::Composition guard suite: {b}")
              sys.exit(1)
          print("Composition guards ran in full and are green.")
          PY

  # 2026-08-01 — THE FORECAST-CHAIN LANE. The composition suite above is deliberately SCOPED to
  # composition, and that scoping quietly left most of the backend's forecast tests running nowhere.
  # Measured at HEAD: 411 tracked test files, 102 matched by that suite's glob, so 309 are CI-ORPHANS
  # — they exist, they are green, and no push executes them. CI runs pytest in exactly two places:
  # the job above, and build-shore-normals.yml, which is workflow_dispatch-only.
  #
  # ⭐ THE STANDOUT: `test_shore_normal.py`, `test_shore_normal_asset.py` and `test_shore_normal_fit.py`
  # cover the HIGHEST-LEVERAGE input in the whole forecast (a coarse bearing is median 24.7 deg off and
  # the rating LEVEL differs at 58.1% of spots) — and they ran ONLY inside the manual asset-build
  # workflow. The #1 Jacobian variable's own tests were dispatch-gated.
  #
  # Adoption cost was MEASURED before this job was written, not assumed: all 63 files pass, 486 tests,
  # 0 failures — and they pass in the CONFIGURATION THAT ACTUALLY RUNS (clean worktree, no `dev.db`,
  # `fastmcp` import blocked), which is the check that catches a test asserting something about the
  # machine it runs on. Local 486 / CI-config 486, so none of them depends on either.
  #
  # ⚠️ A SEPARATE JOB, NOT AN ADDITION TO THE ONE ABOVE. That job measures ~9 min against a 20-minute
  # timeout; +6:48 would leave under 5 minutes of headroom on a runner that is not always fast. In
  # parallel it costs no wall-clock at all.
  #
  # ★ THE FILE SET IS DERIVED, NOT LISTED. It is "tracked test files that import the forecast chain,
  # minus everything the composition glob already takes". A hardcoded list is how the composition glob
  # came to miss 45 of its own files, and how `tests/test_point_*.py` sat outside it for months.
  backend-forecast-chain-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-dev.txt

      - name: "🌊 Forecast-chain guards (bathymetry · shore normal · EURO · calibration · manifest)"
        working-directory: backend
        run: |
          set -o pipefail
          # ⭐ SAME SINGLE SOURCE as the composition lane above. `--lane chain` is "tracked test
          # files that import the forecast chain, MINUS everything COMPOSITION already claims" —
          # and that subtraction is exactly why the two lanes must not each own a list. The
          # exclusion set and the selector are the SAME SET; expressed twice, they diverge.
          #
          # ⛔⛔ THIS STEP HELD AN INLINE `COMPOSITION = [...]` LITERAL UNTIL 2026-08-11 — a 47-entry
          # mirror of the composition lane's `ls` glob, maintained by hand, with its own comment
          # instructing the next reader to "EDIT BOTH, ALWAYS". The pair was pinned equal and did
          # stay equal; what nobody pinned was scripts/ci_test_lanes.py, which had been the declared
          # single source since 2026-08-06 while both copies here outlived it.
          # ★ ADDING A SINGLE SOURCE IS NOT THE SAME ACT AS RETIRING THE COPIES.
          # See ci_test_lanes.py's COMPOSITION block for the measured cost, and the composition lane
          # above for why nothing may be inlined back.
          python scripts/ci_test_lanes.py --lane chain > /tmp/chain_files.txt
          # Same refusal as the composition lane: empty selection would run the whole tests/ tree.
          test -s /tmp/chain_files.txt || { echo "::error::--lane chain selected NO files"; exit 1; }
          sed 's/^/  chain: /' /tmp/chain_files.txt
          FILES=$(tr '\n' ' ' < /tmp/chain_files.txt)
          python -m pytest $FILES -q --junitxml=chain.xml

      - name: "🔍 Assert the forecast-chain guards actually ran"
        if: always()
        working-directory: backend
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          # Measured 2026-08-01 in a clean worktree with no dev.db and fastmcp blocked — the
          # configuration this job actually runs in, never a developer checkout: 63 files, 486 passed,
          # 0 skipped, 0 failed. MIN_FILES is EXACT so any drop (an import that stops matching, a file
          # renamed out of the selector) is red rather than quietly narrower; MIN_PASSED sits just
          # below so a mass-skip is caught without pinning to a total that normal churn moves.
          # ⬆ 63→65 / 480→498 on 2026-08-02. The two files are today's own
          # (`test_shore_normal_borrow_radius.py`, `test_ecmwf_period_bands_ingest.py`) — `a9bd6e35`
          # wrote the new count into its commit message and left the floor at 63, so for a day the
          # gate would have stayed green if both of them stopped being collected. Audit v5 F4.
          # From the gate's OWN run on origin/dev @ ff94cb7d: "collected 504 tests across 65 files
          # -> 504 passed, 0 skipped, 0 failed, 0 errors".
          # ⬆ 65→67 / 498→509. NOT new tests — COVERAGE. Widening the selector to the
          # `from services import <mod>` form adopted two files that were running nowhere:
          # `test_ecmwf_period_bands_decode.py` (5 tests, orphaned the moment it was added) and
          # `test_icon_wind_multi_bbox_fetch.py` (6 tests, orphaned outright — its docstring warns a
          # mis-association would "produce plausible wind at the wrong place, which no smoke test
          # would notice"). 504→515 reconciles to exactly those 11.
          # From the gate's OWN run on origin/dev @ 03d7841b: "collected 515 tests across 67 files
          # -> 515 passed, 0 skipped, 0 failed, 0 errors".
          # ⬆ 67→82 / 519→697 on 2026-08-06, from the gate's OWN run on origin/dev @ db990131:
          # "82 files -> 699 passed, 0 skipped, 0 failed, 0 errors". Cross-checked against a local
          # `ci_test_lanes.py --lane chain`, which also reports 82 — the counts agree, so this is
          # not the local-inflation trap the estate lane's block records (a local 266 once set a
          # floor above CI's achievable 244).
          # ⚠️ THE FLOOR WAS STALE BY 15 FILES, NOT BY THE 4 ADDED TODAY. Only
          # test_event_loop_offload_guard / test_fetcher_http_pooling /
          # test_blockmean_vectorized_parity / test_vector_blockmean_loop_shadow are this session's;
          # the other 11 accumulated earlier without the floor moving. For that whole period **15
          # files could have stopped being collected and this gate would have stayed green** — the
          # exact failure its own 2026-08-02 note describes ("for a day the gate would have stayed
          # green if both of them stopped being collected"), recurring at 7x the size.
          # ⇒ RAISE THIS IN THE SAME COMMIT THAT ADDS THE FILES. A floor that lags is a floor that
          # is not measuring anything.
          # ⬆ 82→85 / 697→780 on 2026-08-11, and the note directly above is the one that dates it:
          # "RAISE THIS IN THE SAME COMMIT THAT ADDS THE FILES." It was not. Three files and 89
          # tests accumulated since 2026-08-06 with the floor untouched, so this lane repeated its
          # own recorded failure for a third time — 2 files in 2026-08-02, 15 in 2026-08-06, 3 now.
          # ★ A RULE WRITTEN IN THE COMMENT ABOVE THE NUMBER DOES NOT ENFORCE ITSELF. All three
          # lanes were found stale in one sweep on 2026-08-11 (composition by 38 files, this by 3,
          # estate 36 tests below achievable), which says the discipline is the wrong mechanism:
          # nothing FAILS when a floor lags, so it lags. ⇒ The durable fix is a check that compares
          # each floor to its lane's last green reading — not another instruction to remember.
          # From the gate's OWN run on origin/dev @ 1b447f44 (run 31509178910): "collected 786 tests
          # across 85 files -> 786 passed, 0 skipped, 0 failed, 0 errors".
          # ⚠️ 780 is 6 below observed, matching this block's 2026-08-02 entries (498/504, 509/515)
          # rather than the 2-below of its 2026-08-06 one. MIN_FILES is EXACT, so a whole file
          # vanishing is red regardless; MIN_PASSED only has to catch tests disappearing from files
          # this lane still collects, and 6 leaves room for ordinary churn without pinning the gate.
          # ★ CONTROL ON THIS COMMIT: 85 is also what `--lane chain` selects after the inline
          # COMPOSITION literal was retired — this lane's file set did not move, only its owner.
          MIN_FILES, MIN_PASSED = 85, 780
          try:
              root = ET.parse('chain.xml').getroot()
          except Exception as e:
              print(f"::error::No parseable chain.xml — the forecast-chain suite did not run ({e}).")
              sys.exit(1)
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          tests = sum(int(s.get('tests', 0)) for s in suites)
          fails = sum(int(s.get('failures', 0)) for s in suites)
          errs = sum(int(s.get('errors', 0)) for s in suites)
          skips = sum(int(s.get('skipped', 0)) for s in suites)
          files = {'.'.join((tc.get('classname') or '').split('.')[:2])
                   for s in suites for tc in s.iter('testcase')}
          files.discard('')
          passed = tests - fails - errs - skips
          print(f"collected {tests} tests across {len(files)} files -> "
                f"{passed} passed, {skips} skipped, {fails} failed, {errs} errors")
          bad = []
          if fails or errs:
              bad.append(f"{fails} failed / {errs} errored")
          if len(files) < MIN_FILES:
              bad.append(f"only {len(files)} files collected, floor is {MIN_FILES} — the import "
                         f"selector stopped matching, so guards silently went unrun")
          if passed < MIN_PASSED:
              bad.append(f"only {passed} tests passed, floor is {MIN_PASSED} — guards were deleted "
                         f"or mass-skipped")
          if bad:
              for b in bad:
                  print(f"::error::Forecast-chain guards: {b}")
              sys.exit(1)
          print("Forecast-chain guards ran in full and are green.")
          PY

  # ⛔⛔ THIS LANE EXISTS BECAUSE SELECTION IS THE DEFECT. The two lanes above pick files by glob
  # and by import regex, and everything neither names runs NOWHERE. Measured 2026-08-06 by
  # EXECUTING both selectors and differencing `git ls-files tests/` (not by reading them):
  #     tracked 445 · guards 122 · chain 77 · fastmcp-excluded 2 · UNCLAIMED 244 (54.8%)
  # Controls, both directions: the union plus the unclaimed equals the tracked set exactly; a
  # known-run file classifies as run; the two NAMED fastmcp modules classify as excluded, not
  # orphaned. `scripts/ci_test_lanes.py` reproduces BOTH existing selectors byte-for-byte (122 and
  # 77, `diff` empty), which is the only reason it is trusted to compute the complement.
  #
  # ⭐ THIS REPO HAS ADOPTED ORPHANS BY HAND FOUR TIMES — the five ERA5 campaign guards,
  # `test_sweep_orphaned_l2.py` (5 tests over the predicate `l2-orphan-sweep.yml` runs as
  # `--delete --yes` against PRODUCTION storage), `test_ecmwf_period_bands_decode.py` and
  # `test_icon_wind_multi_bbox_fetch.py`. Every one was found by an audit, never by CI. A fifth
  # hand-adoption is not the fix. This lane is the COMPLEMENT, so a new file is owned the moment it
  # is committed and there is no pattern anyone can forget to update.
  #
  # ✅ SAFE TO ADD, MEASURED NOT ASSUMED. Every unclaimed file was first run in its OWN subprocess
  # under a 120 s wall clock — pytest-timeout's only method on Windows is `thread`, which kills the
  # whole run on the first hang, so one invocation would have named a hang but destroyed the census:
  #     206 skipped-entirely · 39 passed · 1 no-tests · 0 FAILED · 0 TIMED OUT
  # Then as one invocation, exactly as below: 266 passed, 2,864 skipped, 0 failed, 1 m 54 s.
  # 206 of them skip because they define a module-level BASE_URL and `tests/conftest.py` skips that
  # live estate whenever REACT_APP_BACKEND_URL is unset.
  # ⛔ The "21 passed / 7 FAILED" in MASTER-AUDIT-5.0 was measured WITH that variable set, against a
  # deployed backend. Do NOT set REACT_APP_BACKEND_URL here hoping for more coverage — it would
  # point 206 modules at a live server from CI and import those 7 failures as CI noise.
  #
  # ⚠️ A full-suite lane was measured and REJECTED: `pytest tests/` in one process ran at ~20
  # tests/min (~4 h projected) while these 244 files alone take 1 m 54 s, so the cost is in the
  # other lanes' files and running everything in one process is pathological. Three lanes, not one.
  backend-estate-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Same two-step install, same reason as the lanes above: requirements.txt pins httpx==0.27.2
      # and every fastmcp release needs >=0.28.1, so resolving both files together is
      # ResolutionImpossible. The overlay second lifts httpx for the test lane only.
      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-dev.txt

      # ★ The partition guard runs BEFORE pytest and is the real product of this lane: it fails if
      # any tracked test file is claimed by no lane, if two lanes claim one file, or if a named
      # exclusion has outlived the file it names.
      - name: "🔍 Assert the lanes partition the tracked test estate"
        working-directory: backend
        run: python scripts/ci_test_lanes.py --assert-partition

      # --timeout is per-test so a hang names ITSELF in the report instead of burning the job
      # anonymously; timeout-minutes is the backstop for a hang that escapes pytest entirely.
      - name: "Run every test file no other lane claims"
        working-directory: backend
        run: |
          python scripts/ci_test_lanes.py --lane estate > /tmp/estate_files.txt
          sed 's/^/  estate: /' /tmp/estate_files.txt
          FILES=$(tr '\n' ' ' < /tmp/estate_files.txt)
          python -m pytest $FILES -q --timeout=120 --junitxml=estate.xml

      - name: "🔍 Assert every selected file actually produced results"
        if: always()
        working-directory: backend
        run: |
          python - <<'PY'
          import os, subprocess, sys, xml.etree.ElementTree as ET

          # Files that legitimately yield NO testcases on the runner. NAMED with the reason, never
          # achieved by narrowing a selector, and each asserted below to still exist.
          MAY_BE_EMPTY = {
              # Contains no test functions at all — measured 2026-08-06, `no tests ran`.
              'tests/test_clear_cache_tmp.py': 'no test functions in the file',
              # ⚠️ CAUGHT BY THIS GATE ON ITS FIRST REAL RUN (31065337094), which is the point of
              # checking PER FILE rather than against a total. It passes locally (41 s, the slowest
              # file in the estate) and yields nothing on the runner because lines 18-19 are
              # module-level `pytest.importorskip("pyarrow")` / `("lance")`, and NEITHER is declared
              # in requirements.txt or requirements-dev.txt. That skip is CORRECT — this file drives
              # `scripts/trevec_index_gc.py`, the retention policy whose absence let `.trevec/lance`
              # reach 437 GB — so the fix is to name it here, not to ship pylance into the runner.
              'tests/test_trevec_index_gc.py': 'module-level importorskip on pyarrow/lance, undeclared by design',
          }

          # ✅ SET FROM THE GATE'S OWN RUN, AGAIN — this lane's reading on the PR that added
          # tests/test_password_hashing_py313.py:
          #     "estate: 246 files selected, 244 produced results, 297 passed, 0 silent."
          # Reconciles exactly against the 287 below: +10 from that file's 10 cases.
          # 246 selected - 2 named MAY_BE_EMPTY = 244 producing results.
          # ★ THE FLOOR IS SHIPPED PROVISIONAL AND RAISED FROM THE READING, every time — that is the
          #   discipline the 250 entry below exists to enforce.
          #
          # ⚠️ THE EARLIER VALUES ARE KEPT BECAUSE THE MISTAKE IS THE INSTRUCTIVE PART.
          #   287 — the reading with tests/test_env_parity_instrument.py added; the floor was 285.
          #   277 — the reading with tests/test_dev_identity_gate.py added (run 31100797143);
          #         the floor was 275.
          #   249 — the reading with tests/test_websocket_endpoints_auth.py released from the estate
          #         quarantine (run 31072786555): "243 files selected, 241 produced results, 249
          #         passed, 0 silent." That release made the lane FASTER, not slower — 29.06 s
          #         against 624.76 s — because 600 s of the old figure was five unauthorized-
          #         websocket cases sitting on a handshake the server never answered.
          #   238 — the first green reading, with both files quarantined (run 31066816129 @ 1e00bbcc).
          #   250 — set off a LOCAL 266. CI's real figure with the same file set was 244, so the
          #         floor sat ABOVE the achievable number and would have failed the lane with zero
          #         test failures. A local count is not this gate's count: different OS, fastmcp
          #         present, a populated dev DB and hand-installed packages all inflate it.
          #   235 — deliberately below the predicted post-quarantine range (238-243) while the true
          #         figure was unknown. Ship a floor PROVISIONAL, then set it from the gate itself.
          #
          # 295 sits two below the observed 297: tight enough that a mass-skip or a deleted module
          # is red, loose enough that ordinary churn in a 246-file heterogeneous estate does not
          # pin CI to a total. Raise it when the estate grows — it is shrink-only, and lowering it
          # is a deliberate act that must appear in a diff.
          # ⚠️ KEEP THIS PROSE IN STEP WITH THE NUMBER. Two floors ago the value was bumped with a
          #   sed while these lines still described the previous reading, so the comment said "275
          #   sits two below 277" above `MIN_PASSED = 285` — a stale explanation is worse than none,
          #   because the next reader trusts it.
          # ★ A file COUNT floor is deliberately absent: the per-file "silent" check below is
          #   strictly stronger, and the estate is a COMPLEMENT, so moving a file into another lane
          #   legitimately shrinks it and must not be red.
          # ⬆ 295→320 on 2026-08-11. A RAISE, despite this lane LOSING a file — because the 297 the
          #   prose above describes was long stale. The gate's OWN run on origin/dev @ 1b447f44
          #   (run 31509178910) reads: "estate: 253 files selected, 251 produced results, 331
          #   passed, 0 silent." So the floor sat 36 below achievable and would have absorbed a
          #   mass-skip of an entire module without a word.
          # ⚠️ I FIRST SET THIS TO 286 BY PREDICTION (295 minus the 9 tests moving out) and it was
          #   wrong by 34 — in the SAFE direction, which is exactly what makes it insidious: a floor
          #   too low never goes red, so nothing would ever have corrected it. Predicting from a
          #   stale number inherits the staleness. READ THE GATE; this block's own 250-over-244
          #   entry is the same lesson from the opposite side.
          # THE SUBTRACTION, from the real reading: `tests/test_health_peak_memory.py` was dealt to
          #   THIS lane by the complement while ALSO being matched by the composition lane's `ls`
          #   glob — it ran in BOTH, so 331 includes passes this lane had no business owning.
          #   Returning the memory-safety family to COMPOSITION (where the 2026-08-10 census put it)
          #   removes them. The file is 9 tests, 7 passed / 2 skipped locally, so this lane drops by
          #   7-9 — and gains 8 from tests/test_ci_floor_staleness.py, which the complement claims.
          #   Net expectation: 331 - (7..9) + 8 = 330-332.
          # ⬆ 320→328 on 2026-08-11 — the provisional floor RESOLVED against its first post-merge
          #   reading, which is exactly what the entry it replaces instructed. From the gate's OWN
          #   run on origin/dev @ 9857a325 (run 31514754043): "estate: 253 files selected, 251
          #   produced results, 330 passed, 0 silent." 328 is the customary two below.
          # ★★ THE DERIVATION HELD, AND ITS UNCERTAINTY RESOLVED THE OPPOSITE WAY FROM LOCAL.
          #   331 - 9 + 8 = 330 means ALL NINE of test_health_peak_memory's tests passed on the
          #   runner — including the 2 that SKIP on a workstation. 320 was shipped as the lower
          #   bound of a 330-332 range precisely because that split was unknown; a point estimate
          #   taken from the local 7-passed/2-skipped reading would have put this floor at 332, TWO
          #   ABOVE achievable, failing the lane with zero test failures (the 250-over-244 shape).
          #   ⇒ WHEN A PREDICTION HAS A LOCAL BRANCH AND A CI BRANCH, SHIP THE LOWER BOUND AND
          #     RESOLVE IT FROM THE GATE. This pair of entries is the worked example.
          # ⬆ 328→334 IN THE SAME COMMIT THAT CAUSES IT, which is the whole point. Tightening the
          #   staleness budgets took tests/test_ci_floor_staleness.py from 8 to 14, and that file
          #   lives in THIS lane (the complement claims it). 330 - 8 + 14 = 336; 334 is two below.
          # ★ AND THE LOOSE-FLOOR ESCAPE IS NOW CLOSED, DELIBERATELY. 320 was shipped slack against
          #   an unobserved bound and the old global budget of 25 hid it; with this lane's budget at
          #   its own stated 2, a floor set loose is flagged on the next commit exactly like a floor
          #   forgotten. So this number must be PREDICTED EXACTLY rather than shipped low —
          #   the tightening bought enforcement and spent the ability to hedge.
          # ⚠️ 336 is therefore a prediction, and the 14 tests are pure file-parsing (no network, no
          #   DB, no fastmcp), so the local count should hold on the runner. If this lane comes back
          #   red, THIS is the cause and 334 is the one line to correct — not the lane.
          # ⬆ 334→347 (2026-08-12, WS-CAN-0025). `tests/test_uptime_probe.py` added 13 tests and the
          #   complement claims it: 336 + 13 = 349, and 347 is the customary two below.
          # ★ THIS ONE IS MEASURED, NOT PREDICTED — the distinction the entries above were written
          #   to teach. The gate's OWN run on f8825291 (run 31649898143) reports verbatim:
          #   "estate: 254 files selected, 252 produced results, 349 passed, 0 silent."
          #   The probe's tests are stdlib-only and monkeypatch their one network call, so there is
          #   no local/CI branch to resolve here — but the reading was taken rather than assumed.
          # ⚠️ WHY THIS LANDS ONE COMMIT LATE, AND WHY THAT IS NOT A MISS. The staleness gate grades
          #   the floor against the LAST OBSERVED reading, and that observation cannot exist until
          #   the growing commit has run. So `f8825291` was green on this lane (it produced the 349)
          #   while the gate still compared 334 against the stale 336. The debt then reddens the
          #   NEXT commit, which is usually innocent — `55f2c068`, docs-only, ate exactly that for
          #   the guards lane. ⇒ A GREEN CI ON THE COMMIT THAT ADDS TESTS DOES NOT MEAN THE FLOORS
          #   ARE CURRENT. Read the staleness table, not the job's colour.
          # ⬆ estate MIN_PASSED 347→351 on 2026-08-13, and THE PRE-PUSH HOOK IS WHY. It
          # caught this commit's own 4 new tests (test_check_floor_before_push.py, which falls
          # to the estate COMPLEMENT, not guards) before the push -- the 5th instance of this
          # trap and the first not discovered by a red build. Run 31664846960 observed 349, so
          # 349 + 4 = 353 next, and 353 - 2 (this lane's budget) = 351.
          MIN_PASSED = 351

          try:
              root = ET.parse('estate.xml').getroot()
          except Exception as e:
              print(f"::error::No parseable estate.xml — the estate suite did not run ({e}).")
              sys.exit(1)

          # ⚠️ classname is the DOTTED module path, `tests.test_foo[.TestBar]`, and pytest 9 emits
          # NO `file` attribute. Splitting on '.' and taking [0] yields "tests" for every case and
          # counts ONE module — measured, and it would have made this gate meaningless.
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          mods, passed = set(), 0
          for s in suites:
              for tc in s.findall('testcase'):
                  parts = (tc.get('classname') or '').split('.')
                  if len(parts) > 1 and parts[0] == 'tests':
                      mods.add(parts[1])
                  elif parts and parts[0].startswith('test_'):
                      mods.add(parts[0])
                  if not len(tc):
                      passed += 1

          selected = [l.strip() for l in open('/tmp/estate_files.txt') if l.strip()]
          bad = []
          for f in MAY_BE_EMPTY:
              if not os.path.exists(f):
                  bad.append(f"exemption names a file that no longer exists: {f}")

          # Per-file, not a total: a count floor can be met by coincidence while a file silently
          # stops being collected. This cannot.
          silent = sorted(f for f in selected
                          if os.path.basename(f)[:-3] not in mods and f not in MAY_BE_EMPTY)
          if silent:
              bad.append(f"{len(silent)} selected file(s) produced NO test result: "
                         + ", ".join(silent[:8]))
          if passed < MIN_PASSED:
              bad.append(f"only {passed} passed, floor is {MIN_PASSED} — mass-skip or deletion")

          if bad:
              for b in bad:
                  print(f"::error::Estate coverage: {b}")
              sys.exit(1)
          print(f"estate: {len(selected)} files selected, {len(mods)} produced results, "
                f"{passed} passed, 0 silent.")
          PY

  # ⛔⛔ THE RATCHETS ABOVE DO NOT WATCH THEMSELVES, AND ON 2026-08-11 NONE OF THEM WAS CURRENT.
  # Measured in one sweep against each lane's own green run on origin/dev @ 1b447f44 (31509178910):
  #     composition  floor 110 / 1235   read 148 files / 1682 passed   stale by 38 files, 447 tests
  #     chain        floor  82 /  697   read  85 files /  786 passed   stale by  3 files,  89 tests
  #     estate       floor        295   read           331 passed      stale by         36 tests
  # For the week the composition floor sat at 110, THIRTY-EIGHT files could have stopped being
  # collected with that gate still green — the exact silence the floor exists to break.
  #
  # ★★★ THE RULE WAS ALREADY WRITTEN DOWN AND DID NOT WORK. The chain lane says, in capitals
  # directly above its own stale number, "RAISE THIS IN THE SAME COMMIT THAT ADDS THE FILES. A floor
  # that lags is a floor that is not measuring anything." It lagged three times anyway (2 files, then
  # 15, then 3), and the composition floor arrived with no citation at all while every other value in
  # its block names the run it came from. NOTHING FAILED WHEN A FLOOR LAGGED, SO IT LAGGED.
  # ⇒ A fourth instruction to remember would be the same mechanism a fourth time. This is the one
  #   that does not depend on anyone remembering.
  #
  # ⚠️ IT IS ONE-SIDED ON PURPOSE — it fails only when a floor sits BELOW the last reading. A floor
  # ABOVE it is the correct state immediately after a legitimate raise, because the rule is to raise
  # in the same commit that adds the files. A two-sided check would redden the very behaviour this
  # is meant to enforce. See scripts/ci_floor_staleness.py for the budgets and their derivation.
  #
  # ⚠️ Reads the LAST GREEN run, not this one: a lane cannot grade its own floor without passing
  # first. That costs one commit of lag — a file added in B is caught when B is green and C runs —
  # which turns "stale for a week" into "stale for one commit".
  # ⚠️ `permissions:` is declared HERE and nowhere else in this file, and job-level permissions
  # REPLACE the default set rather than adding to it, so `contents: read` is listed too or checkout
  # loses its token. `actions: read` is the one that matters: reading ANOTHER run's logs is not
  # covered by the default contents-only grant, and without it this job refuses (it does not pass).
  backend-floor-staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # No pip install: the script is stdlib + the `gh` CLI, which is preinstalled on the runner.
      # ⛔ `--branch dev` is PINNED and not derived from the current ref. The lanes accumulate their
      # green history on dev (every push there is also the backend deploy), so a run triggered from
      # main or from a PR must still read dev's history — deriving the branch would make this job
      # refuse on every branch that has no CI history of its own, which is most of them.
      - name: "🔍 Are the ratchet floors still current, or has CI outgrown them?"
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_floor_staleness.py --branch dev
