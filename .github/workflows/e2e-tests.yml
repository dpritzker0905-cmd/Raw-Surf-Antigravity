# ⛔⛔ THIS JOB EXECUTED NOTHING FOR ITS ENTIRE LIFE — 0 of 1,000 measured runs (2026-08-05).
# It gated on `contains(deployment.environment, 'deploy-preview')`. Measured: **0 of 6,482**
# deployments in this repo's history contain that string. The real names are `Preview – <project>`
# (en-dash), and they are emitted by **vercel[bot]**, not Netlify — Netlify creates no GitHub
# deployment at all.
#
# ⛔ AND FIXING THE STRING WOULD HAVE CHANGED NOTHING. The condition also requires
# `state == 'success'`, and the Vercel integration fails on EVERY deployment: 8 of 8 recent
# production builds and 6 of 6 recent preview builds are `failure`. There is no Vercel event that
# can ever satisfy this job.
#
# ⇒ So the trigger now hangs off the target that is actually healthy: the Netlify `dev` preview,
# whose service worker reports `BUILD_VERSION = <dev tip>`. A `push` alone would RACE the Netlify
# build, so the job WAITS for the deployed artifact to match the commit under test, using the same
# one-request instrument that exposed the 77-day-stale production frontend.
# ★ That wait is itself the guard: if the frontend never deploys, this job FAILS instead of
#   quietly testing a stale bundle.
name: E2E Tests

on:
  push:
    branches: [dev]
    # ⛔⛔ A DOCS COMMIT CANNOT CHANGE WHAT THIS LANE TESTS, AND IT CAN DESTROY ANOTHER COMMIT'S
    # ONLY EVIDENCE. Measured 2026-08-10 over the 30 most recent runs: 9 (30%) fired on commits
    # touching nothing but markdown — including `7e231c1b`, a SINGLE-FILE markdown commit whose run
    # is the only genuine E2E failure in the sample (11 failed / 5 flaky, all navigation timeouts).
    # Worse than waste: `cancel-in-progress` below means a docs push KILLS the in-flight run of the
    # code commit before it. From 16:25Z to 17:11Z, EIGHT consecutive runs were cancelled and not
    # one completed — six of those commits were CODE, so end-to-end coverage over that window was
    # zero. Two of the eight were docs.
    # ★ This is a TRIGGER fix, not a concurrency fix — see the block below for why cancelling is
    #   correct here and must stay.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'audit/**'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        default: 'https://dev--rawsurf.netlify.app'
        required: false
      test_grep:
        description: 'Optional test-title regex for a bounded forensic reproduction'
        default: ''
        required: false
      project:
        description: 'Optional exact Playwright project; empty runs every project'
        default: ''
        required: false
      diagnostic_no_retry:
        description: 'Run each selected test once for a fresh reproducible trace'
        type: boolean
        default: false
        required: false

# ⭐⭐⭐ CANCELLING IS CORRECT HERE AND MUST STAY TRUE — the obvious "fix" for a 65% cancellation
# rate is `cancel-in-progress: false`, and it would be WRONG. This lane drives the LIVE DEPLOYED
# site (`E2E_BASE_URL`), not a build of the checked-out tree. A queued run for commit N would
# therefore execute against the deployment of commit N+3 and report its verdict under N's SHA — a
# mislabelled result, which is worse than no result. Superseded runs are genuinely obsolete the
# moment a newer commit deploys, so killing them is honest.
# ⇒ The cancellation rate is not a bug in this block. It is push cadence (9 deploys in 2h41m on
#   2026-08-10) against a ~16-23 min lane, and the levers are the `paths-ignore` above and the
#   standing BATCH PUSHES rule — not this setting.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # ⭐ CHECK THE ENCLOSING BOUND BEFORE ADDING AN INNER WAIT. Worst case is now frontend wait 20 +
    # installs ~2 + backend wait 15 + tests ~8 = ~45 min. At the old 25 the job would have died with a
    # generic job timeout INSTEAD of the specific "the backend did not deploy" error below — the wait
    # would have been added and its diagnostic thrown away. Typical run is ~10 min; both deploys are
    # triggered by the same push and run in parallel (measured 2026-08-07: backend current ~2 min
    # after push, and the installs are spent while it finishes).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # --same-backend compares the served commit's backend with HEAD's (needs history)

      # ⛔⛔ THE WEATHER TRAFFIC OF THIS LANE NO LONGER GOES TO THE LIVE BOX (2026-10-21, owner: "move the CI load off the
      # live server"). ONE 1-CPU Render box serves production AND dev; a map load asks it for three 48-frame world
      # /grid_series pages (~10-13 s of CPU each), and measured 2026-10-20/21 about 90% of grid_series traffic was CI. At
      # 12:30Z /api/health took 13.4 s and grid_series p95 was 42 s while this lane ran. Every spec now imports `test`
      # from e2e/offlineWeather.js, which answers each /api/weather/* request from the REAL backend app over synthetic
      # stored products started HERE (frontend/scripts/offline-backend/), fails closed, and fails the test if any
      # weather response comes from the live box. The deployed site, auth, explore and spot hub stay live: light calls.
      # Started before the waits so the ~3-4 min store build overlaps them and the installs.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies (the in-runner weather backend)
        working-directory: backend
        # + aiosqlite at its requirements-dev.txt pin: with no DATABASE_URL, database.py falls back to sqlite+aiosqlite.
        run: pip install -q -r requirements.txt "$(grep -E '^aiosqlite==' requirements-dev.txt)"

      - name: Start the in-runner synthetic weather backend
        run: bash frontend/scripts/offline-backend/ci_weather_backend.sh start

      - name: Wait for the Netlify dev preview to serve THIS commit
        if: github.event_name == 'push'
        env:
          SITE: https://dev--rawsurf.netlify.app
        run: |
          # `update-sw-version.js` stamps `git rev-parse --short HEAD`, whose length is ADAPTIVE
          # (7, 8, 9...). Comparing against a fixed --short=N would never match and this job would
          # fail forever. So: PREFIX-match the served value against the full SHA.
          full="$(git rev-parse HEAD)"
          echo "waiting for $SITE to serve a BUILD_VERSION that prefixes $full"
          for i in $(seq 1 60); do
            got="$(curl -fsS --max-time 20 "$SITE/service-worker.js" 2>/dev/null \
                   | grep -m1 '^const BUILD_VERSION' \
                   | sed -E "s/.*'([^']+)'.*/\1/")" || got=""
            echo "  attempt $i: serving '${got:-<unreachable>}'"
            case "$got" in
              "") ;;                                   # unreachable / no stamp yet -> keep waiting
              *)
                if [ "${#got}" -ge 7 ] && [ "${full#$got}" != "$full" ]; then
                  echo "deployed build $got matches the commit under test"; exit 0
                fi
                ;;
            esac
            sleep 20
          done
          echo "::error::$SITE never served a build matching $full after 20 minutes."
          echo "::error::The frontend did not deploy. E2E is NOT run rather than run against a stale bundle."
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        # ⛔ WAS `chromium webkit`, and it was wrong the whole time — invisibly, because this job
        # had never executed a single test. playwright.config.js defines FOUR projects: Mobile
        # Safari (webkit), Desktop Chrome (chromium), Desktop **Firefox**, Desktop Safari (webkit).
        # Firefox was never installed, so on the job's first real run every Desktop Firefox test
        # died with `browserType.launch: Executable doesn't exist` — 33 occurrences in the log.
        # ★ Install from the CONFIG rather than a hand-kept list, so adding a project to
        #   playwright.config.js can never again silently outrun the installer.
        run: npx playwright install --with-deps

      # ⛔⛔ THE OTHER HALF OF THE RACE — the half that was actually failing the suite.
      # `on: push: [dev]` starts this run AND the Render backend redeploy at the same instant, and
      # until now the job gated ONLY on the Netlify frontend. Trace forensics (run 31197681499):
      # the backend booted 140 s AFTER the run began; of 112 requests exactly 2 never completed, and
      # they were the last two (`/api/conditions/batch`, `/api/explore/spot-details/<uuid>`). The
      # spot hub therefore sat in its loading skeleton and `close-spothub-btn` was never rendered.
      # ⚠️ RAISING TIMEOUTS COULD NOT FIX THIS and twice did not: the tests were not slow, they were
      # talking to a backend that was still booting. Ordering was always the root.
      #
      # This gate is placed AFTER the installs deliberately — `npm ci` + browser download is ~1-2 min
      # of deploy time earned for free — and immediately before the tests, because "the backend is
      # current" matters at the moment the tests START, not five minutes earlier.
      #
      # Measured 2026-08-07: a push to `dev` redeploys Render every time, completing ~2 min after the
      # push (`f85fdeda` -> `7a002e8b`, observed by polling `/api/health`). 20 min of headroom is ~10x
      # that, because Render deploys have been observed to run long.
      # ★ Like the frontend wait above, FAILING here is the point: a clear "the backend never
      #   deployed" beats 15 rotating browser timeouts that look like flaky tests. `retries: 2` in
      #   playwright.config.js is what turned that race into an alternating failed/flaky signal —
      #   3 attempts vs a probabilistic timeout gives "failed" at 3/3 over and "flaky" at 1-2/3.
      # ★ READY = serving THIS commit AND finished with its first L2 restore (2026-09-29). Serving the commit is only
      #   half: a freshly booted box then downloads the L2 manifest, and `weather_readiness.restore_status` reads
      #   "pending" until that finishes. Run 36505096034 started its tests the second the new SHA answered and failed
      #   its first spot-hub load mid-restore; the re-run on a restored box passed in 10 s. The decision lives in
      #   backend/scripts/e2e_backend_ready.py (stdlib, unit-tested by tests/test_e2e_backend_ready.py).
      - name: Wait for the Render backend to serve THIS commit and finish restoring
        if: github.event_name == 'push'
        env:
          API: https://raw-surf-antigravity.onrender.com
        # --same-backend: Render's build filter skips frontend-only and docs-only commits, so a box still on an earlier commit
        # with the SAME backend code (same newest commit outside RENDER_IGNORED_PATHS) is current. A backend change still waits.
        run: python3 backend/scripts/e2e_backend_ready.py "$(git rev-parse HEAD)" "$API" 60 15 --same-backend

      # Fails the job (with the server log) rather than run weather specs against nothing: weather requests are never
      # forwarded to the live box, so an absent local backend would turn into a wall of 502s, not a silent fallback.
      - name: Wait for the in-runner synthetic weather backend
        run: bash frontend/scripts/offline-backend/ci_weather_backend.sh wait 120

      - name: Run E2E tests
        # Stop the test step before the job bound so always() can retain failure traces.
        timeout-minutes: 40
        working-directory: frontend
        env:
          # Every /api/weather/* request goes here, not to the live backend (e2e/offlineWeather.js).
          E2E_WEATHER_BACKEND: http://127.0.0.1:4100
          E2E_WEATHER_LEDGER: /tmp/e2e-weather-routing.jsonl
          E2E_UI_ISOLATION_LEDGER: /tmp/e2e-ui-isolation.jsonl
          E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://dev--rawsurf.netlify.app' }}
          E2E_TEST_GREP: ${{ github.event.inputs.test_grep || '' }}
          E2E_PROJECT: ${{ github.event.inputs.project || '' }}
          E2E_DIAGNOSTIC_NO_RETRY: ${{ github.event.inputs.diagnostic_no_retry || 'false' }}
          # The deployed site is behind AccessCodeScreen, whose dev-bypass only covers localhost.
          # Without this the very first page.goto of every spec lands on "Enter Access Code" and the
          # whole lane fails -- which is exactly what happened once the gate was fixed on
          # 2026-09-02 (it had been unable to render at all, so this lane passed by accident).
          # playwright.config.js seeds it into localStorage; an unset secret fails LOUDLY there
          # rather than being silently bypassed. Rotate this whenever the site access code changes.
          E2E_ACCESS_CODE: ${{ secrets.E2E_ACCESS_CODE }}
        # ⛔ `list` FIRST, then `html`. With `--reporter=html` alone, stdout carried ONLY the
        # aggregate ("47 passed, 5 skipped") — no test names, no skip reasons. This spec's whole
        # design is to REFUSE rather than fake a pass (six `test.skip(cond, reason)` gates), and the
        # aggregate threw away exactly the reason each gate emitted. The 2026-08-09 audit read that
        # green twice and drew the WRONG conclusion twice — first "the weather spec never ran"
        # (false: 12 tests x 4 projects reconciles), then "the GL lane is a skip, not a pass"
        # (false: MEASURED, the GL test PASSES on Desktop Chrome both with a GPU and under
        # --disable-gpu/SwiftShader — see audit/weather-simulation-11.0/evidence/webgl/gl-lane-probe.js).
        # A refusal that cannot be read is indistinguishable from a pass. `list` names every test and
        # its status on stdout; `html` keeps the artifact for traces.
        run: |
          # Arguments are quoted array entries, never interpolated shell source.
          # Push acceptance keeps the full suite and existing retries; filters are dispatch-only.
          # Credential-bearing browser contexts must stay untraced, including diagnostics.
          node --test scripts/seededUiBadges.test.cjs scripts/seededUiIsolation.test.cjs
          node --test scripts/offlineWeatherRoute.test.cjs
          args=(--reporter=list,html --trace=off)
          if [ -n "$E2E_TEST_GREP" ]; then args+=(--grep "$E2E_TEST_GREP"); fi
          if [ -n "$E2E_PROJECT" ]; then args+=(--project "$E2E_PROJECT"); fi
          if [ "$E2E_DIAGNOSTIC_NO_RETRY" = "true" ]; then args+=(--retries=0); fi
          npx playwright test "${args[@]}"

      # The receipt, on the run page: weather requests answered in the runner vs weather responses from the live box
      # (must be 0; offlineWeather.js already fails any test that saw one). One ledger row per test attempt.
      - name: Weather routing receipt
        if: always()
        run: |
          node - <<'JS'
          const fs = require('fs');
          const file = '/tmp/e2e-weather-routing.jsonl';
          const rows = fs.existsSync(file) ? fs.readFileSync(file, 'utf8').split('\n').filter(Boolean).map(JSON.parse) : [];
          const sum = (k) => rows.reduce((n, r) => n + (r[k] || 0), 0);
          const byEndpoint = {}; const byProject = {};
          for (const r of rows) {
            for (const [k, v] of Object.entries(r.byEndpoint || {})) byEndpoint[k] = (byEndpoint[k] || 0) + v;
            byProject[r.project] = (byProject[r.project] || 0) + (r.routedToLocal || 0);
          }
          const lines = ['### E2E weather traffic: in-runner backend, not the live box', '',
            `- test attempts recorded: ${rows.length}`,
            `- weather requests answered by the in-runner backend: **${sum('routedToLocal')}** (${JSON.stringify(byEndpoint)})`,
            `- per project: ${JSON.stringify(byProject)}`,
            `- weather responses from the LIVE backend: **${sum('sentToLive')}**`,
            `- local backend did not answer: ${sum('localFailures')} · dropped by the page first: ${sum('cancelledByPage')} · preflights/writes answered here: ${sum('answeredHere')}`];
          console.log(lines.join('\n'));
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          JS

      - name: Seeded UI isolation receipt
        if: always()
        run: |
          node - <<'JS'
          const fs = require('fs');
          const path = '/tmp/e2e-ui-isolation.jsonl';
          const rows = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').split('\n').filter(Boolean).map(JSON.parse) : [];
          const sum = key => rows.reduce((total, row) => total + (row[key] || 0), 0);
          const violations = rows.reduce((total, row) => total + (row.violations || []).length, 0);
          const lines = ['### Seeded UI request isolation', '',
            `- test attempts recorded: ${rows.length}`,
            `- fictional admin reads: ${sum('adminReads')} · diagnostic reads: ${sum('diagnosticsReads')}`,
            `- sockets isolated before server connection: admin ${sum('adminSockets')} · call ${sum('callSockets')} · realtime ${sum('realtimeSockets')}`,
            `- RUM requests answered locally: ${sum('rumAnswered')} · unmarked RUM responses: ${sum('rumLeaks')}`,
            `- unexpected protected requests blocked: ${sum('blocked')} · isolation violations: ${violations}`];
          console.log(lines.join('\n'));
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          if (!rows.length || sum('rumLeaks') || sum('blocked') || violations) process.exitCode = 1;
          JS

      - name: Upload request isolation receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-request-isolation
          path: |
            /tmp/e2e-weather-routing.jsonl
            /tmp/e2e-ui-isolation.jsonl
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          # Per-test evidence exists even if the process is killed before HTML is finalized.
          # Tracing stays disabled: authenticated storageState must never enter artifacts.
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
