# MARINE NIGHTLY STABILITY NET (2026-07-18, structural review items #2/#4).
# Two independent nets:
#   data-contract  — the live resolver-ladder + product-edge contract (frontend/scripts/
#                    ladder-contract.js): tier demotions (the snap-overshoot bug class) and
#                    fencepost dead-edge regressions fail the run in minutes.
#   zoomlab-battery — the real-gesture staircase battery + verdict engine against a dev-server
#                    boot (mock auth). Fails when findings exceed the documented budget below.
#                    ⛔ Its WEATHER data comes from the real backend app over synthetic stored
#                    products started IN THE RUNNER (2026-10-21, owner: "move the CI load off the
#                    live server"): the 12:13Z run that day was REFUSED for 15 s timeouts while CI
#                    kept the 1-CPU box saturated. The app's other calls (profile, spots, badges)
#                    still go to prod; they are light.
# data-contract stays live ON PURPOSE: its question is prod's own resolver ladder and stored
# product edges, which a synthetic store cannot answer. It is 12 sequential /grid GETs a day.
name: Marine Nightly (contract + zoomlab)

on:
  workflow_dispatch:
    inputs:
      skip_live_contract:
        description: 'Skip data-contract (its 12 /grid GETs to prod) and run only the offline zoomlab battery'
        type: boolean
        default: false
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC daily — after the 04:15Z ingest cycle's serve restore

jobs:
  data-contract:
    if: ${{ !inputs.skip_live_contract }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
      - name: Resolver ladder + edge contract vs prod
        run: node frontend/scripts/ladder-contract.js

  zoomlab-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # The in-runner weather backend (frontend/scripts/offline-backend/): started first so its ~3-4 min store build
      # overlaps the installs below. zoomlab.js routes every /api/weather/* request to it (ZL_WEATHER_BACKEND).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies (the in-runner weather backend)
        working-directory: backend
        run: pip install -q -r requirements.txt
      - name: Start the in-runner synthetic weather backend
        run: bash frontend/scripts/offline-backend/ci_weather_backend.sh start
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps
      - name: Verify request evidence with controlled browser failures
        working-directory: frontend
        run: |
          node --test scripts/zoomlab-harness.test.cjs
          node scripts/zoomlab-network-check.cjs /tmp/zoomlab-out/request-controls
      - name: Preflight — basemap token present
        run: |
          if [ -z "${{ secrets.MAPBOX_PUBLIC_TOKEN }}" ]; then
            echo "::error::MAPBOX_PUBLIC_TOKEN repo secret is not set — the map cannot boot in CI."
            echo "Set it once (the pk. CLIENT-PUBLIC token from frontend/.env.local):"
            echo "  gh secret set MAPBOX_PUBLIC_TOKEN --repo dpritzker0905-cmd/Raw-Surf-Antigravity"
            exit 1
          fi
      # ⚠️ The weather under test now comes from the in-runner backend (2026-10-21), but the app's OTHER
      # calls (profile, spots, badges) still go to prod, and a timed-out one is a transport error the
      # verdict REFUSES on. So prod answering is still a precondition, not a rendering finding.
      # (History, 2026-08-09, when the weather came from prod too: the 07:34Z scheduled run fetched
      # into ERR_FAILED and reported 30 findings; the 07:47Z dispatch, against a woken box, 0.)
      - name: Preflight — prod backend answers (the app's non-weather calls go there)
        id: warm
        run: |
          API="https://raw-surf-antigravity.onrender.com/api/health"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$API" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "backend awake after ${i} attempt(s)"; echo "awake=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 5
          done
          # NOT a failure: an unreachable backend is an operator/infra condition, and this job's
          # question is about the renderer. Say so loudly and let the verdict step refuse.
          echo "::warning::Prod backend did not answer 200 on /api/health within ~150s — the zoomlab"\
               "battery will run against missing data and the verdict will REFUSE rather than grade."
          echo "awake=0" >> "$GITHUB_OUTPUT"

      - name: Boot dev server (mock auth; weather from the in-runner backend)
        working-directory: frontend
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          PORT: '3009'
          BROWSER: none
          CI: 'false'   # CRA treats warnings as errors under CI=true — the dev server is not the build gate
          REACT_APP_MAPBOX_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          nohup npm start > /tmp/devserver.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3009 > /dev/null; then echo "dev server up"; exit 0; fi
            sleep 5
          done
          echo "dev server never came up"; tail -50 /tmp/devserver.log; exit 1
      - name: Wait for the in-runner synthetic weather backend
        run: bash frontend/scripts/offline-backend/ci_weather_backend.sh wait 120
      - name: Run staircase battery
        working-directory: frontend
        env:
          ZL_BASE: http://localhost:3009
          # Every /api/weather/* request goes here, fail-closed, never to the live backend (scripts/zoomlab.js).
          ZL_WEATHER_BACKEND: http://127.0.0.1:4100
        run: node scripts/zoomlab.js staircase_full /tmp/zoomlab-out
      # The receipt, on the run page. A weather response from the live box fails the job: the move is the point.
      - name: Weather routing receipt
        if: always()
        run: |
          node - <<'JS'
          const fs = require('fs');
          const file = '/tmp/zoomlab-out/weather_routing_staircase_full.json';
          if (!fs.existsSync(file)) { console.log('no routing receipt (the battery did not start)'); process.exit(0); }
          const r = JSON.parse(fs.readFileSync(file, 'utf8'));
          const lines = ['### Zoomlab weather traffic: in-runner backend, not the live box', '',
            `- answered by the in-runner backend: **${r.routedToLocal}** (${JSON.stringify(r.byEndpoint)})`,
            `- weather responses from the LIVE backend: **${r.sentToLive}**`,
            `- local backend did not answer: ${r.localFailures} · dropped by the page first: ${r.cancelledByPage}`];
          console.log(lines.join('\n'));
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          if (r.sentToLive > 0) { console.log('::error::weather traffic reached the live backend'); process.exit(1); }
          JS
      - name: Verdict (budgeted)
        run: |
          set +e
          node frontend/scripts/zoomlab-verdict.js /tmp/zoomlab-out/trace_staircase_full.json --scenario staircase_full --json \
            > /tmp/zoomlab-out/verdict.json 2>/tmp/zoomlab-out/verdict.err
          CODE=$?
          OUT=$(node frontend/scripts/zoomlab-verdict.js /tmp/zoomlab-out/trace_staircase_full.json --scenario staircase_full 2>&1)
          echo "$OUT"
          set -e
          # Exit 3 means unmeasured. Preserve it as non-green and label it separately from
          # a measured rendering failure; always upload the trace for diagnosis.
          # ★ ALWAYS state what was measured, on the run page itself. A refusal that only exists as a
          # warning buried in a step log is how "green" comes to mean "never graded" — the same trap
          # one level up from the one this refusal closes.
          node -e '
            const v=require("/tmp/zoomlab-out/verdict.json");
            const l=[`### Marine nightly zoomlab: **${v.verdict}**`,"",
              `- frames analysed: ${v.framesAnalyzed} · water samples: ${v.waterSamples}`,
              `- render findings: ${v.renderFindings.length} · instrument (transport) findings: ${v.instrumentFindings.length}`,
              v.observable?"- the sea under test was delivered, so the renderer WAS graded"
                          :"- Incomplete visual measurement; independent renderer errors still fail",
                     `- Independent renderer errors: ${v.hardRenderFindings.length}`];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, l.join("\n")+"\n");
          ' || true
          if [ "$CODE" = "3" ]; then
            echo "::error::Marine nightly REFUSED: incomplete visual evidence. See observationGaps"\
                 "in verdict.json. This is unmeasured, not a rendering pass."
            exit 3
          fi
          if [ "$CODE" != "0" ] && [ "$CODE" != "1" ]; then
            echo "::error::Visual verdict could not be computed (exit $CODE)"; exit 2
          fi
          HARD=$(node -e 'console.log(require("/tmp/zoomlab-out/verdict.json").hardRenderFindings.length)')
          if [ "$HARD" -gt 0 ]; then
            echo "::error::Independent renderer errors: $HARD"; exit 1
          fi
          # BUDGET (tightened 2026-07-18 EVE-2): zoomlab now records engine-mask water ground
          # truth per column and the verdict excludes LAND columns from dead-band claims — the
          # old ≤3 allowance existed for the Florida-peninsula false positive (which spent two
          # forensic arcs mislabeled "wrapped-copy particles"). Fail on: any SETTLED_STEP, any
          # DEAD_BAND_PERSISTENT, or more than 2 findings total (short water transients ride).
          # ⚠️ Counts come from the RENDER class only — instrument findings are reported, never
          # budgeted. Parsed from the JSON, not from the prose: the prose is for the operator.
          FINDINGS=$(node -e 'const v=require("/tmp/zoomlab-out/verdict.json");console.log(v.renderFindings.length)')
          SETTLED=$(node -e 'const v=require("/tmp/zoomlab-out/verdict.json");console.log(v.renderFindings.filter(f=>f.type==="SETTLED_STEP").length)')
          PERSIST=$(node -e 'const v=require("/tmp/zoomlab-out/verdict.json");console.log(v.renderFindings.filter(f=>f.type==="DEAD_BAND_PERSISTENT").length)')
          echo "render findings=$FINDINGS settled_steps=$SETTLED persistent=$PERSIST (budget: ≤2 findings, 0 persistent, 0 settled steps)"
          if [ "$SETTLED" -gt 0 ] || [ "$PERSIST" -gt 0 ] || [ "${FINDINGS:-0}" -gt 2 ]; then
            echo "OVER BUDGET — failing"; exit 1
          fi
          # The verdict binary prints "[verdict] FAIL" for ANY finding; the budget is the CI
          # authority. Close the log unambiguously so a green run never reads as an error.
          echo "WITHIN BUDGET — PASS (transient findings ≤2, zero persistent, zero settled steps)"
          exit 0
      - name: Upload trace artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zoomlab-nightly-${{ github.run_id }}
          path: /tmp/zoomlab-out
          retention-days: 14
