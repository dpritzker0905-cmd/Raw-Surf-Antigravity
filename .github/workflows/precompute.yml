# Decoupled precompute + calibration — restores products from Supabase L2 and rates every spot OFF the heavy
# ingest path, so the high-value glyph precompute can never be starved by a slow/timed-out ingestion cycle.
# Manual dispatch (and a light schedule so glyphs refresh even between full ingests).
#   Actions -> "Precompute Spot Ratings (decoupled)" -> Run workflow.
name: Precompute Spot Ratings (decoupled)

on:
  workflow_dispatch: {}
  # ★ RATINGS FOLLOW THE REGIONAL INGEST (2026-09-25, audit 15.0 A15-15). Three of the six cron slots below
  # used to be 03:45/11:45/19:45 — THE SAME MINUTE as forecast-ingest-pilots.yml ('45 3,11,19'), which moved
  # there on 2026-07-13 (ba894c3d) and silently voided the old "pilots finish ~03:12" assumption. GitHub
  # drifts both lanes together, so they STARTED 1-2 min apart and this lane FINISHED FIRST every time —
  # measured 2026-09-24/25 over 6 paired slots: precompute done 23:35 / 16:44 / 09:48 / 23:31 / 16:51 /
  # 09:32 vs pilots 23:50 / 17:58 / 12:26 / 23:52 / 17:00 / 10:54. /point prefers the known-cycle regional
  # tile (#80), so every glyph frame was rated on the PREVIOUS pilot cycle while the heatmap drew the new
  # one, for up to 4 h. Those three slots are now this trigger: the rating runs when the tiles exist.
  # 'completed' is any conclusion ON PURPOSE — a cancelled pilot run still uploads its early tiles, and a
  # failed one leaves this lane exactly where the old cron slot did. Runs/day unchanged (3 + 3).
  # Guard: backend/tests/test_precompute_follows_pilots.py.
  workflow_run:
    workflows: ["Forecast Ingestion Pilots (regional tiles)"]
    types: [completed]
  # ★ RATINGS FOLLOW THE PHYSICS (2026-09-28). The frames are rated IN THIS JOB from the checked-out code, while
  # the spot hub, the sim and the live lanes run whatever Render deployed. A served-height change merged to dev
  # therefore split the product until the next precompute: measured 2026-09-28 22:50Z, #146 (friction off) and
  # #120 (Kr 0.873) were live on the hub for 2.5 h while every glyph and infobox still showed the legacy chain --
  # Cocoa Beach 0.789 m on the glyph vs 1.012 m on the hub (28%), up to x2.5 on wide shelves -- because the last
  # run (a9d71e1c, 20:10Z) predated both, and GitHub was delaying scheduled slots by hours. A push that touches
  # the composition chain now re-rates at once. PATHS = every module in the import closure of surf_point /
  # surf_transform / surf_rating / spot_ratings that reads a SURF_* or RATING_* lever, plus the magnet table and
  # the geometry assets -- derived from the code by backend/tests/test_precompute_follows_pilots.py, so a new
  # lever module fails CI until it is listed here. Measured over 10 days of dev merges: 16 touched these paths
  # (47 touched weather_pipeline at all), so ~1.6 extra runs a day; the concurrency group queues at most one.
  push:
    branches: [dev]
    paths:
      - 'backend/services/weather_pipeline/break_depth_policy.py'
      - 'backend/services/weather_pipeline/grid_resolver_selection.py'
      - 'backend/services/weather_pipeline/mop_nearshore.py'
      - 'backend/services/weather_pipeline/mop_serving.py'
      - 'backend/services/weather_pipeline/point_rating.py'
      - 'backend/services/weather_pipeline/point_resolution.py'
      - 'backend/services/weather_pipeline/point_surf_augment.py'
      - 'backend/services/weather_pipeline/product_selection.py'
      - 'backend/services/weather_pipeline/spot_conditions.py'
      - 'backend/services/weather_pipeline/spot_ratings.py'
      - 'backend/services/weather_pipeline/spot_ratings_precompute.py'
      - 'backend/services/weather_pipeline/surf_height_convention.py'
      - 'backend/services/weather_pipeline/surf_magnets.py'
      - 'backend/services/weather_pipeline/surf_point.py'
      - 'backend/services/weather_pipeline/surf_rating.py'
      - 'backend/services/weather_pipeline/surf_transform.py'
      - 'backend/services/weather_pipeline/wave_physics.py'
      - 'backend/services/weather_pipeline/data/**'
      - '.github/workflows/precompute.yml'
  schedule:
    # INTERLEAVED with the core ingest (2026-07-13 melt hardening, round-12 §1): each run writes frames
    # {+0,+3}h per model (SPOT_RATINGS_PRECOMPUTE_HOURS '0,3') served ±2h fresh, then ±6h labelled stale,
    # and core-ingest tails write frames every 4h too. If a core run is evicted from the shared pending slot
    # (the 07-13 melt root) this lane still refreshes on its own group. The cron slots that remain are the
    # ones pilots never collide with; if GitHub DROPS a scheduled pilot run (it has — startedAt null), the
    # 8 h gap between them stays inside the stale ladder (3 h frame span + 6 h bound), so glyphs degrade to
    # labelled-stale, never to the live cliff.
    - cron: '45 7,15,23 * * *'

permissions:
  contents: read

concurrency:
  group: precompute
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    # 60 → 35 (2026-07-06): spatial batching landed and PROVED OUT — first batched run
    # 28771531702 finished in 25m27s (pre-warm 107 boxes / 977 points / 0 failed in 18.8 min),
    # replacing the ~300 serial per-point downloads that forced the 60-min cap on 07-05.
    # 35 = measured 25.4 min + CMEMS-variance headroom; the cap exists to kill a THROTTLED run
    # (the 138×25s pathology) before it wastes an hour, not to squeeze a healthy one.
    # 35 → 55 (2026-07-13): SPOT_RATINGS_PRECOMPUTE_HOURS '0,3' doubles the rating frames
    # (~+12-15 min) so a single missed/late run no longer opens a src=live melt window.
    # 55 → 75 (2026-07-13 melt round 4): run 29270987154 was CANCELLED at exactly 55m14s — the
    # doubled tail exceeds 55 under CMEMS variance. 75 = measured-insufficient +20 headroom; the
    # cap is also no longer catastrophic: the checkpoint merge-upload (run_spot_ratings_precompute)
    # lands each model's frames as it completes, so a timeout costs the TAIL models one cycle, not
    # the whole lane (the all-or-nothing loss that froze the lane at frame 12:00Z for 9h on 07-13).
    # 75 → 110 (2026-07-14, §3.3 headroom answer): run 29297471819 was CANCELLED at exactly 75m15s
    # — second consecutive timeout at a second consecutive cap. Its trace: first checkpoint landed
    # 2m50s in, then ~72 min inside the next model without completing (CMEMS-throttle shape). 110
    # keeps 130 min clear of the 240-min cron spacing (own concurrency group, cancel-in-progress
    # false → worst case one queued run, never a cascade; still true since 2026-09-25, when half the runs
    # became workflow_run-triggered and the spacing stopped being a fixed 240 min). If a run exceeds ~100 min the fix is
    # per-FRAME checkpoints or dropping the '3' offset — not a bigger cap.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
      # ⚠️ 3.12 TO MATCH PRODUCTION, WHICH THIS LANE FEEDS. The server runs 3.12 (measured:
      # /api/health `runtime.python`), and this lane was 3.11 — so the artifacts were written by one
      # numeric stack (numpy 2.4.6) and read by another (2.5.1).
      # ★ CLEARED BY AN ARTIFACT-LEVEL CHECK, NOT BY THE JOB GOING GREEN: the composition and the
      #   numpy-backed ocean_access helpers were driven on FIXED inputs under both interpreters and
      #   produced BYTE-IDENTICAL output (6064 B, sha256 2fd2d006f740...), with a mutation control
      #   on each side proving the harness could detect a difference at all.
      #   Re-run it before any future interpreter move: workflow `artifact-interpreter-parity`.
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Restore from L2 + precompute ratings + calibration
        working-directory: backend
        env:
          NODE_ENV: production
          RENDER: 'true'                # match production grid resolution + point-resolution paths
          PREFETCH_WINDOW_DAYS: '1'     # precompute rates only the current frame → warm just near-term grids (faster)
          SPOT_RATINGS_PRECOMPUTE: '1'
          SPOT_RATINGS_PRECOMPUTE_MODELS: 'GFS,EURO,ICON'  # precompute glyphs for all 3 models (match forecast-ingest)
          RATING_TIDE: '1'              # 2026-07-18 SOTA-gap #1 flip (match forecast-ingest): tide state on every rated spot + tide_fit where a best_tide prior exists; batched pre-warm keeps it ~10 requests/run. Kill: '0'.
          SURF_NEARSHORE_MOP: '0'       # DECLARED AT DEFAULT (2026-09-27, roadmap stage 4) — flip ONLY together with forecast-ingest.yml AND Render env.
          SURF_STRICT_AVAILABILITY: '0' # Dark: unknown sea must not become Flat
          SURF_REQUESTED_HORIZON: '0' # Dark: request-scoped spot forecast work
          COPERNICUS_TERMINAL_TIME_GUARD: '0' # Dark: fail once for dataset-wide temporal bounds
          MANIFEST_IMMUTABLE_PUBLICATION: '0' # Dark: unique acknowledged manifest snapshots
          SURF_PARTITIONS: '0'          # DECLARED AT DEFAULT (2026-07-30) so the lane-parity guard can see it: spectral trains now reach the RATING (level moves on 50% of spot-hours measured) and 4x the marine resolutions — flip ONLY together with forecast-ingest.yml AND Render env, never one lane.
          SHORE_NORMAL_BEARING_RADIUS_KM: '3.0'  # DECLARED AT ITS LIVE VALUE (2026-08-02), match forecast-ingest.yml + Render env. Both lanes write spot ratings, so both must carry it or the two write frames that disagree about which way a beach faces. The shore normal may borrow a gate-passed neighbour's bearing out to 3 km; the BREAK DEPTH may not (stays 1 km) — a coastline's orientation is smooth over kilometres, one peak's bottom is not. Measured hold-out over all 1,386 gate-passed entries: bearing p50 4.3° at 3 km, depth 25.7% — but that hold-out grades an ETOPO fit against ANOTHER ETOPO fit, i.e. self-consistency. Graded against OSM coastline winding, which shares nothing with ETOPO (n=113): coarse p50 38.7° -> borrowed 12.6°, better 73.5%, >90° errors 16.8% -> 9.7%. QUOTE 12.6, NEVER 4.3. ⚠️ Against the LIVE catalogue (`sim_forecast.fetch_catalog()`, n=1773): 91 spots gain a fine bearing, coarse 22.1% -> 17.1%, LEVEL moves on 40.8% of evaluations — treat as a product event. Kill: '1.0' in ALL FOUR lanes together (here, forecast-ingest.yml, sim-parity-monitor.yml, Render). ⚠️ CORRECTED 2026-08-02 (audit v5 F2): the original "229 spots / 38.0%" came from a `dev.db` census; that file dates to 2026-07-12 and drifts p90 3.470 km from production — further than the 3 km effect under test — so it over-counted 2.5x.
          RATING_OBS_GATE: '1'          # 2026-07-30 FLIP (owner approved), match forecast-ingest.yml + Render env. The published industry rule, verbatim: Surfline's model NEVER assigns Good or Epic — "Good and Epic ratings can only be assigned by forecasters who have observed the conditions" — so a model-only score caps at 69.9 (fair_good, their exact model ceiling) unless confirmed. Confirmation comes from >=2 of GFS/EURO/ICON independently scoring good/epic (the "virtual forecaster", needs no user reports) or a fresh <=12 h report of >=4 stars. Measured over 10,638 live spot-hours: 274 capped (2.6%), epic 453->346, good 549->446, fair_good +210, and NOTHING at or below `fair` moves — 79% of good/epic survives on model agreement, so it removes single-model over-excitement and nothing else. This is the fix for the owner's "I wouldn't say 4 ft @ 9 s is epic". Kill: '0'.
          # ✅ FLIPPED TO 1 on 2026-08-01 (owner decision) after the go/no-go finally answered BOTH
          # halves of the question. `backend/scripts/local_size_gonogo.py`, measured live:
          #   blob SANE — 1,821 entries, updated 01:46Z, 100% reference coverage of 1,773 rated spots
          #   owner anchors 5/5 at the blob's own Florida reference; percentile sweep 5/5 at p0.50
          #   product A/B over 10,638 spot-hours: 47.6% change LEVEL (4,685 down / 375 up),
          #     delta median -4.9, p10 -27.6, p90 +1.9
          #   extremes correct in BOTH directions — Cape Town Dungeons epic->poor_fair at h=1.64 m
          #     against ref=2.57 m (a 5 ft day at Dungeons is not epic), Lake Worth Pier (FL)
          #     poor_fair->fair at h=0.61 m against ref=0.57 m (an at-reference day is not poor).
          # ⚠️ 47.6% is a PRODUCT EVENT, not a config edit — it was taken as an explicit decision.
          # ⚠️ TO REVERT: set this to '0' in ALL THREE lanes together, never one.
          CONSENSUS_INGEST: '1'         # ARMED by the owner's merge of the arming PR (D-009; declared '0' by #164). '1' builds the equal GFS/EURO/ICON mean as the SHADOW model CONSENSUS in the pilots lane (consensus_ingest.py) and adds the `raw_surf:CONSENSUS` lane to the skill ledger that forecast-ingest.yml and precompute.yml run. Serves nothing either way. ARM ALL THREE TOGETHER: forecast-ingest-pilots.yml, forecast-ingest.yml, precompute.yml.
          SAMPLER_SCALAR_HEIGHT: '0'    # DECLARED AT DEFAULT (2026-09-30, dark): '1' interpolates a MARINE height as the scalar it is (the corners' weighted mean) instead of sqrt(u^2+v^2) of their vector mean, which shrinks it wherever the corners' directions diverge (islands, headlands: NDBC 51202 served 0.98 m, scalar 1.45, same-model cell 1.44, buoy 2.0; 11% of rated spots read > 5% low). Direction keeps the vector mean; wind is untouched. See sampler.scalar_marine_height_enabled. Moves served heights on every surface: flip ONLY on the owner's word, in ALL of forecast-ingest.yml, forecast-ingest-pilots.yml, precompute.yml AND the Render env together.
          SAMPLER_SCALAR_LEDGER: '1'    # ARMED (2026-09-30, serves nothing): the skill ledger grades a `raw_surf:GFS_SCALAR` lane, the served GFS product sampled with a SCALAR height (sampler.force_scalar_height), on the same buoys, hours and leads as `raw_surf`, so the SAMPLER_SCALAR_HEIGHT flip is decided on paired buoy truth. Retires itself once that switch serves. Its rows fit because PENDING_MAX_ENTRIES was raised to 54,000 in the same PR (it had bound at 29,477 of 30,000). Both ledger lanes carry it: forecast-ingest.yml and precompute.yml. Kill: '0'.
          CONSENSUS_SERVE: '0'          # DECLARED AT DEFAULT (2026-09-29, dark): '1' SERVES the equal GFS/EURO/ICON mean in place of GFS marine waves on every surface (consensus_serve.ServedStore; D-009's flip), with GFS kept where a cell was not blended; the ledger adds a raw_surf:GFS_RAW baseline lane. FLIP ONLY TOGETHER: forecast-ingest.yml, precompute.yml AND the live service's env, on the owner's word and the shadow's evidence.
          CONSENSUS_SERVE_KEEP_GFS: ''  # DECLARED AT DEFAULT (2026-09-30, dark): regional-tile region_ids that keep GFS while CONSENSUS_SERVE is '1' ('' = none, D-006's global equal mean). Recommended 'hawaii' (ledger seq 215: out of sample the equal mean loses to GFS only there; hawaii-only -1.9% vs equal, -16% vs GFS). Amends D-006: the owner's word, set TOGETHER with CONSENSUS_SERVE here, in the other rating lane AND the live service's env.
          RATING_LOCAL_SIZE: '1'        # DECLARED EXPLICITLY ON PURPOSE — do not delete. Grades size against the spot's own good day instead of the global 1.2 m; it is the fix for the owner's "4 ft @ 9 s is not epic" anchor and for size_score saturating (4/6/8/10/12 ft all score 84.0). It was absent here entirely, which made the rollout a trap: flipping it in Render env alone changes the LIVE lane while these precomputed frames — which are authoritative for glyphs — keep the global reference, so the band and the glyphs would disagree on quality. That is the ONE FORECAST COMPOSITION rule broken by a config gap rather than by code. ⚠️ ALL THREE MOVE TOGETHER: here, forecast-ingest.yml, and Render env. The go/no-go is `backend/scripts/local_size_gonogo.py` (no admin JWT needed) — and it is the named EXEMPLARS plus the product A/B, never the aggregate delta alone, because an inverted blob looks entirely plausible in aggregate.
          SPOT_RATINGS_PRECOMPUTE_HOURS: '0,3'  # TWO frames/model (2026-07-13): coverage to +5h59 per run → a missed/drifted run no longer opens a melt window; also covers near-term scrub (±2h tolerance around each frame)
          BUOY_CALIBRATION: '1'
          REPORT_CALIBRATION: '1'
          POINT_BATCH_NATIVE_COPERNICUS: '1'  # SPATIAL BATCHING (2026-07-06, replaces POINT_SKIP here): ONE CMEMS subset per ~5° spot cluster pre-warms per-point entries → native EURO authority restored WITHOUT the serial per-point volume that made CMEMS throttle (138×25s, run 28754458502). forecast-ingest keeps POINT_SKIP until this lane proves out.
          POINT_CACHE_MAX: '6000'             # batched entries: one per spot (~1000 spots × margin); default 100 is the serve-box bound
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEATHER_PROXY_URL: ${{ secrets.WEATHER_PROXY_URL }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python scripts/precompute_ci.py
