name: LOC Governance Check

# 2026-07-26: added `push` — this workflow previously triggered on `pull_request`
# ONLY, while the active workflow pushes straight to `dev`. Verified: zero runs
# ever, zero PRs ever, and 13 frontend files drifted past the 800-LOC limit
# (worst: WebGLMarineEngine.js at 3844) while backend Python stayed clean because
# it is separately guarded by ci.yml + .git/hooks/pre-commit.
#
# Enforced as a RATCHET (scripts/loc_ratchet.py) rather than a hard limit, so the
# gate closes today without failing every push on pre-existing debt:
#   * new files may never exceed 800 LOC
#   * the 13 grandfathered files in .github/loc-baseline.json may only SHRINK

on:
  # `main` added 2026-08-05 so a promotion gets this signal too.
  # ⛔ NOT A REQUIRED STATUS CHECK, and it cannot become one while the `paths:` filter below exists:
  # a docs-only commit does not match the filter, the job never runs, and GitHub reports a required
  # check that never ran as MISSING — which blocks the branch permanently rather than passing it.
  # Measured 2026-08-05: commit 3c98e5e6 (docs only) carries NO "File Size Governance" check-run.
  # ★ Backend LOC is still gated on every push regardless, by ci.yml's `backend-file-size-check`,
  #   which has no path filter. It is the FRONTEND ratchet that rides on this filtered job.
  push:
    branches: [dev, main]
    paths:
      - 'backend/**/*.py'
      # ⚠️ MUST match loc_ratchet.SCOPES. Extending the scanner to .ts/.tsx without extending this
      # filter would leave the gate half-closed: the job simply would not run on a TypeScript-only
      # change, and a green checkmark would mean "not evaluated". That is the `paths:`-filter
      # defect this workflow's own header already records once.
      - 'frontend/src/**/*.js'
      - 'frontend/src/**/*.jsx'
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.tsx'
      - 'scripts/loc_ratchet.py'
      - '.github/loc-baseline.json'
      - '.github/workflows/loc-check.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**/*.py'
      # ⚠️ MUST match loc_ratchet.SCOPES. Extending the scanner to .ts/.tsx without extending this
      # filter would leave the gate half-closed: the job simply would not run on a TypeScript-only
      # change, and a green checkmark would mean "not evaluated". That is the `paths:`-filter
      # defect this workflow's own header already records once.
      - 'frontend/src/**/*.js'
      - 'frontend/src/**/*.jsx'
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.tsx'
      - 'scripts/loc_ratchet.py'
      - '.github/loc-baseline.json'
      - '.github/workflows/loc-check.yml'

# A new commit on a PR cancels that PR's older run of this workflow (the Actions queue was the bottleneck,
# 2026-11-19). PUSHES TO DEV SHARE ONE GROUP, `push-dev` (2026-11-23, owner: "Yes, small CI PR"): GitHub keeps
# one RUNNING and only the NEWEST PENDING run per group (default `queue: single`), and cancel-in-progress stays
# false for pushes, so a running dev CI is never killed and every merge in between drops its pending run. Before
# this each push had its own group (run id) and 15 full runs (~25 min each) queued on dev in one afternoon,
# starving every PR. Dev CI is now "latest wins": not every merge gets a dev run of its own. The readers already
# cope (floor-catchup.yml fires only on a green run; ci_floor_staleness.py reads the newest green run;
# ci_floor_overlift.py walks every commit since it). Do NOT also cancel the running one: merges land every few
# minutes, so dev would never finish a green run and both floor readers would starve.
# Pushes to main (the production promotion) or any other branch keep a group per run: each keeps its evidence.
# Pinned by backend/tests/test_ci_push_concurrency.py.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/dev') && 'push-dev' || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  loc-check:
    runs-on: ubuntu-latest
    name: File Size Governance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
      # ⚠️ 3.12 TO MATCH PRODUCTION, WHICH THIS LANE FEEDS. The server runs 3.12 (measured:
      # /api/health `runtime.python`), and this lane was 3.11 — so the artifacts were written by one
      # numeric stack (numpy 2.4.6) and read by another (2.5.1).
      # ★ CLEARED BY AN ARTIFACT-LEVEL CHECK, NOT BY THE JOB GOING GREEN: the composition and the
      #   numpy-backed ocean_access helpers were driven on FIXED inputs under both interpreters and
      #   produced BYTE-IDENTICAL output (6064 B, sha256 2fd2d006f740...), with a mutation control
      #   on each side proving the harness could detect a difference at all.
      #   Re-run it before any future interpreter move: workflow `artifact-interpreter-parity`.
        with:
          python-version: '3.12'

      - name: Check LOC ratchet (backend .py + frontend/src .js, max 800)
        id: ratchet
        run: |
          # pipefail is REQUIRED: without it the pipeline returns tee's status (0)
          # and every ratchet failure would be silently swallowed.
          set -o pipefail
          python scripts/loc_ratchet.py | tee /tmp/loc-report.txt

      - name: Publish report
        if: always()
        run: |
          {
            echo '## LOC Governance'
            echo '```'
            cat /tmp/loc-report.txt 2>/dev/null || echo 'no report produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
