name: LOC Governance Check

# 2026-07-26: added `push` — this workflow previously triggered on `pull_request`
# ONLY, while the active workflow pushes straight to `dev`. Verified: zero runs
# ever, zero PRs ever, and 13 frontend files drifted past the 800-LOC limit
# (worst: WebGLMarineEngine.js at 3844) while backend Python stayed clean because
# it is separately guarded by ci.yml + .git/hooks/pre-commit.
#
# Enforced as a RATCHET (scripts/loc_ratchet.py) rather than a hard limit, so the
# gate closes today without failing every push on pre-existing debt:
#   * new files may never exceed 800 LOC
#   * the 13 grandfathered files in .github/loc-baseline.json may only SHRINK

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**/*.py'
      # ⚠️ MUST match loc_ratchet.SCOPES. Extending the scanner to .ts/.tsx without extending this
      # filter would leave the gate half-closed: the job simply would not run on a TypeScript-only
      # change, and a green checkmark would mean "not evaluated". That is the `paths:`-filter
      # defect this workflow's own header already records once.
      - 'frontend/src/**/*.js'
      - 'frontend/src/**/*.jsx'
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.tsx'
      - 'scripts/loc_ratchet.py'
      - '.github/loc-baseline.json'
      - '.github/workflows/loc-check.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**/*.py'
      # ⚠️ MUST match loc_ratchet.SCOPES. Extending the scanner to .ts/.tsx without extending this
      # filter would leave the gate half-closed: the job simply would not run on a TypeScript-only
      # change, and a green checkmark would mean "not evaluated". That is the `paths:`-filter
      # defect this workflow's own header already records once.
      - 'frontend/src/**/*.js'
      - 'frontend/src/**/*.jsx'
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.tsx'
      - 'scripts/loc_ratchet.py'
      - '.github/loc-baseline.json'
      - '.github/workflows/loc-check.yml'

jobs:
  loc-check:
    runs-on: ubuntu-latest
    name: File Size Governance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check LOC ratchet (backend .py + frontend/src .js, max 800)
        id: ratchet
        run: |
          # pipefail is REQUIRED: without it the pipeline returns tee's status (0)
          # and every ratchet failure would be silently swallowed.
          set -o pipefail
          python scripts/loc_ratchet.py | tee /tmp/loc-report.txt

      - name: Publish report
        if: always()
        run: |
          {
            echo '## LOC Governance'
            echo '```'
            cat /tmp/loc-report.txt 2>/dev/null || echo 'no report produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
