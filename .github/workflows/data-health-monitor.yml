# Proactive data-freshness monitor (2026-07-08). Polls the serve box's /api/health/data (computed ON READ
# from the served manifest — data_health.compute_data_health) and FAILS (red X) when the pipeline is
# CRITICAL: the forecast-ingest cron is down / a lane is missing / everything is stale. A `warn` (a lane
# lagging or a short horizon) is surfaced as a GitHub warning annotation but does NOT fail the run —
# EXCEPT (2026-07-13) any lane older than HEALTH_PAGE_HOURS (default 7h) fails the run even at warn:
# the 07-13 core outage sat at 8-9h-old warn for 12h with green checks while users hit the melt.
#
# WHY: every past staleness incident (OOM, cron-403, the timeout hang, manifest CDN staleness, EURO
# tail-loss) was found REACTIVELY. This is the standing alert — a failed run here is the signal that data
# went stale, BEFORE users see it. This is the internal (GitHub-Actions) monitor; for paging, ALSO point an
# external uptime probe (UptimeRobot / cron-job.org) at the same URL — it catches even a total GitHub outage.
name: Data Health Monitor

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min (ingest cron refreshes every 4h; this detects a stall well within a cycle)
  # Also dispatched every 30 min by the Render box (services/workflow_dispatch.py LANES), because GitHub ran this cron
  # about once every 7 h (inspection 2026-11-23). force_stale=1 is the one forced-stale proof of the alert path: it opens
  # a [TEST] issue assigned to the owner and closes it in the same run.
  workflow_dispatch:
    inputs:
      force_stale:
        description: "1 = prove the alert: open a [TEST] stale-data issue and close it in this run"
        required: false
        default: "0"

permissions:
  contents: read
  issues: write     # the stale-data issue (scripts/staleness_alert.py): GITHUB_TOKEN only, no new secret

concurrency:
  group: data-health-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        id: checkout

      - name: Poll /api/health/data
        id: health
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://raw-surf-antigravity.onrender.com/api/health/data' }}
        run: |
          set -o pipefail
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 60 "$HEALTH_URL" || echo "000")
          echo "$code" > /tmp/health.code
          echo "GET $HEALTH_URL -> HTTP $code"
          python3 - <<'PY' || echo "(unparseable/empty body)"
          import json
          d = json.load(open('/tmp/health.json'))
          print('status:', d.get('status'))
          print('freshest_run_age_h:', d.get('freshest_run_age_h'))
          print('manifest_written_by:', d.get('manifest_written_by'))
          for name, info in (d.get('lanes') or {}).items():
              print(f"  {name}: {info.get('verdict')} (age {info.get('age_h')}h, horizon {info.get('horizon_h')}h)")
          for a in (d.get('alerts') or []):
              print('  ALERT:', a)
          # WRITER ATTRIBUTION (audit #28): the served manifest names its last L2 writer. Anything but
          # a designated writer means the write gate was bypassed (the rogue-local-backend class);
          # a missing stamp on a FRESH manifest means it was written by pre-gate code.
          wb = d.get('manifest_written_by')
          if wb is None:
              print("::warning::Served manifest carries NO L2 writer identity — written by pre-gate code? "
                    "Expected after the first post-deploy ingest cycle to stamp it; investigate if it persists.")
          elif not str(wb).startswith('designated:'):
              print(f"::warning::Served manifest last L2-written by NON-DESIGNATED writer '{wb}' — "
                    f"designated-writer gate bypassed (audit #28). Find and stop that box.")
          PY
          status=$(python3 -c "import json;print(json.load(open('/tmp/health.json')).get('status','critical'))" 2>/dev/null || echo critical)
          if [ "$code" = "503" ] || [ "$status" = "critical" ]; then
            echo "::error::Data pipeline CRITICAL (HTTP $code, status=$status) — forecast-ingest cron may be down, a lane is missing, or all data is stale. Check the forecast-ingest workflow + Render logs."
            exit 1
          fi
          # PAGE THRESHOLD (2026-07-13 deaf-spot fix): on 07-13 the core cron was dead for 12h —
          # lanes sat at warn (8-9h old, under the 12h critical bound) and this job kept passing,
          # so a USER found the degradation before any monitor did. Warn stays non-paging (routine
          # transients), but any lane older than HEALTH_PAGE_HOURS (~two missed core cycles) FAILS
          # the run. Tune via repo Actions variable HEALTH_PAGE_HOURS; the ratings/precomputed
          # lane (melt precursor) is included via its own age_h like every other lane.
          page_hours="${{ vars.HEALTH_PAGE_HOURS || '7' }}"
          stale_lanes=$(PAGE_HOURS="$page_hours" python3 - <<'PY' 2>/dev/null || echo ""
          import json, os
          d = json.load(open('/tmp/health.json'))
          cap = float(os.environ.get('PAGE_HOURS', '7'))
          bad = [f"{n} ({i.get('age_h')}h)" for n, i in (d.get('lanes') or {}).items()
                 if isinstance(i.get('age_h'), (int, float)) and i['age_h'] > cap]
          print(', '.join(bad))
          PY
          )
          if [ -n "$stale_lanes" ]; then
            echo "::error::Data pipeline PAGING: lane(s) older than ${page_hours}h — $stale_lanes. The ingest schedule is missing cycles (drift/eviction/timeouts); check forecast-ingest + precompute runs."
            exit 1
          fi
          if [ "$status" = "warn" ]; then
            echo "::warning::Data pipeline DEGRADED (warn) — a lane is lagging or a horizon is short. See alerts above."
          fi
          echo "Data pipeline healthy (status=$status)."

      # REGIONAL RUN AGE (2026-07-31). /api/health/data is BLIND here by construction:
      # data_health._is_global() filters to region_id.startswith('global'), and timeline_slot_census
      # does the same — so every 0.25° pilot tile was unwatched. That blind spot let GFS marine for
      # uk_ireland and east_australia reach a run age of 447.6 h (18.7 DAYS) while both instruments
      # reported healthy, and it is what hid Hawaii's 75-hour-old wind run behind a current valid_time.
      # Thresholds are per-TIER (global 4h cadence / flagship 8h / worldwide ~32h) because one fixed
      # bound either cry-wolfs on the rotation or goes blind on the globals.
      # Set repo Actions variable REGION_HEALTH_PAGING=0 to downgrade this to a warning annotation.
      # RASTER FRAME SETS (2026-11-16, the director): a raster publish that fails keeps its old index, so the map silently draws
      # the last good run (e.g. DWD's 0.125-degree weights file unreachable). For every raster set whose repo variable is '1',
      # the PUBLIC latest.json must list it with a run younger than RASTER_STALE_HOURS (default 30 h; one bound for every set).
      # A set switched on but not yet published is a WARNING (its first publish is a few hours away), not a failure.
      - name: Raster frame-set freshness
        id: raster
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # ONE LINE PER RASTER SWITCH, never the whole vars context: a step's env is printed in its log and this repo's Actions logs
          # are public, so passing every repo variable would publish them all (the advisor, 2026-11-16). A new raster set
          # adds its line here (tests/test_raster_set_freshness.py refuses a set whose switch is missing).
          FRAME_RASTER_CLOUD: ${{ vars.FRAME_RASTER_CLOUD }}
          FRAME_RASTER_CLOUD_0P25: ${{ vars.FRAME_RASTER_CLOUD_0P25 }}
          FRAME_RASTER_CLOUD_EURO: ${{ vars.FRAME_RASTER_CLOUD_EURO }}
          FRAME_RASTER_FOG: ${{ vars.FRAME_RASTER_FOG }}
          FRAME_RASTER_PRECIP: ${{ vars.FRAME_RASTER_PRECIP }}
          FRAME_RASTER_PRECIP_EURO: ${{ vars.FRAME_RASTER_PRECIP_EURO }}
          FRAME_RASTER_PRECIP_ICON: ${{ vars.FRAME_RASTER_PRECIP_ICON }}
          FRAME_RASTER_PRECIP_ICON_0P125: ${{ vars.FRAME_RASTER_PRECIP_ICON_0P125 }}
          FRAME_RASTER_PRESSURE: ${{ vars.FRAME_RASTER_PRESSURE }}
          FRAME_RASTER_PRESSURE_EURO: ${{ vars.FRAME_RASTER_PRESSURE_EURO }}
          FRAME_RASTER_PRESSURE_ICON: ${{ vars.FRAME_RASTER_PRESSURE_ICON }}
          FRAME_RASTER_TEMPERATURE: ${{ vars.FRAME_RASTER_TEMPERATURE }}
          FRAME_RASTER_TEMPERATURE_EURO: ${{ vars.FRAME_RASTER_TEMPERATURE_EURO }}
          FRAME_RASTER_TEMPERATURE_EURO_0P25: ${{ vars.FRAME_RASTER_TEMPERATURE_EURO_0P25 }}
          FRAME_RASTER_TEMPERATURE_ICON: ${{ vars.FRAME_RASTER_TEMPERATURE_ICON }}
          FRAME_RASTER_WATER_TEMP: ${{ vars.FRAME_RASTER_WATER_TEMP }}
          FRAME_RASTER_WATER_TEMP_EURO: ${{ vars.FRAME_RASTER_WATER_TEMP_EURO }}
          FRAME_RASTER_TEMPERATURE_ICON_0P125: ${{ vars.FRAME_RASTER_TEMPERATURE_ICON_0P125 }}
          FRAME_RASTER_GUST: ${{ vars.FRAME_RASTER_GUST }}
          FRAME_RASTER_GUST_EURO: ${{ vars.FRAME_RASTER_GUST_EURO }}
          FRAME_RASTER_GUST_ICON: ${{ vars.FRAME_RASTER_GUST_ICON }}
          FRAME_RASTER_CURRENTS: ${{ vars.FRAME_RASTER_CURRENTS }}
          FRAME_RASTER_CURRENTS_GIOPS: ${{ vars.FRAME_RASTER_CURRENTS_GIOPS }}
          FRAME_RASTER_CURRENTS_RTOFS: ${{ vars.FRAME_RASTER_CURRENTS_RTOFS }}
          FRAME_RASTER_CURRENTS_NATIVE: ${{ vars.FRAME_RASTER_CURRENTS_NATIVE }}
          FRAME_RASTER_GUST_RISK: ${{ vars.FRAME_RASTER_GUST_RISK }}
          FRAME_RASTER_WATER_TEMP_CMEMS: ${{ vars.FRAME_RASTER_WATER_TEMP_CMEMS }}
          FRAME_RASTER_TEMPERATURE_0P117: ${{ vars.FRAME_RASTER_TEMPERATURE_0P117 }}
          FRAME_RASTER_WATER_TEMP_0P117: ${{ vars.FRAME_RASTER_WATER_TEMP_0P117 }}
          FRAME_RASTER_PRECIP_0P117: ${{ vars.FRAME_RASTER_PRECIP_0P117 }}
          RASTER_STALE_HOURS: ${{ vars.RASTER_STALE_HOURS || '30' }}
        working-directory: backend
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_URL" ]; then echo "::warning::SUPABASE_URL unset: raster freshness not checked"; exit 0; fi
          python3 scripts/raster_set_freshness.py --base "${SUPABASE_URL%/}/storage/v1/object/public/weather-frames" --fail-on-stale

      # MARINE / WIND / RATED FRAME SETS (reliability lane, 2026-11-24): REPORT ONLY until the bounds are read against a week
      # of runs. The client has no age check and a failed publish keeps the old index. This reads the same public latest.json,
      # warns per model+family past its bound (FRAME_STALE_HOURS_<MODEL>), and shows how far each rated set trails its marine
      # set. First read: 60 of 80 GFS rated sets past 18 h, up to 12 h behind marine.
      - name: Marine / wind / rated frame-set freshness (report only)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        working-directory: backend
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "::warning::SUPABASE_URL unset: frame-set freshness not checked"; exit 0; fi
          python3 scripts/frame_set_freshness.py --base "${SUPABASE_URL%/}/storage/v1/object/public/weather-frames" || \
            echo "::warning::frame-set freshness could not read latest.json"

      # CENSUS CADENCE (advisor limit (a) on #1263, the one-box rule): the Render dispatcher runs this monitor every 30 min, and the
      # census reads /api/weather/products (~18k products). That read is the cached, once-per-manifest-version encode (median 2 s,
      # max 24 s end to end over the last 25 runs, step timings 2026-11-24), but the regional tiers' own bounds are 8-32 h, so on
      # dispatched runs it runs only every REGION_CENSUS_EVERY_H hours (default 3). GitHub's own schedule runs keep it every time.
      - name: Census cadence
        id: cadence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          EVERY_H: ${{ vars.REGION_CENSUS_EVERY_H || '3' }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVERY_H" in ''|*[!0-9]*|0) EVERY_H=3 ;; esac   # 0 or non-numeric would break the modulo: default 3
          h=$(date -u +%-H); m=$(date -u +%-M)
          if [ "$EVENT" = "schedule" ] || { [ $((h % EVERY_H)) -eq 0 ] && [ "$m" -lt 30 ]; }; then due=1; else due=0; fi
          echo "census due: $due (event $EVENT, $(date -u +%H:%M)Z, every ${EVERY_H} h)"
          echo "census=$due" >> "$GITHUB_OUTPUT"

      - name: Regional product run-age census
        id: regional
        # Global paging must not hide the finer regional diagnosis (run 34849338600).
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.cadence.outputs.census == '1' }}
        env:
          BASE: ${{ vars.HEALTH_BASE || 'https://raw-surf-antigravity.onrender.com' }}
          PAGING: ${{ vars.REGION_HEALTH_PAGING || '1' }}
          WEATHER_SERVICE_KEY: ${{ secrets.WEATHER_SERVICE_KEY }}   # the forecast clamp's job identity (services/weather_service_identity.py); unset = no key sent
        working-directory: backend
        run: |
          set -o pipefail
          if [ "$PAGING" = "1" ]; then
            python3 scripts/product_run_age_census.py --base "$BASE" --fail-on-stale || {
              echo "::error::Regional lanes are CRITICALLY stale — a pilot region is being starved by the"\
                   "ingest rotation, or its fetch is failing silently. See the census table above."
              exit 1
            }
          else
            python3 scripts/product_run_age_census.py --base "$BASE" || true
            echo "::warning::Regional run-age census is in NON-PAGING mode (REGION_HEALTH_PAGING=0)."
          fi

      # THE NOTIFICATION (reliability lane, 2026-11-24). A red run reaches nobody who is not watching Actions; the
      # 11-19/20 credential failure was silent for 21-25 h. One issue labelled stale-data + severity:<level>, assigned to
      # the owner (repo variable REPO_OWNER_LOGIN, a login, not a secret): opened once, escalated once, closed on
      # recovery. scripts/staleness_alert.py decides; tests/test_staleness_alert.py pins it.
      - name: Stale-data issue (open / escalate / close)
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ vars.REPO_OWNER_LOGIN }}
          FORCE: ${{ inputs.force_stale || '0' }}
          PAGE_HOURS: ${{ vars.HEALTH_PAGE_HOURS || '7' }}
          RASTER: ${{ steps.raster.outcome }}
          REGIONAL: ${{ steps.regional.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for l in "stale-data:b60205:Served data is not being refreshed" "severity:critical:b60205:Page now" \
                   "severity:high:d93f0b:Act today" "recovering:0e8a16:One healthy run; closes after the next"; do
            n="${l%%:*}"; rest="${l#*:}"; [ "$n" = "severity" ] && { n="severity:${rest%%:*}"; rest="${rest#*:}"; }
            gh label create "$n" --repo "$GITHUB_REPOSITORY" --color "${rest%%:*}" --description "${rest#*:}" --force >/dev/null
          done
          gh issue list --repo "$GITHUB_REPOSITORY" --label stale-data --state open --json number,title,labels > /tmp/open.json || echo '[]' > /tmp/open.json
          gh issue list --repo "$GITHUB_REPOSITORY" --label stale-data --state closed --limit 5 --json number,title,labels,closedAt > /tmp/closed.json || echo '[]' > /tmp/closed.json
          force=""; [ "$FORCE" = "1" ] && force="--force-stale"
          python3 scripts/staleness_alert.py --health /tmp/health.json --code "$(cat /tmp/health.code 2>/dev/null || echo 000)" \
            --page-hours "$PAGE_HOURS" --raster "$RASTER" --regional "$REGIONAL" --open-issues /tmp/open.json \
            --recent-closed /tmp/closed.json --run-url "$RUN_URL" $force > /tmp/decision.json
          cat /tmp/decision.json; echo
          j() { python3 -c "import json,sys;d=json.load(open('/tmp/decision.json'));v=d.get(sys.argv[1]);print(','.join(str(x) for x in v) if isinstance(v,list) else ('' if v is None else v))" "$1"; }
          action="$(j action)"; num="$(j number)"
          rm=(); [ -n "$(j remove_labels)" ] && rm=(--remove-label "$(j remove_labels)")   # only labels the issue carries
          j body > /tmp/body.md
          assignee=""; [ -n "$OWNER" ] && assignee="--assignee $OWNER"
          for t in $(j close_tests | tr ',' ' '); do      # a [TEST] issue a failed close left open (advisor limit (c))
            gh issue close "$t" --repo "$GITHUB_REPOSITORY" --comment "Leftover forced-stale TEST issue, closed by $RUN_URL." || true
          done
          case "$action" in
            open)
              url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$(j title)" --body-file /tmp/body.md --label "$(j labels)" $assignee)
              echo "opened $url"
              if [ "$FORCE" = "1" ]; then
                gh issue close "$url" --repo "$GITHUB_REPOSITORY" --comment "Forced-stale test passed: opened and assigned by run $RUN_URL, closed by the same run."
                echo "forced-stale test: opened and closed $url"
              fi ;;
            reopen)
              gh issue reopen "$num" --repo "$GITHUB_REPOSITORY"
              gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --title "$(j title)" --add-label "$(j labels)" "${rm[@]}" $assignee
              gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md ;;
            escalate)
              gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --title "$(j title)" --add-label "$(j labels)" "${rm[@]}"
              gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md ;;
            recovering)
              gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --add-label recovering
              gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md ;;
            relapse)
              gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --remove-label recovering
              gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md ;;
            close)
              gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "$(j body)" ;;
            *) echo "no issue change (severity $(j severity))" ;;
          esac
