# Proactive data-freshness monitor (2026-07-08). Polls the serve box's /api/health/data (computed ON READ
# from the served manifest — data_health.compute_data_health) and FAILS (red X) when the pipeline is
# CRITICAL: the forecast-ingest cron is down / a lane is missing / everything is stale. A `warn` (a lane
# lagging or a short horizon) is surfaced as a GitHub warning annotation but does NOT fail the run —
# EXCEPT (2026-07-13) any lane older than HEALTH_PAGE_HOURS (default 7h) fails the run even at warn:
# the 07-13 core outage sat at 8-9h-old warn for 12h with green checks while users hit the melt.
#
# WHY: every past staleness incident (OOM, cron-403, the timeout hang, manifest CDN staleness, EURO
# tail-loss) was found REACTIVELY. This is the standing alert — a failed run here is the signal that data
# went stale, BEFORE users see it. This is the internal (GitHub-Actions) monitor; for paging, ALSO point an
# external uptime probe (UptimeRobot / cron-job.org) at the same URL — it catches even a total GitHub outage.
name: Data Health Monitor

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min (ingest cron refreshes every 4h; this detects a stall well within a cycle)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: data-health-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Poll /api/health/data
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://raw-surf-antigravity.onrender.com/api/health/data' }}
        run: |
          set -o pipefail
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 60 "$HEALTH_URL" || echo "000")
          echo "GET $HEALTH_URL -> HTTP $code"
          python3 - <<'PY' || echo "(unparseable/empty body)"
          import json
          d = json.load(open('/tmp/health.json'))
          print('status:', d.get('status'))
          print('freshest_run_age_h:', d.get('freshest_run_age_h'))
          print('manifest_written_by:', d.get('manifest_written_by'))
          for name, info in (d.get('lanes') or {}).items():
              print(f"  {name}: {info.get('verdict')} (age {info.get('age_h')}h, horizon {info.get('horizon_h')}h)")
          for a in (d.get('alerts') or []):
              print('  ALERT:', a)
          # WRITER ATTRIBUTION (audit #28): the served manifest names its last L2 writer. Anything but
          # a designated writer means the write gate was bypassed (the rogue-local-backend class);
          # a missing stamp on a FRESH manifest means it was written by pre-gate code.
          wb = d.get('manifest_written_by')
          if wb is None:
              print("::warning::Served manifest carries NO L2 writer identity — written by pre-gate code? "
                    "Expected after the first post-deploy ingest cycle to stamp it; investigate if it persists.")
          elif not str(wb).startswith('designated:'):
              print(f"::warning::Served manifest last L2-written by NON-DESIGNATED writer '{wb}' — "
                    f"designated-writer gate bypassed (audit #28). Find and stop that box.")
          PY
          status=$(python3 -c "import json;print(json.load(open('/tmp/health.json')).get('status','critical'))" 2>/dev/null || echo critical)
          if [ "$code" = "503" ] || [ "$status" = "critical" ]; then
            echo "::error::Data pipeline CRITICAL (HTTP $code, status=$status) — forecast-ingest cron may be down, a lane is missing, or all data is stale. Check the forecast-ingest workflow + Render logs."
            exit 1
          fi
          # PAGE THRESHOLD (2026-07-13 deaf-spot fix): on 07-13 the core cron was dead for 12h —
          # lanes sat at warn (8-9h old, under the 12h critical bound) and this job kept passing,
          # so a USER found the degradation before any monitor did. Warn stays non-paging (routine
          # transients), but any lane older than HEALTH_PAGE_HOURS (~two missed core cycles) FAILS
          # the run. Tune via repo Actions variable HEALTH_PAGE_HOURS; the ratings/precomputed
          # lane (melt precursor) is included via its own age_h like every other lane.
          page_hours="${{ vars.HEALTH_PAGE_HOURS || '7' }}"
          stale_lanes=$(PAGE_HOURS="$page_hours" python3 - <<'PY' 2>/dev/null || echo ""
          import json, os
          d = json.load(open('/tmp/health.json'))
          cap = float(os.environ.get('PAGE_HOURS', '7'))
          bad = [f"{n} ({i.get('age_h')}h)" for n, i in (d.get('lanes') or {}).items()
                 if isinstance(i.get('age_h'), (int, float)) and i['age_h'] > cap]
          print(', '.join(bad))
          PY
          )
          if [ -n "$stale_lanes" ]; then
            echo "::error::Data pipeline PAGING: lane(s) older than ${page_hours}h — $stale_lanes. The ingest schedule is missing cycles (drift/eviction/timeouts); check forecast-ingest + precompute runs."
            exit 1
          fi
          if [ "$status" = "warn" ]; then
            echo "::warning::Data pipeline DEGRADED (warn) — a lane is lagging or a horizon is short. See alerts above."
          fi
          echo "Data pipeline healthy (status=$status)."

      # REGIONAL RUN AGE (2026-07-31). /api/health/data is BLIND here by construction:
      # data_health._is_global() filters to region_id.startswith('global'), and timeline_slot_census
      # does the same — so every 0.25° pilot tile was unwatched. That blind spot let GFS marine for
      # uk_ireland and east_australia reach a run age of 447.6 h (18.7 DAYS) while both instruments
      # reported healthy, and it is what hid Hawaii's 75-hour-old wind run behind a current valid_time.
      # Thresholds are per-TIER (global 4h cadence / flagship 8h / worldwide ~32h) because one fixed
      # bound either cry-wolfs on the rotation or goes blind on the globals.
      # Set repo Actions variable REGION_HEALTH_PAGING=0 to downgrade this to a warning annotation.
      - name: Regional product run-age census
        env:
          BASE: ${{ vars.HEALTH_BASE || 'https://raw-surf-antigravity.onrender.com' }}
          PAGING: ${{ vars.REGION_HEALTH_PAGING || '1' }}
        working-directory: backend
        run: |
          set -o pipefail
          if [ "$PAGING" = "1" ]; then
            python3 scripts/product_run_age_census.py --base "$BASE" --fail-on-stale || {
              echo "::error::Regional lanes are CRITICALLY stale — a pilot region is being starved by the"\
                   "ingest rotation, or its fetch is failing silently. See the census table above."
              exit 1
            }
          else
            python3 scripts/product_run_age_census.py --base "$BASE" || true
            echo "::warning::Regional run-age census is in NON-PAGING mode (REGION_HEALTH_PAGING=0)."
          fi
