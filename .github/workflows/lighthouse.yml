# Raw Surf — Lighthouse CI Pipeline
# Runs Lighthouse performance audit on every push to dev
# Produces a performance report with scores for Performance, Accessibility, Best Practices, SEO
name: Lighthouse CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 18.x
        uses: actions/setup-node@v5
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: false
          REACT_APP_BACKEND_URL: https://raw-surf-antigravity.onrender.com
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.json
