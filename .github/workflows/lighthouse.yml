# Raw Surf — Lighthouse CI Pipeline
# Runs Lighthouse performance audit on every push to dev
# Produces a performance report with scores for Performance, Accessibility, Best Practices, SEO
name: Lighthouse CI

on:
  # `main` added 2026-08-05 with ci.yml — the promotion is a fast-forward push, so it ran no checks.
  # No `paths:` filter here either, so this job always runs and is safe as a required check
  # (measured: 20 of the last 20 runs succeeded).
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# A newer push or PR update makes the older audit obsolete; cancelling it frees the runner. (No paths filter:
# see the trigger note above. This lane sends nothing to the live backend, so a filter would buy that box nothing.)
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 18.x
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: false
          # ⛔ NEVER THE LIVE BACKEND (2026-10-21, owner: "move the CI load off the live server"). The audited pages
          # (lighthouserc.json: /, /explore -> /auth, /auth; anonymous, and the access gate's dev-bypass covers
          # localhost) were measured offline on a production build to send ZERO backend requests, weather or other.
          # A loopback origin nobody listens on keeps it that way by construction: if a page ever starts calling the
          # API, the audit shows a refused request instead of quietly adding load to the 1-CPU box.
          REACT_APP_BACKEND_URL: http://127.0.0.1:9
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.json
