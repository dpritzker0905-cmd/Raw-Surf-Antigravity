# Decoupled forecast ingestion — runs the heavy GRIB-decode/NN ingestion OFF the 1-CPU Render web box
# and lands the normalized products + manifest in Supabase L2; the Render box restores from L2 and only
# serves. See docs/runbooks/decouple-ingestion-github-action.md for the verify -> cutover sequence.
#
# CUTOVER (2026-06-27): L2 round-trip verified (CI run green + storage3 .download confirmed on Render),
#   and the default branch is now `dev`, so schedule/dispatch run from CURRENT code (no main sync needed).
#   Cron ENABLED below. The companion step is setting DISABLE_FORECAST_SCHEDULER=1 on the Render web box
#   (serve-only + periodic L2 restore). Reverse by commenting the cron + unsetting the Render env var.
name: Forecast Ingestion (decoupled)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '15 */3 * * *'   # every 3h at :15 UTC (matches the in-process IntervalTrigger(hours=3))

concurrency:
  group: forecast-ingest
  cancel-in-progress: false   # never cancel a half-written ingestion cycle

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 165  # core ~57 min + calibration ~12; raised from 120 so the WORLDWIDE coastal pilot
                          # (runs LAST) actually COMPLETES instead of being starved — that starvation is why
                          # only flagship FL/SoCal had regional marine tiles and the rest of the world fell
                          # back to the 37×17 global-coarse (the worldwide clamp / "no heatmap" bug). Still
                          # < the 180-min cron interval (concurrency group prevents overlap).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt   # pygrib manylinux wheel bundles ecCodes — no apt step

      - name: Run forecast ingestion -> Supabase L2
        working-directory: backend
        env:
          NODE_ENV: production          # real ingestion, not the test mock
          RENDER: 'true'                # match the production grid resolution + fetch paths
          FORECAST_JOB_STAGGER_SEC: '0' # runner has no 1-CPU contention -> skip the inter-job staggers
          MARINE_INGEST_ALL: '1'        # ephemeral runner: ingest BOTH EURO+ICON marine (no alternation) so the manifest is complete
          INGEST_PILOTS: 'skip'         # 2026-07-04 timeout fix: the regional pilots (~67 min measured) pushed full cycles into the
                                        # 165-min job timeout ("cancelled" runs). Core globals run here (~45-60 min, always finish);
                                        # forecast-ingest-pilots.yml runs the pilots with INGEST_PILOTS=only in the SAME concurrency
                                        # group (serialized - concurrent manifest uploads would clobber each other).
          WORLDWIDE_REGIONS_PER_CYCLE: '2'  # ingest 2 worldwide coastal regions/cycle (was default 1) → all 8 (Hawaii, Iberia, UK, E-Australia, Indonesia, Brazil, S-Africa, Mexico) refreshed every ~4 cycles / 12h, fixing worldwide regional marine coverage
          BUOY_CALIBRATION: '1'         # measure-first: compare the ingested model to NOAA NDBC buoys -> L2 report (guarded, never fails the cycle)
          REPORT_CALIBRATION: '1'       # forward RATING calibration: snapshot per-spot predictions -> rolling L2 archive + match surfer logs (guarded)
          SPOT_RATINGS_PRECOMPUTE: '1'  # rate ALL spots OFFLINE on the multi-CPU runner -> L2, so /spot-ratings serves glyphs INSTANTLY (the live 1-CPU path is 7-22s for a viewport → fetches abort on pan → "not all spots light up"). select_precomputed serves it; live remains the fallback.
          SPOT_RATINGS_PRECOMPUTE_MODELS: 'GFS,EURO,ICON'  # precompute glyphs for ALL 3 models (was GFS-only → on EURO/ICON the map fell back to the slow src=live path; now instant on every model)
          POINT_SKIP_NATIVE_COPERNICUS: '1'  # batch lanes: CMEMS throttles under serial per-point volume (138×25s timeouts in run 28754458502); the open-meteo proxy fallback answers sub-second
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # EURO marine (Copernicus) — set these to the SAME names/values your Render service uses.
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          # open-meteo fallback proxy (EURO wind/pressure + any direct-source miss); optional.
          WEATHER_PROXY_URL: ${{ secrets.WEATHER_PROXY_URL }}
          # Per-source kill switches default ON; override here only to disable a source in CI.
          # GFS_MARINE_NOAA_DIRECT: '1'  ICON_PRESSURE_DWD_DIRECT: '1'  etc.
        run: python scripts/ingest_forecast_ci.py
