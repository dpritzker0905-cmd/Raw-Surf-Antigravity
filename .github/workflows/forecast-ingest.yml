# Decoupled forecast ingestion — runs the heavy GRIB-decode/NN ingestion OFF the 1-CPU Render web box
# and lands the normalized products + manifest in Supabase L2; the Render box restores from L2 and only
# serves. See docs/runbooks/decouple-ingestion-github-action.md for the verify -> cutover sequence.
#
# CUTOVER (2026-06-27): L2 round-trip verified (CI run green + storage3 .download confirmed on Render),
#   and the default branch is now `dev`, so schedule/dispatch run from CURRENT code (no main sync needed).
#   Cron ENABLED below. The companion step is setting DISABLE_FORECAST_SCHEDULER=1 on the Render web box
#   (serve-only + periodic L2 restore). Reverse by commenting the cron + unsetting the Render env var.
name: Forecast Ingestion (decoupled)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '15 */4 * * *'   # every 4h at :15 UTC — 00/04/08/12/16/20 (6 runs/day; matches the in-process IntervalTrigger(hours=4))

concurrency:
  # SPLIT 2026-07-14 (the eviction-class kill): core + pilots shared one serial group
  # ("forecast-ingest") because concurrent manifest.json uploads were last-writer-wins — the
  # loser's product registrations were silently erased. That serialization pushed the group's
  # worst case (165 + 200 min) past the 240-min core cron period, and GH keeps only ONE pending
  # slot per group → pending core cycles were repeatedly EVICTED (three dead core cycles on
  # 07-13, startedAt null). reconcile_manifest_products_for_upload (store.py) now reconciles
  # EVERY manifest upload against the fresh remote list — saves AND prunes (with exclusion
  # sets) — so concurrent writers fold each other's registrations in instead of clobbering.
  # With that live, each lane serializes only with ITSELF. Residual accepted races are
  # documented in the reconcile docstring (both self-healing within a cycle).
  # Revert = set both groups back to "forecast-ingest"; MANIFEST_MERGE_ON_UPLOAD=0 kills the
  # reconcile itself (do NOT combine the two — split groups without the reconcile restores the
  # clobber class).
  group: forecast-ingest-core
  cancel-in-progress: false   # never cancel a half-written ingestion cycle

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 165  # core ~57 min + calibration ~12; raised from 120 so the WORLDWIDE coastal pilot
                          # (runs LAST) actually COMPLETES instead of being starved — that starvation is why
                          # only flagship FL/SoCal had regional marine tiles and the rest of the world fell
                          # back to the 37×17 global-coarse (the worldwide clamp / "no heatmap" bug). Still
                          # < the 240-min (4h) cron interval (concurrency group prevents overlap).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt   # pygrib manylinux wheel bundles ecCodes — no apt step

      - name: Run forecast ingestion -> Supabase L2
        working-directory: backend
        env:
          NODE_ENV: production          # real ingestion, not the test mock
          RENDER: 'true'                # match the production grid resolution + fetch paths
          FORECAST_JOB_STAGGER_SEC: '0' # runner has no 1-CPU contention -> skip the inter-job staggers
          MARINE_INGEST_ALL: '1'        # ephemeral runner: ingest BOTH EURO+ICON marine (no alternation) so the manifest is complete
          INGEST_PILOTS: 'skip'         # 2026-07-04 timeout fix: the regional pilots (~67 min measured) pushed full cycles into the
                                        # 165-min job timeout ("cancelled" runs). Core globals run here (~45-60 min, always finish);
                                        # forecast-ingest-pilots.yml runs the pilots with INGEST_PILOTS=only — in its OWN concurrency
                                        # group since 2026-07-14 (manifest merge-on-upload reconciles concurrent writers; see the
                                        # concurrency block above).
          WORLDWIDE_REGIONS_PER_CYCLE: '2'  # ingest 2 worldwide coastal regions/cycle (was default 1) → all 8 (Hawaii, Iberia, UK, E-Australia, Indonesia, Brazil, S-Africa, Mexico) refreshed every ~4 cycles / 12h, fixing worldwide regional marine coverage
          BUOY_CALIBRATION: '1'         # measure-first: compare the ingested model to NOAA NDBC buoys -> L2 report (guarded, never fails the cycle)
          REPORT_CALIBRATION: '1'       # forward RATING calibration: snapshot per-spot predictions -> rolling L2 archive + match surfer logs (guarded)
          SPOT_RATINGS_PRECOMPUTE: '1'  # rate ALL spots OFFLINE on the multi-CPU runner -> L2, so /spot-ratings serves glyphs INSTANTLY (the live 1-CPU path is 7-22s for a viewport → fetches abort on pan → "not all spots light up"). select_precomputed serves it; live remains the fallback. FRESHNESS fast-path only since 2026-07-13: precompute.yml (own concurrency group, 6x/day interleaved) is the PRIMARY owner — this run being evicted from the shared pending slot can no longer orphan the lane (the 07-13 melt root).
          SPOT_RATINGS_PRECOMPUTE_MODELS: 'GFS,EURO,ICON'  # precompute glyphs for ALL 3 models (was GFS-only → on EURO/ICON the map fell back to the slow src=live path; now instant on every model)
          SPOT_RATINGS_PRECOMPUTE_HOURS: '0,3'  # TWO frames/model (2026-07-13): parity with precompute.yml — coverage to +5h59 per run, melt-window-proof (~+15 min in the tail; core ~65 min measured + tail fits the 165-min budget)
          POINT_BATCH_NATIVE_COPERNICUS: '1'  # SPATIAL BATCHING (2026-07-06, replaces POINT_SKIP — the batched lane PROVED OUT in precompute run 28771531702: pre-warm 107/107 boxes, 977 points, 0 failed, 18.8 min, run total 25m27s): one CMEMS subset per ~5° spot cluster pre-warms per-point entries before the ratings/calibration tail → native EURO point authority here too, without the serial volume that throttled CMEMS (138×25s, run 28754458502)
          POINT_CACHE_MAX: '6000'             # 2026-07-08 CRON-HANG ROOT (runbook §11): the pre-warm caches ~977 points but _point_cache's default cap is 100, and the after-each-box eviction trims it back to 100 → the EURO ratings pass got 0 batched hits → 846 per-point CMEMS subprocess spawns (~7.8s each) → the ~100-min ratings tail that pushed runs past the 165-min timeout ("cancelled"). precompute.yml already sets this; forecast-ingest was missing it (config drift when spot-ratings+batching were added here). Parity restores the tail to precompute's ~18 min. Self-correcting floor in copernicus_point_batching.py backstops any future lane that forgets it.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # EURO marine (Copernicus) — set these to the SAME names/values your Render service uses.
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          # open-meteo fallback proxy (EURO wind/pressure + any direct-source miss); optional.
          WEATHER_PROXY_URL: ${{ secrets.WEATHER_PROXY_URL }}
          # Per-source kill switches default ON; override here only to disable a source in CI.
          # GFS_MARINE_NOAA_DIRECT: '1'  ICON_PRESSURE_DWD_DIRECT: '1'  etc.
          # §3 Option A dominant-swell animation channel (2026-07-13). A/B via repo Actions
          # VARIABLES (Settings → Secrets and variables → Actions → Variables) — no commit needed.
          WAVES_ANIM_DOMINANT_SWELL: ${{ vars.WAVES_ANIM_DOMINANT_SWELL || '0' }}
          WAVES_ANIM_SWELL_MIN_FRAC: ${{ vars.WAVES_ANIM_SWELL_MIN_FRAC || '0.35' }}
        run: python scripts/ingest_forecast_ci.py
