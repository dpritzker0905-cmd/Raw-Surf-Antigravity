name: Long-range wind v2 analysis (offline evidence, serves nothing)

# stations | pair | fit | freeze | score. DISPATCH-ONLY with the owner's typed word. `score` is the ONE scored look and
# refuses on a freeze-manifest mismatch. Public data only; no secret. The collected run files come from the named
# collection run's artifacts (wind-lr2-runs-<kind>-<shard>).

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'stations | pair | fit | freeze | score'
        required: true
        type: choice
        options: ['stations', 'pair', 'fit', 'freeze', 'score']
      owner_word_ref:
        description: 'Where the owner typed the dispatch word. Required.'
        required: true
      runs_run_id:
        description: 'fit/score: the collection workflow run whose wind-lr2-runs-* artifacts are read'
        required: false
        default: ''
      snapshot_run_id:
        description: 'score: the snapshot workflow run id whose artifact holds the weekly realtime2 snapshots'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  fetch-clim-gust:
    # Amendment G1 / design (b): the ONE job that holds the service key for the score command. Minimal on purpose: checkout, a
    # pinned requests, one step that reads one object from the PRIVATE weather bucket (then, only if the bucket cannot be READ, the
    # public release asset named by its hash) and verifies EVERY source against the COMMITTED sha256 (fail closed). The key is
    # scoped to that single step by NAME. Dispatch on dev only; there is no pull_request trigger. The remaining barrier is the
    # supabase-service environment approval gate: a branch that is not allowed to use the environment never receives the key.
    if: ${{ github.event.inputs.command == 'score' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    environment: supabase-service
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests==2.31.0
      - name: Fetch the archived CLIM_GUST table and verify it (key in this step only)
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OWNER_WORD_REF: ${{ github.event.inputs.owner_word_ref }}
        run: |
          test -n "$OWNER_WORD_REF" || exit 1
          mkdir -p "$RUNNER_TEMP/clim_gust"
          python scripts/wind_lr2_gust.py fetch-table --object calibration/wind-lr2/45266543788-1/wind-lr2-clim_gust-45266543788/wind_lr2_clim_gust.json --hash ../docs/weather-program/evidence/wind-long-range-v2/wind_lr2_clim_gust.json.sha256 --out "$RUNNER_TEMP/clim_gust/wind_lr2_clim_gust.json" --public-url https://github.com/dpritzker0905-cmd/Raw-Surf-Antigravity/releases/download/wind-lr2-clim-gust-1e7df526a8598fc1/wind_lr2_clim_gust-1e7df526a8598fc1.json
      - uses: actions/upload-artifact@v4
        with:
          name: clim-gust-verified-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/clim_gust/wind_lr2_clim_gust.json

  analyse:
    needs: [fetch-clim-gust]
    # runs when the fetch job succeeded OR was skipped (every command but score); a failed fetch skips it: no score without the table
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy requests==2.31.0 eccodes==2.50.0
      - name: Collected run files
        if: ${{ github.event.inputs.runs_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: wind-lr2-runs-*
          path: ${{ runner.temp }}/wlr2/downloaded
          run-id: ${{ github.event.inputs.runs_run_id }}
          github-token: ${{ github.token }}
      - name: Truth snapshots
        if: ${{ github.event.inputs.snapshot_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: wind-lr2-snapshot-${{ github.event.inputs.snapshot_run_id }}
          path: ${{ runner.temp }}/wlr2/snapshots
          run-id: ${{ github.event.inputs.snapshot_run_id }}
          github-token: ${{ github.token }}
      - name: Verified CLIM_GUST table (score only)
        if: ${{ github.event.inputs.command == 'score' }}
        uses: actions/download-artifact@v4
        with:
          name: clim-gust-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wlr2/clim_gust
      - name: Refuse loudly without the verified CLIM_GUST table (score only)
        if: ${{ github.event.inputs.command == 'score' }}
        run: |
          test -s "$RUNNER_TEMP/wlr2/clim_gust/wind_lr2_clim_gust.json" || { printf 'REFUSED: the verified CLIM_GUST table is absent; no score without it\n' >&2; exit 1; }
      - name: Run the command
        working-directory: backend
        env:
          EVID: ../docs/weather-program/evidence/wind-long-range-v2
          OWNER_WORD_REF: ${{ github.event.inputs.owner_word_ref }}
          COMMAND: ${{ github.event.inputs.command }}
        run: |
          test -n "$OWNER_WORD_REF" || exit 1
          C="$RUNNER_TEMP/wlr2"; mkdir -p "$C/runs_fit" "$C/runs_test"
          for f in wind_lr2_stations.json wind_lr2_pairing.json wind_lr2_clim_stations.npz wind_lr2_clim_gust.json.sha256 wind_lr2_coef_*.json; do cp "$EVID"/$f "$C"/ 2>/dev/null || true; done
          find "$C/downloaded" -name '*.npz' -path '*runs-fit*' -exec cp {} "$C/runs_fit/" \; 2>/dev/null || true
          find "$C/downloaded" -name '*.npz' -path '*runs-test*' -exec cp {} "$C/runs_test/" \; 2>/dev/null || true
          case "$COMMAND" in
            stations) python scripts/wind_lr2_stations.py freeze --cache "$C" --out "$C/wind_lr2_stations.json" ;;
            pair)     python scripts/wind_lr2_run.py pair --cache "$C" --spots "$EVID/spots.json" ;;
            fit)      python scripts/wind_lr2_run.py fit --cache "$C" ;;
            freeze)   python scripts/wind_lr2_run.py freeze --cache "$C" --out "$C/freeze-manifest.json" ;;
            score)    python scripts/wind_lr2_run.py score --cache "$C" --manifest "$EVID/freeze-manifest.json" --out "$C/report.json" ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wind-lr2-${{ github.event.inputs.command }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wlr2/*.json
            ${{ runner.temp }}/wlr2/*.json.sha256
            ${{ runner.temp }}/wlr2/*.VOID.md
            ${{ runner.temp }}/wlr2/*.npz

  archive:
    # Artifacts expire after 90 days and TEST scoring is February 2027 or later: copy every artifact and its sha256 to the
    # weather bucket (calibration/ prefix) and log the hashes. Secrets by NAME, in the supabase-service environment only.
    needs: [analyse]
    if: ${{ always() && needs.analyse.result != 'skipped' }}
    runs-on: ubuntu-latest
    environment: supabase-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests==2.31.0
      - uses: actions/download-artifact@v4
        with:
          pattern: wind-lr2-*
          path: ${{ runner.temp }}/art
      - name: Copy to the weather bucket with sha256
        working-directory: backend
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/wind_lr2_archive.py --src "$RUNNER_TEMP/art" --prefix "calibration/wind-lr2/$RUN_ID-$RUN_ATTEMPT"
