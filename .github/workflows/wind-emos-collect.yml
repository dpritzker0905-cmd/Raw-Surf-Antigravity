name: EMOS wind calibration record (offline collection, serves nothing)

# WHY: the matched-data record for long-range wind calibration (EMOS), pre-registered in
# docs/weather-program/log/2026-11-16-wind-emos-preregistration.md (+ amendments). David 2026-11-15 22:04 EST:
# "Start it, off-peak daily, but use historical data to help us eliminate wait time for calibrations".
# Reads PUBLIC data only (ECMWF open data on AWS, NDBC, IEM). It never calls the Raw Surf backend and writes no
# manifest or product: only create-only calibration/emos/ objects in the weather bucket.
# CREDENTIALS (advisor condition on #951, the #948 pattern): the service-role key exists ONLY in the two storage
# steps, which run the standard-library script emos_bucket_io.py as `python3 -I -S`. Installing packages,
# collecting and fitting all run with no credential in their environment.
# Daily at 10:07 UTC (00Z ENS is complete by ~07:40; clear of the ingest/precompute/pilots minutes). Backfill =
# workflow_dispatch, one date slice per dispatch, 4 shards.
# AUTO BACKFILL (David, 2026-11-23, director session: "Recover + backfill (Recommended)"): the second cron, 06:37 UTC
# (off-peak for the Actions queue), backfills ONE monthly slice a day from 2025-07 through 2026-10. The cursor is the
# stored record itself (backend/scripts/emos_backfill_next.py: the month after the newest stored month in range); past
# 2026-10 it no-ops. It refuses to plan on an unread fetch (no stations file, or no run before 2025-07: the 2026-11-19
# HTTP 401 read as an empty bucket), and an auto slice that stores no run fails loudly. Kill: repository variable
# EMOS_BACKFILL_AUTO = '0'.

on:
  schedule:
    - cron: '7 10 * * *'
    - cron: '37 6 * * *'     # auto backfill, one monthly slice a day (see the header)
  workflow_dispatch:
    inputs:
      mode:
        description: 'stations | backfill | daily | coverage | score'
        default: 'backfill'
      start:
        description: 'backfill start YYYY-MM-DD'
        default: '2025-06-01'
      end:
        description: 'backfill end YYYY-MM-DD (inclusive)'
        default: '2025-06-30'

permissions:
  contents: read

concurrency:
  group: wind-emos-collect
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  MODE: ${{ github.event.inputs.mode || (github.event.schedule == '37 6 * * *' && 'backfill' || 'daily') }}

jobs:
  single:
    environment: supabase-service   # the service-role key lives ONLY in this environment (dev/main)
    if: ${{ (github.event.inputs.mode || 'daily') != 'backfill' && github.event.schedule != '37 6 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Fetch stored state (storage only, stdlib, the only step with the key before collection)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "$MODE" = "coverage" ] || [ "$MODE" = "score" ]; then RUNS="--runs"; else RUNS=""; fi
          python3 -I -S backend/scripts/emos_bucket_io.py fetch --dir "$RUNNER_TEMP/emos" $RUNS
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements.txt eccodes==2.50.0
      - name: Collect or score (no credential)
        working-directory: backend
        run: |
          if [ "$MODE" = "coverage" ] || [ "$MODE" = "score" ]; then
            python scripts/wind_emos_fit.py "$MODE" --cache "$RUNNER_TEMP/emos" --runs "$RUNNER_TEMP/emos/runs" --out "$RUNNER_TEMP/emos/collect_report_emos_$MODE.json"
          else
            python scripts/wind_emos_collect.py "$MODE" --cache "$RUNNER_TEMP/emos"
          fi
      - name: Upload new objects (storage only, stdlib, create-only)
        if: ${{ (github.event.inputs.mode || 'daily') == 'daily' || github.event.inputs.mode == 'stations' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 -I -S backend/scripts/emos_bucket_io.py upload --dir "$RUNNER_TEMP/emos"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emos-${{ github.event.inputs.mode || 'daily' }}-report
          path: ${{ runner.temp }}/emos/collect_report_*.json
          if-no-files-found: ignore

  plan:
    # The auto backfill's one planning step: lists the stored record ONCE, so all 4 shards collect the same month.
    environment: supabase-service   # the service-role key lives ONLY in this environment (dev/main)
    if: ${{ github.event.schedule == '37 6 * * *' && (vars.EMOS_BACKFILL_AUTO || '1') != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      go: ${{ steps.next.outputs.go }}
      start: ${{ steps.next.outputs.start }}
      end: ${{ steps.next.outputs.end }}
      month: ${{ steps.next.outputs.month }}
    steps:
      - uses: actions/checkout@v5
      - name: Fetch stored state (storage only, stdlib)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 -I -S backend/scripts/emos_bucket_io.py fetch --dir "$RUNNER_TEMP/emos"
      - name: Next monthly slice (stdlib, no credential)
        id: next
        run: >-
          python3 -I -S backend/scripts/emos_backfill_next.py --existing "$RUNNER_TEMP/emos/existing_runs.json"
          --stations "$RUNNER_TEMP/emos/emos_stations.json" --first 2025-07 --last 2026-10

  backfill:
    environment: supabase-service   # the service-role key lives ONLY in this environment (dev/main)
    needs: plan
    if: ${{ always() && (github.event.inputs.mode == 'backfill' || needs.plan.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - name: Fetch stored state (storage only, stdlib)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 -I -S backend/scripts/emos_bucket_io.py fetch --dir "$RUNNER_TEMP/emos"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements.txt eccodes==2.50.0
      - name: Collect one shard of the slice (no credential)
        working-directory: backend
        run: >-
          python scripts/wind_emos_collect.py backfill --cache "$RUNNER_TEMP/emos"
          --start "${{ github.event.inputs.start || needs.plan.outputs.start }}"
          --end "${{ github.event.inputs.end || needs.plan.outputs.end }}" --shard ${{ matrix.shard }}/4
      - name: Upload new run files (storage only, stdlib, create-only)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 -I -S backend/scripts/emos_bucket_io.py upload --dir "$RUNNER_TEMP/emos"
      - name: An auto slice that stored no run fails loudly (the cursor stays, so the next day retries it)
        if: ${{ needs.plan.outputs.go == 'true' }}
        run: |
          n=$(ls "$RUNNER_TEMP/emos/runs/"*.npz.new 2>/dev/null | wc -l)
          echo "auto slice ${{ needs.plan.outputs.month }} shard ${{ matrix.shard }}: $n new run files"
          [ "$n" -gt 0 ] || { echo "::error::auto backfill ${{ needs.plan.outputs.month }} shard ${{ matrix.shard }} stored no run"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emos-backfill-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/emos/collect_report_*.json
          if-no-files-found: ignore
