name: EMOS wind calibration record (offline collection, serves nothing)

# WHY: the matched-data record for long-range wind calibration (EMOS), pre-registered in
# docs/weather-program/log/2026-11-16-wind-emos-preregistration.md (+ amendments). David 2026-11-15 22:04 EST:
# "Start it, off-peak daily, but use historical data to help us eliminate wait time for calibrations".
# Reads PUBLIC data only (ECMWF open data on AWS, NDBC, IEM). It never calls the Raw Surf backend and writes no
# manifest or product: only create-only calibration/emos/ objects in the weather bucket.
# CREDENTIALS (advisor condition on #951, the #948 pattern): the service-role key exists ONLY in the two storage
# steps, which run the standard-library script emos_bucket_io.py as `python3 -I -S`. Installing packages,
# collecting and fitting all run with no credential in their environment.
# Daily at 10:07 UTC (00Z ENS is complete by ~07:40; clear of the ingest/precompute/pilots minutes). Backfill =
# workflow_dispatch, one date slice per dispatch, 4 shards.

on:
  schedule:
    - cron: '7 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'stations | backfill | daily | coverage | score'
        default: 'backfill'
      start:
        description: 'backfill start YYYY-MM-DD'
        default: '2025-06-01'
      end:
        description: 'backfill end YYYY-MM-DD (inclusive)'
        default: '2025-06-30'

permissions:
  contents: read

concurrency:
  group: wind-emos-collect
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  MODE: ${{ github.event.inputs.mode || 'daily' }}

jobs:
  single:
    if: ${{ (github.event.inputs.mode || 'daily') != 'backfill' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Fetch stored state (storage only, stdlib, the only step with the key before collection)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "$MODE" = "coverage" ] || [ "$MODE" = "score" ]; then RUNS="--runs"; else RUNS=""; fi
          python3 -I -S backend/scripts/emos_bucket_io.py fetch --dir "$RUNNER_TEMP/emos" $RUNS
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements.txt eccodes==2.50.0
      - name: Collect or score (no credential)
        working-directory: backend
        run: |
          if [ "$MODE" = "coverage" ] || [ "$MODE" = "score" ]; then
            python scripts/wind_emos_fit.py "$MODE" --cache "$RUNNER_TEMP/emos" --runs "$RUNNER_TEMP/emos/runs" --out "$RUNNER_TEMP/emos/collect_report_emos_$MODE.json"
          else
            python scripts/wind_emos_collect.py "$MODE" --cache "$RUNNER_TEMP/emos"
          fi
      - name: Upload new objects (storage only, stdlib, create-only)
        if: ${{ (github.event.inputs.mode || 'daily') == 'daily' || github.event.inputs.mode == 'stations' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 -I -S backend/scripts/emos_bucket_io.py upload --dir "$RUNNER_TEMP/emos"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emos-${{ github.event.inputs.mode || 'daily' }}-report
          path: ${{ runner.temp }}/emos/collect_report_*.json
          if-no-files-found: ignore

  backfill:
    if: ${{ github.event.inputs.mode == 'backfill' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - name: Fetch stored state (storage only, stdlib)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 -I -S backend/scripts/emos_bucket_io.py fetch --dir "$RUNNER_TEMP/emos"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements.txt eccodes==2.50.0
      - name: Collect one shard of the slice (no credential)
        working-directory: backend
        run: >-
          python scripts/wind_emos_collect.py backfill --cache "$RUNNER_TEMP/emos"
          --start "${{ github.event.inputs.start }}" --end "${{ github.event.inputs.end }}" --shard ${{ matrix.shard }}/4
      - name: Upload new run files (storage only, stdlib, create-only)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 -I -S backend/scripts/emos_bucket_io.py upload --dir "$RUNNER_TEMP/emos"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emos-backfill-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/emos/collect_report_*.json
          if-no-files-found: ignore
