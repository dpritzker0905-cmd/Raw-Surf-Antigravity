name: EMOS wind calibration record (offline collection, serves nothing)

# WHY: the matched-data record for long-range wind calibration (EMOS), pre-registered in
# docs/weather-program/log/2026-11-16-wind-emos-preregistration.md (+ amendments 1-2). David 2026-11-15 22:04 EST:
# "Start it, off-peak daily, but use historical data to help us eliminate wait time for calibrations".
# Reads PUBLIC data only (ECMWF open data on AWS, NDBC, IEM). It never calls the Raw Surf backend and writes no
# manifest or product: only calibration/emos/ objects in the weather bucket. Daily at 10:07 UTC (after 00Z ENS is
# complete; clear of the ingest/precompute/pilots minutes). Backfill = workflow_dispatch, one slice of dates per
# dispatch, 4 shards.

on:
  schedule:
    - cron: '7 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'stations | backfill | daily'
        default: 'backfill'
      start:
        description: 'backfill start YYYY-MM-DD'
        default: '2025-06-01'
      end:
        description: 'backfill end YYYY-MM-DD (inclusive)'
        default: '2025-06-30'

permissions:
  contents: read

concurrency:
  group: wind-emos-collect
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements.txt eccodes==2.50.0
      - name: Collect
        working-directory: backend
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          if [ "$MODE" = "stations" ] || [ "$MODE" = "daily" ]; then
            if [ "${{ matrix.shard }}" != "0" ]; then echo "mode $MODE runs on shard 0 only"; exit 0; fi
            python scripts/wind_emos_collect.py "$MODE" --cache "$RUNNER_TEMP/emos" --upload
          else
            python scripts/wind_emos_collect.py backfill --cache "$RUNNER_TEMP/emos" --upload \
              --start "${{ github.event.inputs.start }}" --end "${{ github.event.inputs.end }}" --shard ${{ matrix.shard }}/4
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emos-collect-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/emos/collect_report_*.json
          if-no-files-found: ignore
