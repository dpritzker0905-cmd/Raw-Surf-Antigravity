# MOP-lite forward archive, ONE 00Z init per dispatch (gate docs/weather-program/gates/nearshore-moplite-v1.md, section 5).
# ⚠️ DISPATCH ONLY. No schedule, no push trigger: nothing runs until David says so. `owner_word_ref` is REQUIRED and must cite his
#    word (who, when, where); the job refuses a placeholder. The reference is echoed into the run summary and into the archive meta.
# ⚠️ GitHub-hosted runner only, never the Render box. Reads our tide table (series `am`) from the weather bucket and snapshots NDBC realtime2.
# ⚠️ partition_source=served reads the served chain's partitions from OUR STORED products only (a stored-only provider refuses any live fetch).
#    With the default `none` a run writes the aux files (ETA slice, truth snapshots) and exits 3 INCOMPLETE; it writes NO archive init.
# Secrets by NAME only: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (the same two the tide-own-series workflow uses). No value is in this file.
name: Nearshore-lite forward archive (dispatch only)
run-name: "MOP-lite archive ${{ inputs.init }}: ${{ inputs.go == '1' && 'WRITE' || 'dry run' }}"

on:
  workflow_dispatch:
    inputs:
      owner_word_ref:
        description: "REQUIRED. Where David authorised this run (e.g. 'David, chat, 2027-01-15 08:02 EST: run the first archive')."
        required: true
      init:
        description: "The 00Z init to archive, e.g. 2027-01-15T00:00Z."
        required: true
      targets_path:
        description: "Repo path of the JSON target list ([{id, lat, lon}])."
        required: true
      stations:
        description: "Comma-separated NDBC station ids to snapshot (truth)."
        required: false
        default: ''
      partition_source:
        description: "none (default: aux files only, exit 3) or served (the served chain's partitions from OUR stored products, never a live fetch)."
        required: false
        default: 'none'
      model:
        description: "Model member the served chain uses for these targets (default EURO)."
        required: false
        default: 'EURO'
      go:
        description: "1 = write files. Anything else = dry run (reads the tide table, prints the plan, writes nothing)."
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend requirements
        run: pip install -r backend/requirements.txt
      - name: Archive one init (partitions: unbuilt interface; exit 3 = INCOMPLETE, aux only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OWNER_WORD_REF: ${{ inputs.owner_word_ref }}
          INIT: ${{ inputs.init }}
          TARGETS: ${{ inputs.targets_path }}
          STATIONS: ${{ inputs.stations }}
          GO: ${{ inputs.go }}
          PARTITION_SOURCE: ${{ inputs.partition_source }}
          MODEL: ${{ inputs.model }}
        run: |
          set -uo pipefail
          { echo '### MOP-lite forward archive'; echo "owner word: \`$OWNER_WORD_REF\`"; echo "init: \`$INIT\` (go=$GO)"; } >> "$GITHUB_STEP_SUMMARY"
          args=(--init "$INIT" --targets "$TARGETS" --stations "$STATIONS" --out nearshore_lite_archive_out --owner-word-ref "$OWNER_WORD_REF" --partition-source "$PARTITION_SOURCE" --model "$MODEL")
          if [ "$GO" = "1" ]; then args+=(--go); fi
          python backend/scripts/nearshore_lite_archive.py "${args[@]}" | tee plan.json
          code=${PIPESTATUS[0]}
          { echo '```json'; cat plan.json; echo '```'; echo "exit code: $code (0 archived, 3 INCOMPLETE: no partition source)"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Upload the aux files, truth snapshots and any archive
        if: ${{ always() && inputs.go == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: nearshore-lite-archive
          path: nearshore_lite_archive_out
          if-no-files-found: ignore
