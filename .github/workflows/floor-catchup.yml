# CI floor catch-up (owner: "Yes, build it", 2026-11-23).
# After every SUCCESSFUL `CI` push run on dev, read what each backend lane printed in that run and, when a lane's floor
# has fallen behind it (ci_floor_staleness.py's own rule), open or update ONE fragments-only PR to dev
# (`bot/floor-catchup-<run_id>`). Nothing stale: no PR, and an open catch-up PR that is no longer needed is closed.
# The script is backend/scripts/floor_catchup.py (its docstring holds the arithmetic and the safety checks); tests in
# backend/tests/test_floor_catchup.py. It never merges: the advisor gate and the merge loop do.
#
# TOKEN, by NAME only. A PR pushed or opened with GITHUB_TOKEN does not trigger workflows, so CI would never report its
# required checks. The PR is therefore opened with a fine-grained PAT (this repo only; contents + pull requests
# read/write): secret FLOOR_CATCHUP_PR_TOKEN, else the existing SERVED_WAVE_VERIFY_PR_TOKEN. With neither set it falls
# back to GITHUB_TOKEN and says so: the PR still opens, but someone must close and reopen it (or push) before CI runs.
# Reading the run's logs needs `actions: read`, which GITHUB_TOKEN carries (permissions below).

name: CI floor catch-up

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write
  actions: read

# One at a time, never cancelled: two runs racing would each open a PR.
concurrency:
  group: floor-catchup
  cancel-in-progress: false

jobs:
  catchup:
    # Only green PUSH runs on dev, of THIS repository, are readings of dev (never a PR run, never a fork's branch).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pick the PR token (by secret name)
        id: tok
        env:
          T1: ${{ secrets.FLOOR_CATCHUP_PR_TOKEN }}
          T2: ${{ secrets.SERVED_WAVE_VERIFY_PR_TOKEN }}
        run: |
          if [ -n "$T1" ]; then echo "which=FLOOR_CATCHUP_PR_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "$T2" ]; then echo "which=SERVED_WAVE_VERIFY_PR_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "which=GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
            echo "::warning title=Floor catch-up without a PAT::neither FLOOR_CATCHUP_PR_TOKEN nor SERVED_WAVE_VERIFY_PR_TOKEN is set; a PR opened with GITHUB_TOKEN gets no CI until it is closed and reopened"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Checkout LAST before the script: it persists the PAT in .git/config for the push, so no other action runs after it.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.FLOOR_CATCHUP_PR_TOKEN || secrets.SERVED_WAVE_VERIFY_PR_TOKEN || github.token }}

      # Stdlib + `gh` only (preinstalled): no pip install.
      - name: "📏 Catch stale floors up to dev run ${{ github.event.workflow_run.id }}"
        env:
          # Reading another run's logs: GITHUB_TOKEN (actions: read). `gh pr ...` writes: the PAT picked above (the
          # script swaps it in for those calls only). `git push` uses the checkout's token, the same PAT.
          GH_TOKEN: ${{ github.token }}
          PR_TOKEN: ${{ secrets.FLOOR_CATCHUP_PR_TOKEN || secrets.SERVED_WAVE_VERIFY_PR_TOKEN || github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TOKEN_NAME: ${{ steps.tok.outputs.which }}
        run: |
          echo "token: $TOKEN_NAME"
          python backend/scripts/floor_catchup.py --run "$RUN_ID" --sha "$HEAD_SHA"
