name: Tide A harcon gate v2 (pre-flight, then the one v2 run)
# WHY: gates/tide-a-harcon-v2.md. Two numbered tags, each on David's typed word (pushed by the director):
#   tide-a-harcon-v2-preflight-<n>  the outcome-blind PRE-FLIGHT (s6, s12): the 383 SEEN stations over [2027-07-01, 07-15),
#                                   own-constants C2 on the 6-min grid plus four planted breaks; NO candidate arm, no FES.
#   tide-a-harcon-v2-<n>            the ONE v2 run (s3-s5, s11, s12) on the frozen fresh stations over [2027-07-15, 07-29);
#                                   it REFUSES to start unless research/tide-a-harcon-v2-preflight-result.json is committed
#                                   with "status": "PASS".
# Predictions only: paced, fail-closed CO-OPS access (coops_pacing via paced_run, R1/R2, outcome.json); no bucket write,
# nothing served, no live backend. PyFES is GPL and runs only here; pyTMD (MIT); NOAA harcon is public domain.
on:
  push:
    tags: ['tide-a-harcon-v2-preflight-[0-9]*', 'tide-a-harcon-v2-[0-9]*']
permissions:
  contents: read
concurrency:
  group: tide-a-harcon-v2
  cancel-in-progress: false
jobs:
  preflight:
    if: startsWith(github.ref_name, 'tide-a-harcon-v2-preflight-')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install (pyTMD for the candidate's own synthesis; no PyFES needed)
        run: pip install "pyTMD==3.1.0" "timescale==0.1.3" numpy pandas lxml pyyaml
      - name: Pre-flight (own-constants identities plus four planted breaks; paced)
        timeout-minutes: 120
        run: python backend/scripts/tide_datum/paced_run.py --budget-s 6900 --outcome outcome.json backend/scripts/tide_datum/a_harcon_v2_preflight.py --json tide_a_harcon_v2_preflight.json
      - name: Outcome (R2; always)
        if: always()
        run: |
          if [ ! -f outcome.json ]; then
            if [ -f tide_a_harcon_v2_preflight.json ]; then
              python -c "import json; v=json.load(open('tide_a_harcon_v2_preflight.json'))['verdict']['status']; json.dump({'status': 'preflight_scored', 'verdict': v}, open('outcome.json', 'w'))"
            else
              echo '{"status": "no_run_unknown", "step": "pre-flight (a timeout or a crash before its output)"}' > outcome.json
            fi
          fi
          cat outcome.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tide-a-harcon-v2-preflight
          path: |
            tide_a_harcon_v2_preflight.json
            coops_requests.jsonl
            outcome.json
          if-no-files-found: ignore
          retention-days: 30
  download:
    if: startsWith(github.ref_name, 'tide-a-harcon-v2-') && !startsWith(github.ref_name, 'tide-a-harcon-v2-preflight-')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refuse without a committed pre-flight PASS (gate v2 s6, s7)
        run: python backend/scripts/tide_datum/a_harcon_v2_preflight_ok.py
      - name: Install (offline-only dependencies, pinned as the tide gates)
        run: pip install "pyfes==2026.5.2" "paramiko==5.1.0" netCDF4 numpy scipy xarray h5netcdf pandas lxml pyyaml
      - name: Restore FES2022b downloads
        uses: actions/cache/restore@v4
        with:
          path: fes_cache
          key: fes2022b-aharcon2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fes2022b-aharcon-
            fes2022b-mllw-
            fes2022b-own-
      - name: Download FES2022b (AVISO, pinned host key; cached files skipped)
        timeout-minutes: 320
        env:
          AVISO_USERNAME: ${{ secrets.AVISO_USERNAME }}
          AVISO_PASSWORD: ${{ secrets.AVISO_PASSWORD }}
        run: python backend/scripts/tide_own/build_series.py --spots /dev/null --download-fes-only --fes-cache fes_cache
      - name: Drop partial files before saving
        if: always()
        run: |
          mkdir -p fes_cache
          rm -f fes_cache/*.part
      - name: Save FES2022b downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fes_cache
          key: fes2022b-aharcon2-${{ github.run_id }}-${{ github.run_attempt }}
  gate:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refuse without a committed pre-flight PASS (again, in this job)
        run: python backend/scripts/tide_datum/a_harcon_v2_preflight_ok.py
      - name: Install (offline-only dependencies, pinned as the tide gates)
        run: pip install "pyfes==2026.5.2" "pyTMD==3.1.0" "timescale==0.1.3" "paramiko==5.1.0" netCDF4 numpy scipy xarray h5netcdf pandas lxml pyyaml
      - name: Restore FES2022b downloads (this run's)
        uses: actions/cache/restore@v4
        with:
          path: fes_cache
          key: fes2022b-aharcon2-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: C1 finder control (vendored finder_check.py, paced; the v2 candidates, the v2 window)
        timeout-minutes: 60
        run: python backend/scripts/tide_datum/paced_run.py --budget-s 3300 --outcome outcome.json backend/scripts/tide_datum/finder_check.py --start 2027-07-15 --days 14 --stations docs/weather-program/research/tide-a-harcon-v2-stations.json --json tide_a_harcon_v2_finder.json
      - name: Instrument (both arms hourly; C2 on the 6-min grid; C5; paced)
        timeout-minutes: 120
        run: python backend/scripts/tide_datum/paced_run.py --budget-s 6900 --outcome outcome.json backend/scripts/tide_datum/a_harcon_parity.py --fes-cache fes_cache --work a_work --start 2027-07-15 --days 14 --stations docs/weather-program/research/tide-a-harcon-v2-stations.json --c2-grid-min 6 --c5 --json tide_a_harcon_v2_run.json
      - name: Score (pure; v2 fixed C2 bars from the gate text; C5; refuses an incomplete run)
        run: python backend/scripts/tide_datum/a_harcon_score.py --v2 --run tide_a_harcon_v2_run.json --finder tide_a_harcon_v2_finder.json --stations docs/weather-program/research/tide-a-harcon-v2-stations.json --out tide_a_harcon_v2_score.json
      - name: Outcome (R2; always)
        if: always()
        run: |
          if [ ! -f outcome.json ]; then
            if [ -f tide_a_harcon_v2_score.json ]; then
              python -c "import json; v=json.load(open('tide_a_harcon_v2_score.json'))['verdict']; json.dump({'status': 'scored', 'verdict': v}, open('outcome.json', 'w'))"
            elif [ -f tide_a_harcon_v2_run.json ]; then
              echo '{"status": "run_without_score", "note": "a complete run JSON exists but no score; R1 (b) fails, so this is a run"}' > outcome.json
            else
              echo '{"status": "no_run_unknown", "step": "unknown (a timeout or a crash before any score)", "station": null, "attempts": null}' > outcome.json
            fi
          fi
          cat outcome.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tide-a-harcon-v2
          path: |
            tide_a_harcon_v2_run.json
            tide_a_harcon_v2_finder.json
            tide_a_harcon_v2_score.json
            coops_requests.jsonl
            outcome.json
          if-no-files-found: ignore
          retention-days: 30
