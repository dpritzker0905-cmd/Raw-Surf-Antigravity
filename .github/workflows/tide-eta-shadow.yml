name: Tide eta shadow read (option B by lead)
# WHY (advisor + director, 2026-11-15): option B (eta = NOAA tide + model surge) passed its held-out test on HINDCAST
# water; in production the surge at +24..+72 h is a FORECAST and the guardrail is BLIND to it. Daily, record what
# production would serve at 20 NOAA stations (scripts/tide_eta_shadow.py record -> tides/shadow/ in the bucket); score
# by dispatch (mode=score) after >= 14 records. Pass line in docs/weather-program/log/2026-11-15-claude-tide-harmonic.md.
# Never calls Render. Off switch: repository variable TIDE_ETA_SHADOW = '0' (unset = on).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "record or score"
        required: false
        default: 'record'
permissions:
  contents: read
concurrency:
  group: tide-eta-shadow
  cancel-in-progress: false
jobs:
  shadow:
    if: github.event_name == 'workflow_dispatch' || (vars.TIDE_ETA_SHADOW || '1') != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Shadow read
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/tide_eta_shadow.py "${{ inputs.mode || 'record' }}"
