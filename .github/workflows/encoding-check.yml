# ⛔ THIS GUARD RAN 0 TIMES IN ITS ENTIRE LIFE (measured 2026-08-05: `gh run list` -> 0 runs).
# It triggered on `pull_request` only, and this repo pushes DIRECTLY to `dev`; promotions to `main`
# are fast-forwards. There has never been a pull request for it to run on, so an encoding guard has
# been protecting nothing while the repo carries a live cp1252/UTF-8 landmine.
# ⇒ Trigger on push to the branches that actually receive commits. `pull_request` is kept for the
#   day the flow changes.
# ⚠️ The `paths:` filter is DELIBERATE and this job must NEVER become a required status check —
#   a required check that a path filter skips reports MISSING and blocks the branch forever
#   (measured on `loc-check`). Keep it advisory.
name: Encoding Guard

on:
  push:
    branches: [dev, main]
    paths:
      - 'frontend/src/**/*.js'
      - 'frontend/src/**/*.jsx'
  pull_request:
    paths:
      - 'frontend/src/**/*.js'
      - 'frontend/src/**/*.jsx'
  workflow_dispatch: {}

# A new commit on a PR cancels that PR's older run of this workflow (the Actions queue was the bottleneck,
# 2026-11-19). PUSHES TO DEV SHARE ONE GROUP, `push-dev` (2026-11-23, owner: "Yes, small CI PR"): GitHub keeps
# one RUNNING and only the NEWEST PENDING run per group (default `queue: single`), and cancel-in-progress stays
# false for pushes, so a running dev CI is never killed and every merge in between drops its pending run. Before
# this each push had its own group (run id) and 15 full runs (~25 min each) queued on dev in one afternoon,
# starving every PR. Dev CI is now "latest wins": not every merge gets a dev run of its own. The readers already
# cope (floor-catchup.yml fires only on a green run; ci_floor_staleness.py reads the newest green run;
# ci_floor_overlift.py walks every commit since it). Do NOT also cancel the running one: merges land every few
# minutes, so dev would never finish a green run and both floor readers would starve.
# Pushes to main (the production promotion) or any other branch keep a group per run: each keeps its evidence.
# Pinned by backend/tests/test_ci_push_concurrency.py.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/dev') && 'push-dev' || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for garbled UTF-8 sequences
        run: |
          echo "Scanning for garbled multi-byte UTF-8 corruption..."
          GARBLED=$(grep -rlP 'Ã[ƒ†]|Ã¯Â¿|ÃƒÆ' frontend/src/ --include="*.js" --include="*.jsx" || true)
          if [ -n "$GARBLED" ]; then
            echo "❌ Garbled UTF-8 detected in the following files:"
            echo "$GARBLED"
            echo ""
            echo "Fix: Replace raw multi-byte emoji with \\u{XXXXX} Unicode escapes"
            echo "See: project rules → Emoji & Unicode section"
            exit 1
          else
            echo "✅ No garbled UTF-8 found - all clear!"
          fi
