name: Tide G3 Copernicus readers smoke (one gauge, outside the G3 window)
# WHY: the G3 gate's S1 preflight / altimetry climatology / GLO12 analysis readers need Copernicus credentials, so they
# can only be exercised in Actions. One gauge (Honolulu), dates outside the G3 window, no truth, nothing scored.
# Runs only on pushes to its own branch (never the gate's branch or tag). Copernicus credentials on this step only.
on:
  push:
    branches: [claude/tide-m1-eot20-check]
    paths:
      - backend/scripts/tide_g3_cm_smoke.py
      - backend/scripts/tide_g3/g3_sources.py
      - .github/workflows/tide-g3-cm-smoke.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: pip install "copernicusmarine==2.4.1" numpy scipy xarray h5netcdf netCDF4 pandas
      - name: Smoke
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python backend/scripts/tide_g3_cm_smoke.py > cm_smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tide-g3-cm-smoke
          path: cm_smoke.json
          if-no-files-found: ignore
          retention-days: 14
