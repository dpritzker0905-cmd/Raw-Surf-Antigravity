name: Flag guardrail (D-065, live; dry run until enforced)

# WHY (owner, 2026-11-04 ~01:41Z): fixes ship ON "and have a checker or filter to see if its working or not"
# (DECISIONS D-065). Every 6 h, after precompute's slots, backend/scripts/flag_guardrail.py scores each ON guarded fix
# (services/runtime_flags.GUARDED) ON against OFF over the rolling 14 days, offline in this job from public forecast and
# buoy data; checks the sanity bounds (height/rating ranges, swell monotonicity, alert volume per user-day vs its cap);
# and, ONLY when the repo variable FLAG_GUARDRAIL_ENFORCE is '1', writes 'off' with a reason into the runtime manifest
# control/flags.json (weather-products bucket), which Render and the lanes read within 5 minutes, with no deploy.
# It never calls the Render backend. It is the ONLY writer of control/flags.json. Secrets by NAME only.
# DRY RUN by default: with FLAG_GUARDRAIL_ENFORCE unset or '0' it writes nothing and reports what it would do.
# The owner enforces it with: gh variable set FLAG_GUARDRAIL_ENFORCE --body 1
# HYBRID (D-087): it only writes 'off'; a FIX_VERSION bump keeps the flag off and starts a shadow run (N=3
# consecutive NOT_WORSE cycles, ~18 h); only after that does the owner's word turn it back on
# (dispatch with reenable + owner_words, which still needs FLAG_GUARDRAIL_ENFORCE '1' to write).

on:
  schedule:
    - cron: '30 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      reenable:
        description: "Owner re-enable: the guarded flag to turn back on (empty = a normal guardrail run)"
        required: false
        default: ""
      owner_words:
        description: "The owner's words authorizing the re-enable, verbatim"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: flag-guardrail
  cancel-in-progress: false

jobs:
  guardrail:
    environment: supabase-service   # the service-role key lives ONLY in this environment (dev/main)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -q -r requirements.txt

      - name: Restore the rolling cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/guardrail-cache
          key: flag-guardrail-${{ github.run_id }}
          restore-keys: flag-guardrail-

      - name: Guardrail
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLAG_GUARDRAIL_ENFORCE: ${{ vars.FLAG_GUARDRAIL_ENFORCE || '0' }}
          # G1a: the consensus ledger guard is REPORT-ONLY until this repo variable is '1', set after the research
          # lead's READ of a real run (a ledger FIRE is printed, never a strike, before that). Name only, no secret.
          LEDGER_GUARD_RELEASED: ${{ vars.LEDGER_GUARD_RELEASED || '0' }}
          RUNTIME_FLAGS_MANIFEST: '0'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REENABLE: ${{ inputs.reenable }}
          OWNER_WORDS: ${{ inputs.owner_words }}
          # REPO_OWNER_LOGIN: the repo owner's GitHub login, stored as a repo variable (not a secret — not sensitive).
          # Set it once with: gh variable set REPO_OWNER_LOGIN --body <login>
          # owner_reenable() fails closed if this is unset, so a misconfigured workflow cannot be bypassed.
          REPO_OWNER_LOGIN: ${{ vars.REPO_OWNER_LOGIN }}
        run: |
          python scripts/flag_guardrail.py --cache-dir "$RUNNER_TEMP/guardrail-cache" --out "$RUNNER_TEMP/guardrail-out" \
            --reenable "$REENABLE" --owner-words "$OWNER_WORDS" --owner-login "$REPO_OWNER_LOGIN" \
            --commit "$GITHUB_SHA"
          cat "$RUNNER_TEMP/guardrail-out/guardrail.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the guardrail issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ENFORCE: ${{ vars.FLAG_GUARDRAIL_ENFORCE || '0' }}
        run: |
          f="$RUNNER_TEMP/guardrail-out/guardrail.md"
          [ -f "$f" ] || exit 0
          acted="$(cat "$RUNNER_TEMP/guardrail-out/acted.txt" 2>/dev/null || true)"
          [ -n "$acted" ] || exit 0
          tag="[dry run] "; [ "$ENFORCE" = "1" ] && tag=""
          title="${tag}Flag guardrail: ${acted}"
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Flag guardrail in:title" --json number,title --jq '[.[] | select(.title | contains("PHYSICS guard blind") | not)][0].number // empty')"
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file "$f"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$f"; fi

      # GUARD-BLIND (advisor hold on #1267): a PHYSICS-guarded flag that is ON but has been UNTESTABLE for 4+ consecutive runs
      # (~24 h) gets ONE open issue; the next run that judges it again closes that issue. Report only: it never disables a flag.
      # Its title never contains "Flag guardrail" and the main issue's search excludes it (advisor, #1267): a DISABLE notice must
      # never land on the blind issue, which a judged run auto-closes.
      - name: Open or close the GUARD-BLIND issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/guardrail-out"
          [ -f "$d/guard-blind.txt" ] || exit 0
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"PHYSICS guard blind\" in:title" --json number,title --jq '[.[] | select(.title | startswith("PHYSICS guard blind"))][0].number // empty')"
          if [ -s "$d/guard-blind.txt" ]; then
            [ -n "$n" ] || gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "PHYSICS guard blind: a physics guard has judged nothing for 24 h" --body-file "$d/guard-blind.txt"
          elif [ -s "$d/guard-judged.txt" ] && [ -n "$n" ]; then
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Judged again this run: $(tr '\n' ' ' < "$d/guard-judged.txt")"
          fi

      - name: Upload the guardrail report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flag-guardrail
          path: ${{ runner.temp }}/guardrail-out/guardrail.*
          retention-days: 30
