# Regional-pilot ingestion, split from the core forecast cycle (2026-07-04 timeout fix).
#
# WHY: measured phase timings (run 28673349217) — core globals ~45 min, but the regional pilots
# add ~67 min (GFS marine pilot 21m + GFS/ICON/EURO wind pilots 46m). Full single-cycle runs
# brushed the 165-min job timeout and periodically tripped it (GitHub reports a timeout as
# "cancelled"); timed-out runs upload early hours but never reach their prunes → superseded-
# product debt (the audited GFS ~763 products/layer). Splitting gives the CORE cycle (the global
# layers every heatmap + /point depends on) a guaranteed finish, and the pilots their own budget.
#
# SERIALIZATION (history): until 2026-07-14 this workflow SHARED one concurrency group with
# forecast-ingest.yml — manifest.json upload was last-writer-wins, so concurrent runs clobbered
# each other's product registrations and the two lanes were forced serial. That shared group's
# congestion is what caused the pending-slot eviction cascade (three dead core cycles, 07-13).
# Since 2026-07-14 every manifest upload reconciles against the fresh remote product list
# (reconcile_manifest_products_for_upload in store.py — saves AND prunes), so the lanes run in
# SEPARATE groups and may overlap freely; each lane still serializes with itself. The :45 cron
# offset is kept (staggering fetch load costs nothing).
name: Forecast Ingestion Pilots (regional tiles)

on:
  workflow_dispatch: {}
  schedule:
    # 6x/day → 3x/day (2026-07-13 lane-collision audit): the shared serial group's worst case
    # (pilots ≤200 min + core ≤165 min = 365 min) exceeded the 240-min core period, so under GH
    # cron drift the runs stacked and PENDING core runs were repeatedly EVICTED (three cancelled
    # core cycles on 07-13; two never started — startedAt null). 3x/day pilots loses almost no
    # freshness: GWAM (ICON waves) publishes 2 runs/day, GFS-Wave 4/day — 6x/day was re-ingesting
    # the SAME model runs. Worst-case group load now ~(200+165)×3 within 1440 min with wide gaps.
    - cron: '45 3,11,19 * * *'

concurrency:
  group: forecast-ingest-pilots  # OWN lane since 2026-07-14 — manifest merge-on-upload made core overlap safe (see header)
  cancel-in-progress: false

jobs:
  ingest-pilots:
    runs-on: ubuntu-latest
    # 165 → 200 (2026-07-13): measured phase ledger from run 29249603524 (cancelled at the old
    # wire): GFS mid 32m + ICON mid 17m + EURO mid 4m + GFS marine pilot 51m (was ~21m at the
    # 07-04 baseline — worldwide 2/cycle + 0.25° 8-day NOAA fetches ballooned it, own audit item)
    # + ICON marine pilot 29m (now bounded to ~10m: flagship-only + 2d) + wind pilots ~50m+
    # ≈ 185m healthy total — the lane was ALREADY over 165 before the ICON pilot landed. 200
    # keeps 40 min under the 240-min cron interval (shared-group serialization stays safe).
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
      # ⚠️ 3.12 TO MATCH PRODUCTION, WHICH THIS LANE FEEDS. The server runs 3.12 (measured:
      # /api/health `runtime.python`), and this lane was 3.11 — so the artifacts were written by one
      # numeric stack (numpy 2.4.6) and read by another (2.5.1).
      # ★ CLEARED BY AN ARTIFACT-LEVEL CHECK, NOT BY THE JOB GOING GREEN: the composition and the
      #   numpy-backed ocean_access helpers were driven on FIXED inputs under both interpreters and
      #   produced BYTE-IDENTICAL output (6064 B, sha256 2fd2d006f740...), with a mutation control
      #   on each side proving the harness could detect a difference at all.
      #   Re-run it before any future interpreter move: workflow `artifact-interpreter-parity`.
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run regional-pilot ingestion -> Supabase L2
        working-directory: backend
        env:
          NODE_ENV: production
          RENDER: 'true'
          MANIFEST_IMMUTABLE_PUBLICATION: '0' # Dark: same publication contract as core writer
          FORECAST_JOB_STAGGER_SEC: '0'
          INGEST_PILOTS: 'only'             # pilots only — the core cycle owns the globals
          CONSENSUS_INGEST: '1'         # ARMED by the owner's merge of the arming PR (D-009; declared '0' by #164). '1' builds the equal GFS/EURO/ICON mean as the SHADOW model CONSENSUS in the pilots lane (consensus_ingest.py) and adds the `raw_surf:CONSENSUS` lane to the skill ledger that forecast-ingest.yml and precompute.yml run. Serves nothing either way. ARM ALL THREE TOGETHER: forecast-ingest-pilots.yml, forecast-ingest.yml, precompute.yml.
          SAMPLER_SCALAR_HEIGHT: '0'    # DECLARED AT DEFAULT (2026-09-30, dark): '1' interpolates a MARINE height as the scalar it is (the corners' weighted mean) instead of sqrt(u^2+v^2) of their vector mean, which shrinks it wherever the corners' directions diverge (islands, headlands: NDBC 51202 served 0.98 m, scalar 1.45, same-model cell 1.44, buoy 2.0; 11% of rated spots read > 5% low). Direction keeps the vector mean; wind is untouched. See sampler.scalar_marine_height_enabled. Moves served heights on every surface: flip ONLY on the owner's word, in ALL of forecast-ingest.yml, forecast-ingest-pilots.yml, precompute.yml AND the Render env together.
          REGRID_NATIVE_CELL: '1'       # FLIPPED by the owner's merge of the flip PR (D-010; declared '0' by #171, made coast-safe by #173: real GRIB run 36626767710 on its final code lost 0 total-height values). '1' makes every 0.25-deg regional wave tile (GFS, ICON and EURO) read its EXACT native cell; at '0' each node is the 2x2 block NORTH-WEST of it (half = max(1, round(0.25/0.25/2)) = 1), a mean placed half a cell (~14 km) south-east of its water, found by same_model_parity_probe (node = Open-Meteo's NW 2x2 to 1 cm on 72% of rows). Coarser tiers are untouched. Moves served heights and directions on every regional tile: flip ONLY on the owner's word, and in BOTH fetch lanes together (forecast-ingest.yml, forecast-ingest-pilots.yml), never one, or the same coast is regridded two ways by cycle. See services/_fetch_native_cell.py.
          GFS_MARINE_STAGE_B: '1'       # FLIPPED by the owner (2026-09-29: 'flip the Stage B PNW box'; D-011; declared '0' by #177). '1' adds the F-08 Stage B GFS-only box us_pacific_northwest (38-49N, 128-122W: NorCal, Oregon, Washington, 23 spots) to the GFS marine pass. Measured first: the 2-deg tier those spots use today reads +0.097 m vs the same model (46244 Humboldt +0.50 m). Flip in BOTH fetch lanes together.
          ECMWF_PERIOD_BANDS: '0'           # DECLARED AT DEFAULT (2026-08-02, audit v5 F8). This lane shares `scripts/ingest_forecast_ci.py` with forecast-ingest.yml and REACHES the ECMWF fetcher (via euro_marine_coarse_ingestion -> ecmwf_wave_service, and marine_mid_res_ingestion for the 0.25 deg regional tiles), so it must carry the same value. Flipped in the core lane only, the global coarse EURO field would carry period bands while every regional tile did not — THE SAME COAST WOULD DECOMPOSE ITS SEA DIFFERENTLY BY ZOOM LEVEL. ⚠️ Verified by import-graph walk, not assumed: precompute.yml reaches NO ecmwf module (57 files walked) and correctly does NOT declare this; this lane reaches it (81 files walked) and does.
          WORLDWIDE_REGIONS_PER_CYCLE: '3'  # 12 worldwide regions / 3 per fire = 4 fires = 32 h cadence — RAISED 2->3 with the 2026-08-09 four-region expansion; the divisor and the region count move TOGETHER (test_worldwide_count_and_per_cycle_keep_the_32h_cadence)
          # GFS marine pilot horizon: 8d → 3d (2026-07-13) → 5d (2026-08-01).
          #
          # The 3d cut was correct FOR ITS TIME: cost was ∝ forecast-hours × REGIONS, because each
          # region did its own download pass (run 29265599972: 48.5 min = 4 regions × ~11.5 min;
          # 672-pt FL and 5760-pt Brazil took the SAME time — the tell that the bbox never reached
          # the wire). Multi-bbox (2026-07-31) removed the × REGIONS term: one pass per HORIZON
          # GROUP now covers all 10 regions, and this lane's marine download fell 276 → 138 steps.
          #
          # 3d → 5d is that freed budget spent where measurement says it pays. Two measurements:
          #   • What the coarse tier costs (scripts/tier_resolution_delta.py, 8 regions holding both
          #     tiers): BREAKING height median 21.0%, max 41.7%, signed both ways. Systematic
          #     geometry error — it does NOT shrink with lead the way forecast error grows.
          #   • Forecast uncertainty at that lead, as inter-model spread with the TIER HELD CONSTANT
          #     (all 3 models forced onto global_mid — mixing tiers inflated 72h by 68% and nearly
          #     produced the opposite conclusion): 24h 24.1%, 72h 23.6%, 120h 36.0%.
          # Ratio of uncertainty to resolution is 1.13-1.72x out to day 5 — COMPARABLE, so the
          # refinement is real there, not swamped. Past ~day 5 it is unmeasured (ICON/EURO have no
          # global_mid product beyond their native horizons), so the horizon stops at 5d rather
          # than guessing. Do not raise further without re-running both instruments.
          #
          # Cost: download 138 → 154 steps (+12%, inside what multi-bbox freed); regional marine
          # products 1,704 → 2,216 per fire (~+4% of the 12k-product manifest).
          # Revert = set this back to '3'. Pilot-lane-only: this env is set per-workflow.
          GFS_MARINE_FORECAST_DAYS: '5'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          WEATHER_PROXY_URL: ${{ secrets.WEATHER_PROXY_URL }}
          # §3 Option A dominant-swell animation channel (2026-07-13). A/B via repo Actions
          # VARIABLES (Settings → Secrets and variables → Actions → Variables) — no commit needed.
          WAVES_ANIM_DOMINANT_SWELL: ${{ vars.WAVES_ANIM_DOMINANT_SWELL || '0' }}
          WAVES_ANIM_SWELL_MIN_FRAC: ${{ vars.WAVES_ANIM_SWELL_MIN_FRAC || '0.35' }}
          # ICON marine 0.25° regional pilot (2026-07-13, round-12 §2a-i — ICON close-zoom fix).
          # No-commit kill via repo Actions variable: set ICON_MARINE_PILOT_INGEST=0.
          ICON_MARINE_PILOT_INGEST: ${{ vars.ICON_MARINE_PILOT_INGEST || '1' }}
          # EURO marine 0.25° regional pilot (2026-07-13 — the EURO rating-band resolution fix,
          # free ECMWF wave stream, no CMEMS). No-commit kill: set EURO_MARINE_PILOT_INGEST=0.
          EURO_MARINE_PILOT_INGEST: ${{ vars.EURO_MARINE_PILOT_INGEST || '1' }}
        run: python scripts/ingest_forecast_ci.py
