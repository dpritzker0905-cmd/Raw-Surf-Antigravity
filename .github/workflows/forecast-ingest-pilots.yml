# Regional-pilot ingestion, split from the core forecast cycle (2026-07-04 timeout fix).
#
# WHY: measured phase timings (run 28673349217) — core globals ~45 min, but the regional pilots
# add ~67 min (GFS marine pilot 21m + GFS/ICON/EURO wind pilots 46m). Full single-cycle runs
# brushed the 165-min job timeout and periodically tripped it (GitHub reports a timeout as
# "cancelled"); timed-out runs upload early hours but never reach their prunes → superseded-
# product debt (the audited GFS ~763 products/layer). Splitting gives the CORE cycle (the global
# layers every heatmap + /point depends on) a guaranteed finish, and the pilots their own budget.
#
# SERIALIZATION (history): until 2026-07-14 this workflow SHARED one concurrency group with
# forecast-ingest.yml — manifest.json upload was last-writer-wins, so concurrent runs clobbered
# each other's product registrations and the two lanes were forced serial. That shared group's
# congestion is what caused the pending-slot eviction cascade (three dead core cycles, 07-13).
# Since 2026-07-14 every manifest upload reconciles against the fresh remote product list
# (reconcile_manifest_products_for_upload in store.py — saves AND prunes), so the lanes run in
# SEPARATE groups and may overlap freely; each lane still serializes with itself. The :45 cron
# offset is kept (staggering fetch load costs nothing).
name: Forecast Ingestion Pilots (regional tiles)

on:
  workflow_dispatch: {}
  schedule:
    # 6x/day → 3x/day (2026-07-13 lane-collision audit): the shared serial group's worst case
    # (pilots ≤200 min + core ≤165 min = 365 min) exceeded the 240-min core period, so under GH
    # cron drift the runs stacked and PENDING core runs were repeatedly EVICTED (three cancelled
    # core cycles on 07-13; two never started — startedAt null). 3x/day pilots loses almost no
    # freshness: GWAM (ICON waves) publishes 2 runs/day, GFS-Wave 4/day — 6x/day was re-ingesting
    # the SAME model runs. Worst-case group load now ~(200+165)×3 within 1440 min with wide gaps.
    - cron: '45 3,11,19 * * *'

concurrency:
  group: forecast-ingest-pilots  # OWN lane since 2026-07-14 — manifest merge-on-upload made core overlap safe (see header)
  cancel-in-progress: false

jobs:
  ingest-pilots:
    runs-on: ubuntu-latest
    # 165 → 200 (2026-07-13): measured phase ledger from run 29249603524 (cancelled at the old
    # wire): GFS mid 32m + ICON mid 17m + EURO mid 4m + GFS marine pilot 51m (was ~21m at the
    # 07-04 baseline — worldwide 2/cycle + 0.25° 8-day NOAA fetches ballooned it, own audit item)
    # + ICON marine pilot 29m (now bounded to ~10m: flagship-only + 2d) + wind pilots ~50m+
    # ≈ 185m healthy total — the lane was ALREADY over 165 before the ICON pilot landed. 200
    # keeps 40 min under the 240-min cron interval (shared-group serialization stays safe).
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
      # ⚠️ 3.12 TO MATCH PRODUCTION, WHICH THIS LANE FEEDS. The server runs 3.12 (measured:
      # /api/health `runtime.python`), and this lane was 3.11 — so the artifacts were written by one
      # numeric stack (numpy 2.4.6) and read by another (2.5.1).
      # ★ CLEARED BY AN ARTIFACT-LEVEL CHECK, NOT BY THE JOB GOING GREEN: the composition and the
      #   numpy-backed ocean_access helpers were driven on FIXED inputs under both interpreters and
      #   produced BYTE-IDENTICAL output (6064 B, sha256 2fd2d006f740...), with a mutation control
      #   on each side proving the harness could detect a difference at all.
      #   Re-run it before any future interpreter move: workflow `artifact-interpreter-parity`.
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run regional-pilot ingestion -> Supabase L2
        working-directory: backend
        env:
          NODE_ENV: production
          RENDER: 'true'
          MANIFEST_IMMUTABLE_PUBLICATION: '0' # Dark: same publication contract as core writer
          MANIFEST_PUBLISH_ONE_STEP: '1' # ENABLED 2026-10-17 on the owner's explicit word (#350): read-merge-CAS in one step; ALL manifest writers together (forecast-ingest, pilots, precompute, sim-parity-monitor); NOT Render. Kill: set '0' in all four.
          FORECAST_JOB_STAGGER_SEC: '0'
          INGEST_PILOTS: 'only'             # pilots only — the core cycle owns the globals
          CONSENSUS_INGEST: '1'         # ARMED by the owner's merge of the arming PR (D-009; declared '0' by #164). '1' builds the equal GFS/EURO/ICON mean as the SHADOW model CONSENSUS in the pilots lane (consensus_ingest.py) and adds the `raw_surf:CONSENSUS` lane to the skill ledger that forecast-ingest.yml and precompute.yml run. Serves nothing either way. ARM ALL THREE TOGETHER: forecast-ingest-pilots.yml, forecast-ingest.yml, precompute.yml.
          SAMPLER_SCALAR_HEIGHT: '1'    # FLIPPED 2026-10-17 on the owner's word, GFS first (SAMPLER_SCALAR_HEIGHT_MODELS; evidence: ledger 1345, gate YES; declared dark at default 2026-09-30): '1' interpolates a MARINE height as the scalar it is (the corners' weighted mean) instead of sqrt(u^2+v^2) of their vector mean, which shrinks it wherever the corners' directions diverge (islands, headlands: NDBC 51202 served 0.98 m, scalar 1.45, same-model cell 1.44, buoy 2.0; 11% of rated spots read > 5% low). Direction keeps the vector mean; wind is untouched. See sampler.scalar_marine_height_enabled. Moves served heights on every surface: flip ONLY on the owner's word, in ALL of forecast-ingest.yml, forecast-ingest-pilots.yml, precompute.yml AND the Render env together.
          SAMPLER_SCALAR_HEIGHT_MODELS: 'GFS'  # DECLARED AT DEFAULT (2026-10-17, dark): which models SAMPLER_SCALAR_HEIGHT applies to once it is flipped (comma list; '*' = every model; empty = none). GFS first: its scalar lane is the only one graded; ICON and EURO join only after their own shadow lanes are read. No effect while SAMPLER_SCALAR_HEIGHT is '0'. Same value in ALL of forecast-ingest.yml, forecast-ingest-pilots.yml, precompute.yml AND the Render env.
          COPERNICUS_PEAK_PERIOD: '0'   # DECLARED AT DEFAULT (2026-10-20, dark; served periods): '1' fetches CMEMS VTPK (spectral PEAK period, what surf_transform/period_quality are written for) as the total wave_period instead of VTM10 (energy period, kept as wave_period_tm10). services/cmems_period_map.py. Moves served heights and ratings: flip ONLY on the owner's word, in ALL of forecast-ingest.yml, forecast-ingest-pilots.yml, precompute.yml AND the Render env together.
          ICON_PEAK_PERIOD: '0'         # DECLARED AT DEFAULT (2026-10-20, dark; served periods): '1' fetches DWD GWAM partition PEAK periods ppts/ppww (were mean mpts/mpww) and serves a smooth blended total peak period (was tm10, kept as wave_period_tm10). services/gwam_peak_period.py. Moves served heights and ratings: flip ONLY on the owner's word, in ALL of forecast-ingest.yml, forecast-ingest-pilots.yml AND precompute.yml together (not a Render flag).
          ICON_PEAK_PERIOD_SHARPNESS: '2'  # DECLARED AT DEFAULT (2026-10-20): blend exponent for ICON_PEAK_PERIOD (w ~ (H^2 Tp)^p). Inert while ICON_PEAK_PERIOD is '0'. Same value in all three lanes.
          REGRID_NATIVE_CELL: '1'       # FLIPPED by the owner's merge of the flip PR (D-010; declared '0' by #171, made coast-safe by #173: real GRIB run 36626767710 on its final code lost 0 total-height values). '1' makes every 0.25-deg regional wave tile (GFS, ICON and EURO) read its EXACT native cell; at '0' each node is the 2x2 block NORTH-WEST of it (half = max(1, round(0.25/0.25/2)) = 1), a mean placed half a cell (~14 km) south-east of its water, found by same_model_parity_probe (node = Open-Meteo's NW 2x2 to 1 cm on 72% of rows). Coarser tiers are untouched. Moves served heights and directions on every regional tile: flip ONLY on the owner's word, and in BOTH fetch lanes together (forecast-ingest.yml, forecast-ingest-pilots.yml), never one, or the same coast is regridded two ways by cycle. See services/_fetch_native_cell.py.
          GFS_MARINE_STAGE_B: '1'       # FLIPPED by the owner (2026-09-29: 'flip the Stage B PNW box'; D-011; declared '0' by #177). '1' adds the F-08 Stage B GFS-only box us_pacific_northwest (38-49N, 128-122W: NorCal, Oregon, Washington, 23 spots) to the GFS marine pass. Measured first: the 2-deg tier those spots use today reads +0.097 m vs the same model (46244 Humboldt +0.50 m). Flip in BOTH fetch lanes together.
          ECMWF_PERIOD_BANDS: '0'           # DECLARED AT DEFAULT (2026-08-02, audit v5 F8). This lane shares `scripts/ingest_forecast_ci.py` with forecast-ingest.yml and REACHES the ECMWF fetcher (via euro_marine_coarse_ingestion -> ecmwf_wave_service, and marine_mid_res_ingestion for the 0.25 deg regional tiles), so it must carry the same value. Flipped in the core lane only, the global coarse EURO field would carry period bands while every regional tile did not — THE SAME COAST WOULD DECOMPOSE ITS SEA DIFFERENTLY BY ZOOM LEVEL. ⚠️ Verified by import-graph walk, not assumed: precompute.yml reaches NO ecmwf module (57 files walked) and correctly does NOT declare this; this lane reaches it (81 files walked) and does.
          ECMWF_WAVE_LAND_CENTRE_BLOCK: ${{ vars.ECMWF_WAVE_LAND_CENTRE_BLOCK || '0' }}  # DARK (2026-10-23, #480): EURO's own block values at land-centre nodes (dir/period from the height's block). ONE repo variable read by forecast-ingest.yml AND forecast-ingest-pilots.yml (10-deg EURO here, 2-deg global_mid in pilots), so one `gh variable set` flips both lanes together. Flip only on the owner's word (D-001).
          ECMWF_WAVE_LAND_CENTRE_REACH: ${{ vars.ECMWF_WAVE_LAND_CENTRE_REACH || '4' }}  # native cells from the centre to ECMWF sea; 4 = the whole 2-deg block (842 of 868 masked GFS-sea nodes; 2 = 575). Inert while the flag above is '0'. Same repo variable in both lanes.
          GFS_PILOT_WHOLE_DEGREE_BOUNDS: ${{ vars.GFS_PILOT_WHOLE_DEGREE_BOUNDS || '0' }}  # DARK (2026-10-25): GFS pilot tiles stored out to whole degrees on fractional edges (pilot_regions.whole_degree_regions; tile-edge source mix). ONE repo variable read by forecast-ingest.yml AND forecast-ingest-pilots.yml (both lanes write GFS tiles). Flip only on the owner's word (D-001).
          GFS_WORLD_FULL_HORIZON: ${{ vars.GFS_WORLD_FULL_HORIZON || '0' }}  # DARK (2026-10-24, the day-14 end): '1' fetches the GFS WORLD tiers (2-deg global_mid here, riding the flagship pass, which then downloads 16 d and trims every regional tile back to its own horizon) NOAA-direct to f384 instead of 14 d. Same repo variable as forecast-ingest.yml (10-deg global_coarse). Moves served numbers: flip only on the owner's word (D-001).
          WORLDWIDE_REGIONS_PER_CYCLE: '3'  # 12 worldwide regions / 3 per fire = 4 fires = 32 h cadence — RAISED 2->3 with the 2026-08-09 four-region expansion; the divisor and the region count move TOGETHER (test_worldwide_count_and_per_cycle_keep_the_32h_cadence)
          # GFS marine pilot horizon: 8d → 3d (2026-07-13) → 5d (2026-08-01).
          #
          # The 3d cut was correct FOR ITS TIME: cost was ∝ forecast-hours × REGIONS, because each
          # region did its own download pass (run 29265599972: 48.5 min = 4 regions × ~11.5 min;
          # 672-pt FL and 5760-pt Brazil took the SAME time — the tell that the bbox never reached
          # the wire). Multi-bbox (2026-07-31) removed the × REGIONS term: one pass per HORIZON
          # GROUP now covers all 10 regions, and this lane's marine download fell 276 → 138 steps.
          #
          # 3d → 5d is that freed budget spent where measurement says it pays. Two measurements:
          #   • What the coarse tier costs (scripts/tier_resolution_delta.py, 8 regions holding both
          #     tiers): BREAKING height median 21.0%, max 41.7%, signed both ways. Systematic
          #     geometry error — it does NOT shrink with lead the way forecast error grows.
          #   • Forecast uncertainty at that lead, as inter-model spread with the TIER HELD CONSTANT
          #     (all 3 models forced onto global_mid — mixing tiers inflated 72h by 68% and nearly
          #     produced the opposite conclusion): 24h 24.1%, 72h 23.6%, 120h 36.0%.
          # Ratio of uncertainty to resolution is 1.13-1.72x out to day 5 — COMPARABLE, so the
          # refinement is real there, not swamped. Past ~day 5 it is unmeasured (ICON/EURO have no
          # global_mid product beyond their native horizons), so the horizon stops at 5d rather
          # than guessing. Do not raise further without re-running both instruments.
          #
          # Cost: download 138 → 154 steps (+12%, inside what multi-bbox freed); regional marine
          # products 1,704 → 2,216 per fire (~+4% of the 12k-product manifest).
          # Revert = set this back to '3'. Pilot-lane-only: this env is set per-workflow.
          GFS_MARINE_FORECAST_DAYS: '5'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          WEATHER_PROXY_URL: ${{ secrets.WEATHER_PROXY_URL }}
          # §3 Option A dominant-swell animation channel (2026-07-13). A/B via repo Actions
          # VARIABLES (Settings → Secrets and variables → Actions → Variables) — no commit needed.
          WAVES_ANIM_DOMINANT_SWELL: ${{ vars.WAVES_ANIM_DOMINANT_SWELL || '0' }}
          WAVES_ANIM_SWELL_MIN_FRAC: ${{ vars.WAVES_ANIM_SWELL_MIN_FRAC || '0.35' }}
          # ICON marine 0.25° regional pilot (2026-07-13, round-12 §2a-i — ICON close-zoom fix).
          # No-commit kill via repo Actions variable: set ICON_MARINE_PILOT_INGEST=0.
          ICON_MARINE_PILOT_INGEST: ${{ vars.ICON_MARINE_PILOT_INGEST || '1' }}
          # EURO marine 0.25° regional pilot (2026-07-13 — the EURO rating-band resolution fix,
          # free ECMWF wave stream, no CMEMS). No-commit kill: set EURO_MARINE_PILOT_INGEST=0.
          EURO_MARINE_PILOT_INGEST: ${{ vars.EURO_MARINE_PILOT_INGEST || '1' }}
        run: python scripts/ingest_forecast_ci.py

      # STATIC FORECAST FRAMES (step 2b, 2026-10-20; client ON since 2026-10-21): every stored product of each world set in
      # services/frame_set.SETS (2026-10-22: GFS waves, swell_1, swell_2, wind_waves; ICON waves, swell_1, wind_waves; EURO
      # waves; GFS 10 m wind; all global_mid) as one gzipped binary frame (~56 KB) in the PUBLIC bucket `weather-frames`, each decoded and
      # checked node by node against its source
      # (2026-10-23, services/frame_set_bundle.py: GFS waves, then swell_1, swell_2 and wind_waves, on every GFS marine pilot box,
      # after the world sets, each set as ONE
      # immutable bundle per run with an offset table, so 19 boxes cost 19 uploads; off with FRAME_REGIONAL_BUNDLES=0)
      # before upload, plus an immutable run index and a no-cache v1/latest.json pointer written LAST; only changed frames
      # are uploaded; the current and previous index are kept and older objects deleted. Also writes the one-field PNG
      # proof + manifest.json. Built ONLY from this runner's own product files: nothing is downloaded from weather-products,
      # except ONE object for the GFS wind set (2026-10-22, services/frame_set_wind.py): the HRRR lane the serve box loads
      # (wind_lane/index.json -> its ~4.5 MB cycle), applied to every wind frame as /grid applies it (D-017); the step then
      # keeps v1/wind_lane.json (the lane pointer the client checks) naming that lane.
      # WHY THIS LANE: the GFS world products are pilot jobs (scheduler/forecast.py pilot_jobs; global_mid rides the GFS
      # Marine Pilot pass). This lane's disk held all 113 (run 39543806662); the core lane's only 60, 5 within 0-165 h
      # (run 39546548998). It must run in THIS lane only: two publishers' retention could delete each other's frames.
      # A set below FRAME_MIN_COVERAGE (0.9) of its AUTHORITATIVE entries publishes nothing (the ICON/EURO estimated tails
      # are baked by the core lane: listed unbuilt, /grid serves them). Past FRAME_PUBLISH_BUDGET_S (default 600 s) no
      # further set starts this run (it keeps its published index); FRAME_SETS (comma list of set keys) narrows a run. The
      # client reads it by default (kill: window.__RAW_DISABLE_STATIC_FRAMES__; per set: __RAW_DISABLE_STATIC_FRAMES_SETS__).
      # Can never fail the ingest cycle (continue-on-error).
      # ON: repository variable FRAME_IMAGES_PUBLISH = '1' (Settings > Secrets and variables > Actions > Variables).
      - name: Publish static forecast frames (dark)
        if: ${{ success() && vars.FRAME_IMAGES_PUBLISH == '1' }}
        continue-on-error: true
        timeout-minutes: 15
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # DARK (2026-10-24): '1' downloads the ICON/EURO world estimated tails the core lane bakes (not on this disk) so they
          # become frames too, parity-gated like every frame; changed ones only, at most FRAME_TAIL_DOWNLOAD_MAX per run, wire
          # bytes in the step summary (__tail_downloads__). Off: /grid serves those hours, as before. No served number moves.
          FRAME_TAIL_DOWNLOAD: ${{ vars.FRAME_TAIL_DOWNLOAD || '0' }}
          FRAME_TAIL_DOWNLOAD_MAX: ${{ vars.FRAME_TAIL_DOWNLOAD_MAX || '240' }}
          # The EURO/ICON world sets with the targeted Gulf fill baked in (services/frame_set_fill.py) publish only while the mode
          # read from these two is 'targeted', the way the box reads them. Keep them EQUAL to the Render env (the box's mode): the
          # client serves a filled set only while /capabilities reports the same mode, so a mismatch costs speed, never a number.
          MARINE_GULF_FILL_MID: ${{ vars.MARINE_GULF_FILL_MID || '1' }}
          MARINE_GULF_FILL_MID_TARGETED: ${{ vars.MARINE_GULF_FILL_MID_TARGETED || '0' }}
        run: python scripts/publish_frame_images.py

      # RASTER STATIC FRAMES (2026-10-23, free-GRIB raster phase 1, services/frame_set_raster.py): GFS mean-sea-level pressure
      # (NOAA pgrb2.0p25 PRMSL by .idx byte range from AWS Open Data, every second point = 720 x 361 at 0.5 deg, f000-f336 every
      # 3 h) as RSWF frames in the same public bucket, set GFS/weather/pressure/global_0p5. Its OWN step, after the frames step
      # (one latest.json writer at a time), with its own budget (FRAME_RASTER_BUDGET_S, default 420 s) and timeout; it reads no
      # stored product, so it does not wait on the ingest. A cycle latest.json already lists uploads nothing. The client half
      # is dark (raster-instant session): publishing changes nothing a user sees. Off: repo variable FRAME_RASTER_PRESSURE=0.
      - name: Publish raster static frames (pressure; client dark)
        if: ${{ !cancelled() && vars.FRAME_IMAGES_PUBLISH == '1' && vars.FRAME_RASTER_PRESSURE != '0' }}
        continue-on-error: true
        timeout-minutes: 12
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/publish_raster_frames.py

      # RASTER PHASE 2 (2026-10-23, the same contract, services/frame_set_raster.py SPECS): GFS 2 m temperature (TMP, K -> degC,
      # field 7 temp_c) and total cloud cover (TCDC entire atmosphere, the INSTANTANEOUS message, never the 0-N h mean; field 8
      # cloud_pct), each as its own step with its own budget (FRAME_RASTER_BUDGET_S, 420 s) and a 12-minute timeout (each ran in about a minute on a real cycle), after pressure (one latest.json writer at a time). OFF until
      # switched on: repo variables FRAME_RASTER_TEMPERATURE=1 / FRAME_RASTER_CLOUD=1 (the client is dark either way).
      - name: Publish raster static frames (temperature; off unless FRAME_RASTER_TEMPERATURE=1)
        if: ${{ !cancelled() && vars.FRAME_IMAGES_PUBLISH == '1' && vars.FRAME_RASTER_TEMPERATURE == '1' }}
        continue-on-error: true
        timeout-minutes: 12
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRAME_RASTER_TEMPERATURE: ${{ vars.FRAME_RASTER_TEMPERATURE }}
        run: python scripts/publish_raster_frames.py --set temperature

      - name: Publish raster static frames (cloud cover; off unless FRAME_RASTER_CLOUD=1)
        if: ${{ !cancelled() && vars.FRAME_IMAGES_PUBLISH == '1' && vars.FRAME_RASTER_CLOUD == '1' }}
        continue-on-error: true
        timeout-minutes: 12
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRAME_RASTER_CLOUD: ${{ vars.FRAME_RASTER_CLOUD }}
        run: python scripts/publish_raster_frames.py --set cloud_cover

      # PER-MODEL PRESSURE (2026-10-23; the owner, 20:13 EDT: "Yes start it", answering "start the per-model pressure route?"
      # after "We want each models pressure showing"). EURO = ECMWF IFS open data msl (CC BY 4.0, attribution required), the
      # same stream the box's ecmwf_opendata_fetcher reads, 00/12Z cycles (0-240 h; 3-hourly to 144 h, then 6-hourly), onto
      # the GFS set's 0.5-degree lattice. OFF until switched on: repo variable FRAME_RASTER_PRESSURE_EURO=1 (client dark).
      - name: Publish raster static frames (EURO pressure; off unless FRAME_RASTER_PRESSURE_EURO=1)
        if: ${{ !cancelled() && vars.FRAME_IMAGES_PUBLISH == '1' && vars.FRAME_RASTER_PRESSURE_EURO == '1' }}
        continue-on-error: true
        timeout-minutes: 12
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRAME_RASTER_PRESSURE_EURO: ${{ vars.FRAME_RASTER_PRESSURE_EURO }}
        run: python scripts/publish_raster_frames.py --set pressure_euro

      # ICON = DWD ICON global pmsl (icosahedral R3B7, attribution "Deutscher Wetterdienst"), the same files the box's
      # dwd_icon_pressure_fetcher reads, 00/12Z runs (0-180 h, every 3 h), box-averaged onto the lattice once per run
      # (frame_set_raster_sources: method + measured error). OFF until switched on: repo variable FRAME_RASTER_PRESSURE_ICON=1.
      - name: Publish raster static frames (ICON pressure; off unless FRAME_RASTER_PRESSURE_ICON=1)
        if: ${{ !cancelled() && vars.FRAME_IMAGES_PUBLISH == '1' && vars.FRAME_RASTER_PRESSURE_ICON == '1' }}
        continue-on-error: true
        timeout-minutes: 30
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRAME_RASTER_PRESSURE_ICON: ${{ vars.FRAME_RASTER_PRESSURE_ICON }}
          FRAME_RASTER_BUDGET_S: "900"
        run: python scripts/publish_raster_frames.py --set pressure_icon
