name: Gust verification record (GFS / EURO / ICON gusts vs NDBC; offline collection, serves nothing)

# WHY: the Gusts layer serves each model's own gust (David turned it on 2026-11-18). The SOTA path he accepted: verify the
# gusts against buoys over weeks and every lead, beat simple baselines, and only then correct a per-model bias. DWD keeps
# ICON for about a day and data.ecmwf.int EURO for a few, so each day's 00Z run is saved while it is reachable.
# Method (pre-registered): docs/weather-program/log/2026-11-18-opus-gust-verification.md section 1.
# Reads PUBLIC data only (NOAA GFS on AWS, ECMWF open data, DWD open data, NDBC). It never calls the Raw Surf backend and
# writes no manifest or product: only create-only calibration/gust_verify/ objects in the weather bucket.
# CREDENTIALS (the wind-emos-collect.yml pattern): the service-role key exists ONLY in the storage steps, which run the
# standard-library script gust_bucket_io.py as `python3 -I -S`. Installing, collecting and scoring run with no credential.
# ON by default; kill: the repository variable GUST_VERIFY_COLLECT = '0' (the `(vars.X || '1') != '0'` form).
# Daily at 11:17 UTC: the 00Z GFS (~05Z), EURO (~08Z) and ICON (~04Z) runs are complete and DWD still holds ICON's; clear of
# the EMOS (10:07) and SST (16:23) minutes. A pull request that changes these files runs a DRY run (no key, no upload): a
# 7-day GFS / EURO backfill from the public archives plus today's three runs, scored, as an artifact.

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily | backfill | score'
        default: 'daily'
      start:
        description: 'backfill start YYYY-MM-DD (GFS and EURO only; ICON has no archive)'
        default: ''
      end:
        description: 'backfill end YYYY-MM-DD (inclusive)'
        default: ''
  pull_request:
    paths:
      - '.github/workflows/gust-verify.yml'
      - 'backend/scripts/gust_verify_collect.py'
      - 'backend/scripts/gust_verify_score.py'
      - 'backend/scripts/gust_bucket_io.py'

permissions:
  contents: read

concurrency:
  group: gust-verify-${{ github.event_name == 'pull_request' && github.ref || 'record' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: '1'
  MODE: ${{ github.event.inputs.mode || 'daily' }}
  GV: ${{ github.workspace }}/gv_data

jobs:
  record:
    if: ${{ github.event_name != 'pull_request' && (vars.GUST_VERIFY_COLLECT || '1') != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the stored record (storage only, stdlib)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 -I -S backend/scripts/gust_bucket_io.py fetch --dir "$GV" --all
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Collect (no credential)
        if: ${{ env.MODE != 'score' }}
        working-directory: backend
        timeout-minutes: 120
        run: |
          if [ "$MODE" = "backfill" ]; then
            python scripts/gust_verify_collect.py backfill --cache "$GV" --start "${{ github.event.inputs.start }}" --end "${{ github.event.inputs.end }}"
          else
            python scripts/gust_verify_collect.py daily --cache "$GV"
          fi
      - name: Upload new objects (storage only, stdlib, create-only)
        if: ${{ always() && env.MODE != 'score' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 -I -S backend/scripts/gust_bucket_io.py upload --dir "$GV"
      - name: Score the whole record (stdlib, no credential)
        if: ${{ always() }}
        run: python3 -I -S backend/scripts/gust_verify_score.py --dir "$GV" --out "$GV/score_report.json" --md "$GV/score_table.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gust-verify-${{ github.event.inputs.mode || 'daily' }}
          path: |
            ${{ env.GV }}/collect_report_*.json
            ${{ env.GV }}/score_report.json
            ${{ env.GV }}/score_table.md
          if-no-files-found: ignore

  dry-run:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Collect today's runs and a 7-day GFS / EURO backfill (no key, nothing uploaded)
        working-directory: backend
        timeout-minutes: 100
        run: |
          python scripts/gust_verify_collect.py daily --cache "$GV"
          python scripts/gust_verify_collect.py backfill --cache "$GV" --start "$(date -u -d '8 days ago' +%F)" --end "$(date -u -d '1 day ago' +%F)"
      - name: Score (stdlib)
        if: ${{ always() }}
        run: python3 -I -S backend/scripts/gust_verify_score.py --dir "$GV" --out "$GV/score_report.json" --md "$GV/score_table.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gust-verify-dry-run
          path: |
            ${{ env.GV }}/collect_report_*.json
            ${{ env.GV }}/score_report.json
            ${{ env.GV }}/score_table.md
            ${{ env.GV }}/stations.json.new
            ${{ env.GV }}/cycles/*.new
            ${{ env.GV }}/obs/*.new
          if-no-files-found: ignore
