# The weather program's ACTION LEDGER and memory record, verified on every change (BRAIN_RULES §23, 2026-09-29).
# The owner: "the only way is for you to be accountable for every action you do." docs/weather-program/ACTIONS.jsonl
# is hash-chained; this proves the chain, the STATE.md anchor and, on a pull request, that the base branch's ledger
# is a byte-exact PREFIX of the new one (history can only be appended to). `selftest` first proves the verifier
# catches every tamper it claims to (positive and null controls, LESSONS L-S4).
# ⚠️ ADVISORY: the `paths:` filter is deliberate, so this must NEVER become a required status check (a path-filtered
#   required check reports MISSING and blocks the branch; measured on `loc-check`). Standard library only.
# FRAGMENTS (owner, 2026-10-22 23:11 EDT; D-0XX): since the per-PR ledger fragments landed, a PR records its lines in
#   docs/weather-program/ledger.d/<branch-slug>.jsonl and never edits ACTIONS.jsonl; the lead's `fold-pr` chains them
#   in merge order. `check-pr` below is the guard. It is advisory here, and it binds through the lead's "arm
#   auto-merge only on a green ledger workflow" step. The lead's plan (2026-10-23): once it has run clean on real PRs
#   for a few days, it becomes a STEP inside an existing required ci.yml job (not a new job, so the 11 required checks
#   stay as they are). check-pr lists the PR's changed files with plain git first and passes a PR that touches no
#   ledger file before any ledger logic runs, so a checker bug fails CLOSED only on PRs that touch the ledger.
name: Weather Program Ledger

on:
  push:
    branches: [dev]
    paths:
      - 'docs/weather-program/**'
      - 'backend/scripts/action_ledger.py'
      - 'backend/scripts/ledger_fragments.py'
      - 'backend/scripts/memory_audit.py'
      - '.github/workflows/weather-program-ledger.yml'
  pull_request:
    paths:
      - 'docs/weather-program/**'
      - 'backend/scripts/action_ledger.py'
      - 'backend/scripts/ledger_fragments.py'
      - 'backend/scripts/memory_audit.py'
      - '.github/workflows/weather-program-ledger.yml'
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # the audit's completeness check reads every PR merge since the ledger began

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prove the verifier catches every tamper
        run: python backend/scripts/action_ledger.py selftest

      - name: Verify the ledger (chain, schema, STATE anchor; append-only against the base on a PR)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -e
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF"   # NOT --depth=1: that re-shallows the clone and blinds the completeness check
            if git cat-file -e FETCH_HEAD:docs/weather-program/ACTIONS.jsonl 2>/dev/null; then
              git show FETCH_HEAD:docs/weather-program/ACTIONS.jsonl > /tmp/base_actions.jsonl
              python backend/scripts/action_ledger.py verify --base /tmp/base_actions.jsonl
              exit 0
            fi
            echo "The base branch has no ledger yet: verifying without a prefix check."
          fi
          python backend/scripts/action_ledger.py verify

      # The fragment guard (D-0XX). On a pull_request event HEAD is GitHub's merge of the PR into the base, so the
      # check sees the ledger as it will be after the merge. A PR opened before ledger.d/README.md landed on the base
      # is LEGACY (created_at) and keeps the old direct append; a fold PR (branch ledger-fold/..., `Ledger-Fold:`
      # trailer) must equal the fold recomputed from the base; any other PR that edits ACTIONS.jsonl or the anchor
      # fails, as does one that edits or deletes a merged fragment, reuses a fragment name or adds an invalid line.
      - name: Check the PR's ledger changes (fragments, folds, the legacy transition)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: |
          set -e
          git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"   # full depth: the merge order needs it
          python backend/scripts/action_ledger.py check-pr --base "origin/$BASE_REF" --head HEAD \
            --head-ref "$HEAD_REF" --pr-created-at "$PR_CREATED_AT"

      - name: Prove the audit's own checks fire (completeness, commitments, clock, seq references, long memories)
        run: python backend/scripts/memory_audit.py --selftest

      - name: Audit the git memory record
        run: python backend/scripts/memory_audit.py --docs-only --require-history   # "cannot check" FAILS here
