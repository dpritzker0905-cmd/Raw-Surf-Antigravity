[build]
  base = "frontend"
  # ICON stored tail: dev branch deploys since D-016 (2026-10-04), production too since D-056 (owner, 2026-11-01).
  # Production honours an explicit value set in the Netlify UI (REACT_APP_ICON_STORED_TAIL=false is the kill switch).
  # The ICON infobox reads that same stored tail (REACT_APP_ICON_POINT_STORED_TAIL, P1-B, #660; owner flip 2026-11-01, D-058),
  # with the same production kill switch (=false in the Netlify UI). Deploy previews keep the default-off path.
  # context.dev means local Netlify Dev.
  command = "if [ \"$CONTEXT\" = \"branch-deploy\" ] && [ \"$BRANCH\" = \"dev\" ]; then export REACT_APP_ICON_STORED_TAIL=true REACT_APP_ICON_POINT_STORED_TAIL=true; elif [ \"$CONTEXT\" = \"production\" ]; then export REACT_APP_ICON_STORED_TAIL=\"${REACT_APP_ICON_STORED_TAIL:-true}\" REACT_APP_ICON_POINT_STORED_TAIL=\"${REACT_APP_ICON_POINT_STORED_TAIL:-true}\"; fi; node update-sw-version.js && npm install --legacy-peer-deps && CI=false npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "24.22.1"
  NODE_OPTIONS = "--openssl-legacy-provider"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  REACT_APP_BACKEND_URL = "https://raw-surf-antigravity.onrender.com"

# Production (main branch) - only rebuild when frontend files actually changed
[context.production]
  ignore = "node scripts/netlify-ignore.cjs"



# Dev branch - always build, gets stable URL at dev--rawsurf.netlify.app
[context.dev]
  ignore = "false"
  [context.dev.environment]
    REACT_APP_BACKEND_URL = "https://raw-surf-antigravity.onrender.com"

[context.branch-deploy]
  [context.branch-deploy.environment]
    REACT_APP_BACKEND_URL = "https://raw-surf-antigravity.onrender.com"

# NOTE (2026-07-13, round-11 §5b): /api/weather/* intentionally has NO function redirect.
# It falls through to the /api/* catch-all below (Netlify CDN proxy -> Render, ~26s window).
# The old /.netlify/functions/weather hop had a ~10s sync limit that dropped heavy
# grid_series requests. Do not re-add it.

[[redirects]]
  from = "/api/weather-proxy"
  to = "/.netlify/functions/weather-proxy"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://raw-surf-antigravity.onrender.com/api/:splat"
  status = 200
