[build]
  base = "frontend"
  command = "node update-sw-version.js && npm install --legacy-peer-deps && CI=false npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18.20.2"
  NODE_OPTIONS = "--openssl-legacy-provider"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  REACT_APP_BACKEND_URL = "https://raw-surf-antigravity.onrender.com"

# Production (main branch) - only rebuild when frontend files actually changed
[context.production]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- frontend/src frontend/public netlify.toml"



# Dev branch - always build, gets stable URL at dev--rawsurf.netlify.app
[context.dev]
  ignore = "false"
  [context.dev.environment]
    REACT_APP_BACKEND_URL = ""

[context.branch-deploy]
  [context.branch-deploy.environment]
    REACT_APP_BACKEND_URL = ""

[[redirects]]
  from = "/api/weather/*"
  to = "/.netlify/functions/weather/:splat"
  status = 200

[[redirects]]
  from = "/api/weather-proxy"
  to = "/.netlify/functions/weather-proxy"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://raw-surf-antigravity.onrender.com/api/:splat"
  status = 200

