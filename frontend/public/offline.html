<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Raw Surf</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 400px; }
    .wave-icon {
      width: 80px; height: 80px;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(16, 185, 129, 0.15));
      display: flex; align-items: center; justify-content: center;
      animation: bob 3s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .wave-icon svg { width: 40px; height: 40px; color: #06b6d4; }
    h1 {
      font-size: 24px; font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #06b6d4, #10b981);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    p { color: #9ca3af; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .retry-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #06b6d4, #10b981);
      color: white; font-weight: 600; font-size: 14px;
      border: none; border-radius: 12px; cursor: pointer;
      transition: all 0.2s;
    }
    .retry-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3); }
    .retry-btn:active { transform: translateY(0); }
    .cached-hint {
      margin-top: 32px; padding: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      color: #6b7280; font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="wave-icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>
      Looks like the tide is out on your internet connection.
      Your cached surf spots and galleries are still available.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Try Again
    </button>
    <div class="cached-hint">
      💡 Your saved surf spots, galleries, and feed posts are available offline through the app cache.
    </div>
  </div>
</body>
</html>
