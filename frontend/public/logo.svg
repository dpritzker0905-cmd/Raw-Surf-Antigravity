<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Sleek dark background ring -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Glowing Sun/Sunset behind the wave -->
  <circle cx="250" cy="210" r="110" fill="url(#sunGrad)" opacity="0.9" />
  
  <!-- Elegant ocean wave crashing -->
  <path d="M 80 380 C 140 380 180 340 220 280 C 260 220 300 160 380 160 C 340 190 320 230 320 270 C 320 320 360 350 420 380 C 320 395 180 395 80 380 Z" fill="url(#waveGrad)" />
  <path d="M 110 380 C 160 380 190 350 230 300 C 260 250 290 200 350 200 C 320 220 300 250 300 285 C 300 325 330 355 380 380 C 300 390 190 390 110 380 Z" fill="#ffffff" opacity="0.8" />
  
  <!-- Surfboard outline slicing through the wave -->
  <path d="M 230 310 C 240 280 265 200 270 170 C 275 200 300 280 310 310 C 290 315 250 315 230 310 Z" fill="#ffffff" />
  <path d="M 270 170 L 270 312" stroke="#ef4444" stroke-width="3" />
</svg>
